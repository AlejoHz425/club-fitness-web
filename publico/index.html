    id:m.id, uid:m.uid, dni:m.dni||'', name:m.name, sex:m.sex||'', edad:m.edad,
    born:m.born||'', plan:m.plan||null, joined:m.joined,
    /* Dos relojes distintos, y no hay que mezclarlos:
       · planEnd  = hasta cuándo PAGÓ. Manda en vencidos, cobros y avisos.
       · ciclo    = la tanda de clases, que corre desde su PRIMERA clase y
                    se reinicia sola cada tantos meses. Manda en el conteo
                    de sesiones, y en nada más.
       Si planEnd viene vacío es que al club le falta anotarlo: eso sale en
       «Falta», no como vencido. */
    ciclo: m.ciclo||null,
    planEnd: m.planEnd||null,
    venceHoja: m.planEnd||null,
    active:m.active!==false, frozen:!!m.frozen, ses:m.ses,
    goal:m.goal||'', dir:m.dir||'mantener', phone:m.phone||'', email:m.email||'',
    obs:m.obs||'', pinPropio:!!m.pinPropio,
    /* lo que paga ESTE socio: solo se usa en los planes negociados */
    precio: m.precio==null ? null : +m.precio
  }));
  db.bookings = (p.reservas||[]).map(r=>({
    id:r.id, m:r.m==='_otro'?'_otro':(r.inv?'_inv':r.m), inv:r.inv||null,
    c:r.c, date:r.date, st:r.st, sinHora:!!r.sinHora,
    at: r.c ? r.date+'T'+((db.classes.find(c=>c.id===r.c)||{}).time||'00:00') : r.date
  }));
  db.meas  = (p.valoraciones||[]).map(v=>{
    const d=Object.assign({},v);
    ['w','h','peso','talla','bf','fat','lean','arm','armF','waist','hip','thigh','calf',
     'pTri','pSub','pBic','pIli','pSup','pAbd','pMus','pPie',
     'cBra','cBraF','cCin','cCad','cMus','cPie'].forEach(k=>{
      if(d[k]!=null) d[k]=+d[k];
    });
    return d;
  });
  db.nutri  = p.dietas||[];
  db.blocks  = (p.bloqueos||[]).map(b=>({c:b.c,date:b.date,note:b.note||''}));
  db.noRepes = p.noRepes||[];
  db.news   = db.news||[];
  db.water  = db.water||{};  db.adh=db.adh||{};
  db.photos = db.photos||{}; db.checks=db.checks||{};
  db.notes  = db.notes||[];  db.workouts=db.workouts||[];
  /* un cambio de hora al día: el servidor lleva la cuenta */
  db.cambiosHoy = p.cambiosHoy||0;
  db.cambiosMax = p.cambiosMax!=null ? p.cambiosMax : 1;
  db.diaDeHoy   = window.CF.today();
  db.v = DBX.SEED_V;
  DBX.save();
  caido = false;
  ultima = Date.now();
}

/* ─── pedir el estado ───────────────────────────────────── */
async function sincronizar(){
  if(!ses || !ses.token) return false;
  if(enVuelo) return enVuelo;
  enVuelo = (async()=>{
    try{
      const p = await rpc('cf_estado',{p_token:ses.token});
      if(!p || !p.ok){
        if(p && p.motivo==='sesion'){ cerrar(true); }
        return false;
      }
      aplicar(p);
      /* Las sesiones que ya estaban abiertas antes del cambio de vista
         no llevan la lista guardada: se pide una sola vez y se queda
         con la sesión. Las nuevas ya la traen de la entrada. */
      if(ses && ses.vistas===undefined){
        try{
          const v = await rpc('cf_vistas',{p_token:ses.token});
          ses.vistas = (v && v.ok && v.vistas && v.vistas.length) ? v.vistas : null;
          localStorage.setItem(LLAVE, JSON.stringify(ses));
        }catch(e){}
      }
      /* el club ve además quién tiene cuenta para entrar al panel */
      if(p.rol==='admin'){
        try{
          const c = await rpc('cf_cuentas',{p_token:ses.token});
          if(c && c.ok){ window.CFDB.db.cuentas = c.cuentas||[]; window.CFDB.save(); }
        }catch(e){}
      }
      return true;
    }catch(e){
      caido = true;
      return false;
    }finally{ enVuelo = null; }
  })();
  return enVuelo;
}

/* ─── guardar algo en el club ───────────────────────────────
   La app ya pintó el cambio; aquí se manda al servidor. Si el
   servidor dice que no (otro se adelantó al cupo, la sesión
   caducó), se avisa y se vuelve a pedir el estado de verdad. */
function empujar(fn, args, alLlegar){
  if(!ses || !ses.token) return;
  rpc(fn, Object.assign({p_token:ses.token}, args||{}))
    .then(async r=>{
      if(r && r.ok){
        if(alLlegar) alLlegar(r);
        await sincronizar();
        if(window.CFR && window.CFR.render) window.CFR.render();
        return;
      }
      if(r && r.motivo==='sesion'){ cerrar(true); return; }
      /* el club manda: se deshace lo que la app había pintado */
      await sincronizar();
      if(window.CFT) window.CFT((r&&r.msg)||'El club no pudo guardar ese cambio','bad');
      if(window.CFR && window.CFR.render) window.CFR.render();
    })
    .catch(()=>{
      caido = true;
      if(window.CFT) window.CFT('Sin conexión: ese cambio no se guardó. Vuelve a intentarlo.','bad');
    });
}

/* ─── entrar y salir ────────────────────────────────────── */
function guardar(s){
  ses = s;
  try{ localStorage.setItem(LLAVE, JSON.stringify(s)); }catch(e){}
}
function cerrar(caducada){
  const habia = !!ses;
  ses = null;
  try{ localStorage.removeItem(LLAVE); }catch(e){}
  if(caducada && habia && window.CFLOGOUT) window.CFLOGOUT(true);
}

/* ─── el latido: cada 45 s mientras la app esté a la vista ── */
function latir(){
  if(document.hidden || !ses) return;
  if(Date.now()-ultima < 30000) return;
  sincronizar().then(ok=>{ if(ok && window.CFR && window.CFR.render) window.CFR.render(); });
}
setInterval(latir, 45000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) latir(); });

window.CFNET = {
  rpc, sincronizar, empujar, guardar, cerrar, aplicar,
  get ses(){ return ses; },
  get hay(){ return !!(ses && ses.token); },
  get caido(){ return caido; },
  toca(){ ultima = 0; }
};
})();
</script>
<script>
(function(){
'use strict';
const C=window.CF,DBX=window.CFDB;
const {ic,$,$$,esc,clamp,uid,PEN,DOW,DOWL,MON,ymd,parseYmd,addDays,sumaMeses,daysBetween,fmtD,fmtDL,
       today,nowMin,t2m,m2t,initials,rel}=C;

/* ═══ ESTADO ══════════════════════════════════════════════ */
const S={user:null,route:'inicio',ctx:{},day:today(),seg:{},cmp:50};
window.CFS=S;

/* ═══ CONSULTAS ═══════════════════════════════════════════ */
const Q={
  member:id=>DBX.db.members.find(m=>m.id===id),
  /* Clave de fábrica: todos los socios arrancan con 0000 y la app les obliga
     a cambiarla en cuanto entran. Mientras un socio tenga 0000 no está
     protegido, así que el cambio no se puede saltar. */
  PIN0:'0000',
  /* ── Durnin & Womersley (1974) + Siri (1961) ────────────────
     Es la misma cuenta que hace el nutricionista en su Excel y la misma
     que guarda el club al recibir la valoración. Las dos constantes (C y M)
     no se eligen a mano: salen del sexo y del tramo de edad.
        Densidad = C − M · log10(tríceps + bíceps + subescapular + cresta ilíaca)
        % grasa  = 495 / Densidad − 450                                      */
  /* La tabla vive en un solo sitio (CFANT, comprobada contra sus planillas):
     aquí solo se le pregunta, para no tener dos copias que se separen. */
  tramoDW(sexo,edad){
    const e=(edad==null||isNaN(edad))?30:+edad;
    const cortes=[19,29,39,49,999];
    const hasta=cortes.find(x=>e<=x)||999;
    const c=window.CFANT.dwCoef(sexo,e);
    return {hasta:hasta,C:c[0],M:c[1]};
  },
  tramoTexto(sexo,edad){
    const t=this.tramoDW(sexo,edad);
    const nom = t.hasta===19?'16 a 19 años' : t.hasta===999?'50 años o más'
              : (t.hasta-9)+' a '+t.hasta+' años';
    return ((sexo==='F')?'Mujeres · ':'Hombres · ')+nom;
  },
  /* devuelve {suma, densidad, grasa} o null si falta algún pliegue */
  composicion(sexo,edad,tri,bic,sub,ili){
    const v=[tri,bic,sub,ili].map(x=>(x===''||x==null)?null:+x);
    if(v.some(x=>x==null||isNaN(x)||x<=0)) return null;
    const suma=v.reduce((a,b)=>a+b,0);
    const t=this.tramoDW(sexo,edad);
    const dens=t.C - t.M*(Math.log(suma)/Math.LN10);
    const g=495/dens-450;
    if(!isFinite(g)) return null;
    return {suma:+suma.toFixed(1), densidad:+dens.toFixed(6),
            grasa:+g.toFixed(2), C:t.C, M:t.M};
  },
  /* Un plan sin precio de lista es un plan negociado: cada socio paga lo
     suyo y el monto se guarda en su ficha, no en el plan. */
  planNegociado(k){ const p=k&&DBX.PLANS[k]; return !!p && p.price==null; },
  /* lo que paga un socio: su monto si lo tiene, si no el del plan */
  cuotaDe(m){
    if(!m) return null;
    if(m.precio!=null) return +m.precio;
    const p=DBX.PLANS[m.plan];
    return p&&p.price!=null ? +p.price : null;
  },
  /* ── hasta cuándo se puede reservar ──────────────────────────
     Solo la semana en curso. La semana que viene se abre el domingo,
     que es el último día de la semana (la semana va de lunes a domingo).
     Lo mismo comprueba el club en cf_reservar: esto es solo para que el
     socio lo vea venir, no para que decida. */
  finVentana(){
    const d=new Date(); d.setHours(12,0,0,0);
    const dow=(d.getDay()+6)%7;                 /* 0 lunes … 6 domingo */
    return ymd(addDays(d, dow===6 ? 7 : 6-dow));
  },
  abreSiguiente(){ return new Date().getDay()===0; },
  avisoVentana(){
    return this.abreSiguiente()
      ? 'Esa fecha queda fuera: se reserva hasta el domingo que viene.'
      : 'Por ahora solo se reserva hasta este domingo. La semana siguiente se abre el domingo.';
  },
  /* el socio se identifica SOLO por su DNI: en el club no hay código de socio.
     (Un código de cuatro cifras sería adivinable y, como la primera entrada
      crea el PIN, cualquiera podría apropiarse de una ficha.) */
  byCode(c){const d=String(c||'').replace(/\D/g,'');
    if(!d) return null;
    const pela=x=>String(x||'').replace(/^0+/,'');
    return DBX.db.members.find(m=>m.dni&&m.dni===d)
        /* en la planilla del club hay DNI escritos con ceros delante */
        || DBX.db.members.find(m=>m.dni&&pela(m.dni)===pela(d));},
  cls:id=>DBX.db.classes.find(c=>c.id===id),
  /* sesiones de un día concreto, ordenadas por hora */
  sessions(date){
    const dow=parseYmd(date).getDay();
    return DBX.db.classes.filter(c=>c.days.indexOf(dow)>=0)
      .slice().sort((a,b)=>t2m(a.time)-t2m(b.time));
  },
  /* cupos ocupados en una sesión (socios reales + relleno de demo) */
  taken(cid,date){
    let n=0;
    DBX.db.bookings.forEach(b=>{
      if(b.c!==cid||b.date!==date)return;
      if(b.st==='confirmada'||b.st==='asistio')n++;
    });
    return n;
  },
  /* hora bloqueada por el club: el socio la ve como no disponible */
  blocked(cid,date){
    return (DBX.db.blocks||[]).find(b=>b.c===cid&&b.date===date)||null;
  },
  /* ¿esa hora ya terminó? (el bloque dura 60 min) */
  pasada(cid,date){
    const cl=Q.cls(cid); if(!cl) return false;
    const t=today();
    return date<t || (date===t && t2m(cl.time)+60<=nowMin());
  },
  /* quién está apuntado a esa hora: socios e invitados, sin el relleno */
  roster(cid,date){
    return DBX.db.bookings.filter(b=>b.c===cid&&b.date===date&&
      ['confirmada','asistio','espera'].indexOf(b.st)>=0);
  },
  waiting(cid,date){
    return DBX.db.bookings.filter(b=>b.c===cid&&b.date===date&&b.st==='espera').length;
  },
  booking(mid,cid,date){
    return DBX.db.bookings.find(b=>b.m===mid&&b.c===cid&&b.date===date&&
      ['confirmada','espera','asistio'].indexOf(b.st)>=0);
  },
  /* Lo que le falta a una ficha para estar completa. El orden importa:
     el DNI va primero porque sin él el socio no puede ni entrar. */
  faltaInfo(m){
    const f=[];
    if(!m.dni)                      f.push('DNI');
    if(m.active&&!m.plan)           f.push('plan');
    if(m.active&&!m.planEnd)        f.push('vencimiento');
    if(!m.phone)                    f.push('teléfono');
    if(!m.sex)                      f.push('sexo');
    if(m.edad==null&&!m.born)       f.push('edad');
    if(!Q.meas(m.id).length)        f.push('valoración');
    return f;
  },
  /* Fichas que podrían ser la misma persona escrita de dos formas.
     Se comparan los nombres entre sí; el club confirma o descarta. */
  posiblesRepes(){
    const norm=t=>String(t||'').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean);
    /* distancia de edición: cuántas letras hay que cambiar */
    const lev=(a,b)=>{
      if(a===b)return 0;
      const m=a.length,n=b.length;
      if(!m||!n)return m||n;
      let v=Array.from({length:n+1},(_,i)=>i);
      for(let i=1;i<=m;i++){
        let ant=v[0]; v[0]=i;
        for(let j=1;j<=n;j++){
          const tmp=v[j];
          v[j]=Math.min(v[j]+1, v[j-1]+1, ant+(a[i-1]===b[j-1]?0:1));
          ant=tmp;
        }
      }
      return v[n];
    };
    const L=DBX.db.members.filter(m=>!m.demo);
    const vistos=new Set(DBX.db.noRepes||[]);
    const out=[];
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
      const a=L[i],b=L[j];
      const clave=[a.id,b.id].sort().join('|');
      if(vistos.has(clave))continue;
      /* Dos documentos distintos son dos personas distintas: no hay nada
         que confirmar. Esto solo mira nombres que se parecen cuando a
         alguno le falta el documento. */
      if(a.dni&&b.dni&&a.dni!==b.dni)continue;
      /* Y una ficha dada de baja no es un duplicado que resolver hoy. */
      if(!a.active||!b.active)continue;
      const pa=norm(a.name),pb=norm(b.name);
      if(pa.length<2||pb.length<2)continue;
      /* El nombre de pila manda: Jhoao y Joel son hermanos, no la misma
         persona. Solo pasan los que se llaman igual (o a una letra). */
      const np=lev(pa[0],pb[0]);
      if(np>1)continue;
      const apA=pa.slice(1), apB=pb.slice(1);
      const cortos=apA.length<apB.length?apA:apB;
      const largos=apA.length<apB.length?apB:apA;
      /* o a uno le falta un apellido, o los apellidos difieren en 1-2 letras */
      const prefijo = cortos.every((w,k)=>lev(w,largos[k]||'')<=1);
      const d = lev(apA.join(' '), apB.join(' '));
      const casi = apA.length===apB.length && d>0 && d<=2;
      if(!(prefijo || casi))continue;
      const motivo = apA.length!==apB.length
        ? 'A una ficha le falta un apellido'
        : (np>0 ? 'El nombre cambia una letra' : 'Los apellidos cambian '+d+(d===1?' letra':' letras'));
      out.push({clave,a,b,motivo,dist:np+d});
    }
    return out.sort((x,y)=>x.dist-y.dist);
  },
  /* ─── el ciclo de medición ───────────────────────────────
     Cada socio se vuelve a medir a los 30 días de su última valoración, y
     una semana antes ya aparece en la lista para que el nutricionista le
     pida la cita. De las valoraciones viejas no sabemos la fecha real de
     la cita, así que el reloj arranca con la que está registrada. */
  CICLO: 30,
  AVISO: 7,
  tocaMedir(mid){
    const h=Q.meas(mid);
    if(!h.length) return {estado:'nunca',dias:null,proxima:null,
      txt:'Nunca',k:'bad',orden:0};
    const ult=h[h.length-1].date;
    const d=daysBetween(ult,today());
    const faltan=Q.CICLO-d;
    const prox=ymd(addDays(parseYmd(ult),Q.CICLO));
    if(faltan<=0) return {estado:'toca',dias:d,proxima:prox,
      txt:faltan===0?'Hoy':'Hace '+(-faltan)+' d',k:'bad',orden:1};
    if(faltan<=Q.AVISO) return {estado:'semana',dias:d,proxima:prox,
      txt:'En '+faltan+' d',k:'warn',orden:2};
    return {estado:'aldia',dias:d,proxima:prox,
      txt:'En '+faltan+' d',k:'ok',orden:3};
  },
  /* a quién hay que citar ya o en esta semana */
  porCitar(){
    return DBX.db.members.filter(m=>m.active)
      .map(m=>({m,t:Q.tocaMedir(m.id)}))
      .filter(x=>x.t.orden<=2)
      .sort((a,b)=>a.t.orden-b.t.orden||a.m.name.localeCompare(b.m.name,'es'));
  },
  /* lo que le falta a un socio para tener su ficha de cuerpo completa */
  faltaCuerpo(m){
    const fa=[];
    if(!m.sex) fa.push('sexo');
    if(m.edad==null&&!m.born) fa.push('edad');
    const lm=Q.lastMeas(m.id);
    if(!lm) fa.push('valoración');
    else{
      if(!lm.h) fa.push('talla');
      if(!lm.w) fa.push('peso');
      if(lm.bf==null) fa.push('pliegues');
    }
    return fa;
  },
  /* El mes del socio: arranca el dia de su primera clase y se renueva
     cada tantos meses como diga su plan. De aqui sale cuantas horas le
     quedan y cuando le toca renovar. */
  ciclo(mid){
    const m=Q.member(mid); if(!m) return null;
    if(m.ciclo) return m.ciclo;
    /* sin dato del servidor se calcula igual, con lo que hay aqui */
    const mias=DBX.db.bookings.filter(b=>b.m===mid&&
      ['confirmada','asistio'].indexOf(b.st)>=0).map(b=>b.date).sort();
    const arr=mias[0]||m.joined||today();
    const pl=plan(m.plan), n=pl.meses||1;
    const a=parseYmd(arr), h=parseYmd(today());
    let k=Math.floor(((h.getFullYear()-a.getFullYear())*12+(h.getMonth()-a.getMonth())
          - (h.getDate()<a.getDate()?1:0))/n);
    if(!(k>0)) k=0;
    const mes=(d,x)=>{const y=new Date(d);y.setMonth(y.getMonth()+x);return ymd(y);};
    const ini=mes(a,k*n), fin=mes(a,(k+1)*n);
    return {arranque:arr,ini,fin,meses:n,clases:pl.classes,
            usadas:mias.filter(d=>d>=ini&&d<fin).length};
  },
  /* las horas que le quedan de su mes */
  quedan(mid){
    const c=Q.ciclo(mid); if(!c||c.clases==null) return null;
    return Math.max(0, c.clases - (c.usadas||0));
  },
  /* ─── un cambio de hora al día ───────────────────────────
     El socio puede soltar su hora y pasarse a otra que esté libre, incluso
     el mismo día, pero una sola vez por día. Lo que hace el club no cuenta.
     El servidor lleva la cuenta de verdad; esto es para avisar antes. */
  CAMBIOS_DIA: 1,
  cambiosHoy(){
    const db=DBX.db;
    if(db.diaDeHoy!==today()) return 0;   /* la cuenta del servidor es de ayer */
    return db.cambiosHoy||0;
  },
  puedeCambiar(){ return Q.cambiosHoy() < (DBX.db.cambiosMax!=null?DBX.db.cambiosMax:Q.CAMBIOS_DIA); },
  avisoCambio(){
    return Q.puedeCambiar()
      ? 'Puedes soltar tu hora y pasarte a otra que esté libre. Se puede una vez al día.'
      : 'Ya cambiaste de hora hoy. Se puede una vez al día: mañana podrás otra vez, o habla con el club.';
  },
  memberBookings(mid){
    return DBX.db.bookings.filter(b=>b.m===mid)
      .slice().sort((a,b)=>a.date<b.date?1:-1);
  },
  attended(mid){return DBX.db.bookings.filter(b=>b.m===mid&&b.st==='asistio').length;},
  attendedSince(mid,date){return DBX.db.bookings.filter(b=>b.m===mid&&b.st==='asistio'&&b.date>=date).length;},
  lastVisit(mid){
    const a=DBX.db.bookings.filter(b=>b.m===mid&&b.st==='asistio').map(b=>b.date).sort();
    return a.length?a[a.length-1]:null;
  },
  nextBooking(mid){
    const t=today(),m=nowMin();
    return Q.memberBookings(mid).filter(b=>b.st==='confirmada'&&
      (b.date>t||(b.date===t&&t2m(Q.cls(b.c).time)+60>m)))
      .sort((a,b)=>{const d=a.date.localeCompare(b.date);return d||t2m(Q.cls(a.c).time)-t2m(Q.cls(b.c).time);})[0];
  },
  meas(mid){return DBX.db.meas.filter(x=>x.m===mid).slice().sort((a,b)=>a.date.localeCompare(b.date));},
  lastMeas(mid){const a=Q.meas(mid);return a.length?a[a.length-1]:null;},
  plan(mid){return DBX.db.nutri.filter(n=>n.m===mid).slice().sort((a,b)=>b.start.localeCompare(a.start))[0];},
  workout(mid){return DBX.db.workouts.filter(w=>w.m===mid).slice().sort((a,b)=>b.start.localeCompare(a.start))[0];},
  /* racha: días consecutivos con asistencia contando semanas, no días */
  streak(mid){
    const set=new Set(DBX.db.bookings.filter(b=>b.m===mid&&b.st==='asistio').map(b=>b.date));
    let n=0,d=new Date();
    if(!set.has(ymd(d)))d=addDays(d,-1);
    for(let i=0;i<400;i++){
      const k=ymd(d);
      if(set.has(k)){n++;d=addDays(d,-1);continue;}
      /* un día de descanso no rompe la racha; dos seguidos sí */
      const prev=ymd(addDays(d,-1));
      if(set.has(prev)){d=addDays(d,-1);continue;}
      break;
    }
    return n;
  },
  /* riesgo de abandono: frecuencia reciente frente a su propia media */
  risk(mid){
    const m=Q.member(mid); if(!m) return {lvl:0,why:''};
    if(m.frozen) return {lvl:0,why:'Membresía congelada',frozen:true};
    if(m.active===false) return {lvl:0,why:'Sin membresía vigente',frozen:true,sinMem:true};
    const last=Q.lastVisit(mid);
    const sinceJoin=daysBetween(m.joined,today());
    /* sin visitas, el reloj corre desde el alta, no desde el infinito */
    const gap = last ? daysBetween(last,today()) : sinceJoin;
    const r14=Q.attendedSince(mid,addD(-14)), r28=Q.attendedSince(mid,addD(-28));
    const prev=Math.max(0,r28-r14);
    const drop = prev>0 ? 1-(r14/prev) : (r14===0?1:0);
    let lvl=0,why=[];
    const word = last ? 'Sin venir hace ' : 'Inscrito hace ';
    const tail = last ? '' : ' y todavía no ha venido';
    /* los primeros 7 días son de cortesía para quien acaba de entrar */
    if(!last && sinceJoin<=7){
      return {lvl:0,why:'Socio nuevo · aún no ha venido',gap,r14,r28,dEnd:daysBetween(today(),m.planEnd),isNew:true};
    }
    if(gap>=14){lvl=3;why.push(word+gap+' días'+tail);}
    else if(gap>=8){lvl=2;why.push(word+gap+' días'+tail);}
    else if(gap>=5){lvl=1;why.push(word+gap+' días'+tail);}
    if(drop>=0.55&&prev>=2){lvl=Math.max(lvl,2);why.push('Bajó '+Math.round(drop*100)+'% su frecuencia');}
    else if(drop>=0.35&&prev>=2){lvl=Math.max(lvl,1);why.push('Frecuencia a la baja');}
    const dEnd=daysBetween(today(),m.planEnd);
    if(dEnd<0){lvl=Math.max(lvl,3);why.push('Membresía vencida hace '+(-dEnd)+' días');}
    else if(dEnd<=5){lvl=Math.max(lvl,Math.max(1,lvl));why.push('Vence en '+dEnd+' días');}
    return {lvl,why:why.join(' · '),gap,r14,r28,dEnd};
  },
  adh(mid,date){return DBX.db.adh[mid+'|'+date]||null;},
  water(mid,date){const v=DBX.db.water[mid+'|'+date];return v==null?0:v;},
  /* ocupación media de los últimos 28 días por franja y día de semana */
  heat(){
    const grid={},t=today();
    for(let d=-27;d<=0;d++){
      const date=addD(d),dow=parseYmd(date).getDay();
      Q.sessions(date).forEach(c=>{
        const h=parseInt(c.time),k=h+'|'+dow;
        if(!grid[k])grid[k]={sum:0,cap:0,n:0};
        grid[k].sum+=Q.taken(c.id,date);grid[k].cap+=c.cap;grid[k].n++;
      });
    }
    return grid;
  }
};
function addD(n){return ymd(addDays(new Date(),n));}
window.CFQ=Q;

/* Una reserva recién creada lleva un id provisional hasta que el club
   contesta y devuelve el suyo. Mover o quitar con ese id provisional
   hacía que el club rechazara la orden y el registro se perdía. */
function idDelClub(id){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-/i.test(String(id||'')); }
const ESPERA = {ok:false,msg:'Esa reserva se está guardando en el club. Espera un segundo y vuelve a intentarlo.'};

/* ═══ ACCIONES ════════════════════════════════════════════
   Cada cambio se pinta aquí y se manda al club en el acto. Si el
   servidor dice que no (otro se llevó el cupo, la sesión caducó),
   CFNET vuelve a pedir el estado y deshace lo que sobraba. */
const NET = window.CFNET;
const A={
  /* ── el club bloquea o libera una hora ── */
  block(cid,date,nota){
    if(Q.blocked(cid,date)) return {ok:false,msg:'Esa hora ya estaba bloqueada'};
    DBX.db.blocks.push({c:cid,date,note:(nota||'').trim()});
    DBX.save();
    NET.empujar('cf_bloquear',{p_bloque:cid,p_fecha:date,p_nota:(nota||'').trim()});
    const cl=Q.cls(cid);
    return {ok:true,msg:'Bloqueada la hora de las '+h12(cl.time)+' del '+fmtD(date)};
  },
  unblock(cid,date){
    const i=DBX.db.blocks.findIndex(b=>b.c===cid&&b.date===date);
    if(i<0) return {ok:false,msg:'Esa hora no estaba bloqueada'};
    DBX.db.blocks.splice(i,1); DBX.save();
    NET.empujar('cf_bloquear',{p_bloque:cid,p_fecha:date,p_nota:null,p_abrir:true});
    return {ok:true,msg:'Hora liberada'};
  },
  /* ── el club apunta a un socio del padrón, también en horas que ya pasaron ── */
  bookMember(cid,date,mid){
    const cl=Q.cls(cid); if(!cl) return {ok:false,msg:'Clase no encontrada'};
    const m=Q.member(mid); if(!m) return {ok:false,msg:'No encuentro a ese socio'};
    const pn=m.name.split(' ')[0];
    if(Q.blocked(cid,date)) return {ok:false,msg:'Esa hora está bloqueada: libérala primero'};
    if(cl.days.indexOf(parseYmd(date).getDay())<0) return {ok:false,msg:'Ese bloque no abre ese día'};
    if(Q.booking(mid,cid,date)) return {ok:false,msg:pn+' ya está en esa hora'};
    const choque=DBX.db.bookings.find(b=>b.m===mid&&b.date===date&&
      ['confirmada','asistio','espera'].indexOf(b.st)>=0&&Q.cls(b.c)&&Q.cls(b.c).time===cl.time);
    if(choque) return {ok:false,msg:pn+' ya tiene otra reserva a las '+h12(cl.time)};
    /* el tope de la hora manda siempre: aquí no hay lista de espera */
    if(cl.cap-Q.taken(cid,date)<=0)
      return {ok:false,msg:'No quedan cupos: esa hora admite '+cl.cap+' personas'};
    const pas=Q.pasada(cid,date);
    const st=pas?'asistio':'confirmada';
    DBX.db.bookings.push({id:uid('b'),m:mid,c:cid,date,st,at:date+'T'+cl.time});
    DBX.save();
    /* Esto faltaba: sin mandarlo al club, el socio aparecía en pantalla y
       desaparecía en cuanto la app volvía a pedir el estado. */
    NET.empujar('cf_apuntar',{p_socio:mid,p_invitado:null,p_bloque:cid,p_fecha:date});
    return {ok:true,pasada:pas,msg: pas
      ? pn+' queda en las '+h12(cl.time)+', con la asistencia marcada'
      : pn+' entra a las '+h12(cl.time)+' con '+cl.coach};
  },
  /* ── invitado: ocupa un cupo pero no es socio del padrón ── */
  addGuest(cid,date,nombre){
    const cl=Q.cls(cid); if(!cl) return {ok:false,msg:'Clase no encontrada'};
    const n=(nombre||'').trim();
    if(n.length<2) return {ok:false,msg:'Escribe el nombre del invitado'};
    if(Q.blocked(cid,date)) return {ok:false,msg:'Esa hora está bloqueada'};
    if(cl.cap-Q.taken(cid,date)<=0) return {ok:false,msg:'No quedan cupos en esa hora'};
    DBX.db.bookings.push({id:uid('b'),m:'_inv',inv:n,c:cid,date,st:'confirmada',at:date+'T'+cl.time});
    DBX.save();
    NET.empujar('cf_apuntar',{p_socio:null,p_invitado:n,p_bloque:cid,p_fecha:date});
    return {ok:true,msg:n+' añadido a las '+h12(cl.time)};
  },
  /* ── el club quita a alguien de una hora ── */
  drop(bid){
    if(!idDelClub(bid)) return ESPERA;
    const i=DBX.db.bookings.findIndex(b=>b.id===bid);
    if(i<0) return {ok:false,msg:'No encuentro esa reserva'};
    const b=DBX.db.bookings[i], cl=Q.cls(b.c);
    const quien=b.inv||(Q.member(b.m)||{}).name||'La reserva';
    DBX.db.bookings.splice(i,1);
    /* si había lista de espera, entra el primero */
    let sube=null;
    const w=DBX.db.bookings.filter(x=>x.c===b.c&&x.date===b.date&&x.st==='espera')
      .sort((a,c)=>String(a.id).localeCompare(String(c.id)))[0];
    if(w){w.st='confirmada';sube=w.inv||(Q.member(w.m)||{}).name||null;}
    DBX.save();
    NET.empujar('cf_borrar_reserva',{p_id:bid});
    return {ok:true,msg:quien+' ya no está en las '+(cl?cl.time:''),sube};
  },
  /* ── el club mueve a alguien a otra hora del mismo día ── */
  move(bid,cid2){
    if(!idDelClub(bid)) return ESPERA;
    const b=DBX.db.bookings.find(x=>x.id===bid);
    if(!b) return {ok:false,msg:'No encuentro esa reserva'};
    if(S.user&&S.user.role==='socio'&&!Q.puedeCambiar())
      return {ok:false,msg:Q.avisoCambio()};
    const cl2=Q.cls(cid2); if(!cl2) return {ok:false,msg:'Esa hora no existe'};
    if(b.c===cid2) return {ok:false,msg:'Ya está en esa hora'};
    if(Q.blocked(cid2,b.date)) return {ok:false,msg:'Las '+h12(cl2.time)+' están bloqueadas'};
    if(cl2.days.indexOf(parseYmd(b.date).getDay())<0) return {ok:false,msg:'Ese bloque no abre ese día'};
    if(cl2.cap-Q.taken(cid2,b.date)<=0) return {ok:false,msg:'No quedan cupos a las '+h12(cl2.time)};
    if(b.m!=='_inv'&&Q.booking(b.m,cid2,b.date)) return {ok:false,msg:'Ya tiene una reserva a las '+h12(cl2.time)};
    const quien=b.inv||(Q.member(b.m)||{}).name||'La reserva';
    b.c=cid2; b.at=b.date+'T'+cl2.time;
    if(S.user&&S.user.role==='socio'){
      DBX.db.diaDeHoy=today();
      DBX.db.cambiosHoy=(Q.cambiosHoy())+1;
    }
    DBX.save();
    NET.empujar('cf_mover',{p_reserva:bid,p_bloque:cid2});
    /* al socio se le habla de tú; al club se le dice de quién es la hora */
    return {ok:true, msg: (S.user&&S.user.role==='socio')
      ? 'Listo, pasas a las '+h12(cl2.time)+' con '+cl2.coach+'. Es tu único cambio de hoy.'
      : quien+' pasó a las '+h12(cl2.time)+' con '+cl2.coach};
  },
  book(mid,cid,date){
    const cl=Q.cls(cid); if(!cl) return {ok:false,msg:'Clase no encontrada'};
    if(Q.blocked(cid,date)) return {ok:false,msg:'El club reservó esa hora: no se puede apartar'};
    if(Q.booking(mid,cid,date)) return {ok:false,msg:'Ya tienes reservado ese bloque'};
    const m=Q.member(mid);
    if(m.frozen) return {ok:false,msg:'Tu membresía está congelada'};
    if(daysBetween(today(),m.planEnd)<0) return {ok:false,msg:'Tu membresía venció el '+fmtDL(m.planEnd)};
    if(date > Q.finVentana()) return {ok:false,msg:Q.avisoVentana()};
    /* un bloque por franja horaria */
    const clash=DBX.db.bookings.find(b=>b.m===mid&&b.date===date&&
      ['confirmada','espera'].indexOf(b.st)>=0&&Q.cls(b.c)&&Q.cls(b.c).time===cl.time);
    if(clash) return {ok:false,msg:'Ya tienes otra reserva a las '+h12(cl.time)};
    /* el cupo del plan, contado dentro del mes del socio */
    const ci=Q.ciclo(mid);
    if(ci && ci.clases!=null && (ci.usadas||0) >= ci.clases)
      return {ok:false,msg:'Ya usaste las '+ci.clases+' horas de tu mes. '+
        'Tu mes cierra el '+fmtD(ci.fin)+': renueva en el club'};
    if(cl.cap-Q.taken(cid,date)<=0)
      return {ok:false,msg:'Esa hora está llena: elige otra o mira si se libera'};
    DBX.db.bookings.push({id:uid('b'),m:mid,c:cid,date,st:'confirmada',at:date+'T'+cl.time});
    DBX.save();
    NET.empujar('cf_reservar',{p_bloque:cid,p_fecha:date});
    const q=Q.quedan(mid);
    return {ok:true,st:'confirmada',
      msg:'Reservado · '+fmtD(date)+' a las '+h12(cl.time)+' con '+cl.coach+
          (q!=null?' · te quedan '+q+' hora'+(q===1?'':'s')+' este mes':'')};
  },
  cancel(mid,cid,date){
    const b=Q.booking(mid,cid,date); if(!b) return {ok:false,msg:'No tienes esta reserva'};
    if(!idDelClub(b.id)) return ESPERA;
    /* una sola vez al día: vale tanto para soltarla como para cambiarse */
    if(S.user&&S.user.role==='socio'&&!Q.puedeCambiar())
      return {ok:false,msg:Q.avisoCambio()};
    const cl=Q.cls(cid);
    const start=parseYmd(date).getTime()+t2m(cl.time)*60000;
    const hrs=(start-Date.now())/36e5;
    const late = hrs>0 && hrs<2;
    b.st='cancelada';
    /* promoción automática de la lista de espera */
    let promoted=null;
    if(b.st!=='espera'){
      const w=DBX.db.bookings.filter(x=>x.c===cid&&x.date===date&&x.st==='espera')
        .sort((a,b2)=>String(a.id).localeCompare(String(b2.id)))[0];
      if(w){w.st='confirmada';promoted=Q.member(w.m);}
    }
    if(S.user&&S.user.role==='socio'){
      DBX.db.diaDeHoy=today();
      DBX.db.cambiosHoy=(Q.cambiosHoy())+1;
    }
    DBX.save();
    NET.empujar('cf_cancelar',{p_reserva:b.id});
    const soy = S.user&&S.user.role==='socio';
    return {ok:true,late,promoted,msg: soy
      ? 'Hora liberada. Ya puedes apuntarte a otra que esté libre; es tu único cambio de hoy.'
      : 'Reserva cancelada'};
  },
  checkin(mid){
    const t=today(),m=nowMin();
    const b=DBX.db.bookings.find(x=>x.m===mid&&x.date===t&&x.st==='confirmada'&&
      Math.abs(t2m(Q.cls(x.c).time)-m)<=45);
    if(!b) return {ok:false,msg:'No tienes ninguna reserva en los próximos 45 minutos'};
    if(!idDelClub(b.id)) return ESPERA;
    b.st='asistio';DBX.save();
    NET.empujar('cf_marcar',{p_reserva:b.id,p_estado:'asistio'});
    return {ok:true,msg:'Asistencia marcada · '+Q.cls(b.c).coach+' a las '+h12(Q.cls(b.c).time)};
  },
  createMember(d){
    const n=DBX.db.members.length+1;
    /* el DNI es la identificación; el PIN lo elige el socio la primera vez */
    const dni=String(d.dni||'').replace(/\D/g,'');
    const mm={id:'m'+String(n).padStart(2,'0')+uid('').slice(-3),dni,pin:null,name:d.name,sex:d.sex,
      born:d.born||'',plan:d.plan,joined:today(),phone:d.phone||'',email:d.email||'',
      goal:d.goal||'',dir:d.dir||'mantener',
      planEnd:ymd(addDays(new Date(),d.months*30)),frozen:false,active:true};
    DBX.db.members.push(mm);DBX.save();
    NET.empujar('cf_alta_socio',{d:{name:d.name,dni,sex:d.sex,
      edad:d.edad||null,plan:d.plan,joined:mm.joined,planEnd:mm.planEnd,
      phone:d.phone||'',email:d.email||'',goal:d.goal||''}});
    return mm;
  },
  /* el club le pone un PIN al socio que vino a recepción */
  ponerPin(mid, pin){
    const m=Q.member(mid); if(!m) return {ok:false,msg:'No encuentro a ese socio'};
    if(!/^[0-9]{4}$/.test(pin||'')) return {ok:false,msg:'El PIN son 4 números'};
    if(pin===Q.PIN0) return {ok:false,msg:'0000 es la clave de fábrica: usa «Volver a 0000» para eso'};
    if(/^([0-9])\1+$/.test(pin)) return {ok:false,msg:'Elige un PIN menos obvio: no todos los números iguales'};
    if(/^(0123|1234|2345|3456|4567|5678|6789|9876|4321)$/.test(pin))
      return {ok:false,msg:'Elige un PIN menos obvio: nada de números seguidos'};
    m.pin=pin; m.pinPropio=true; DBX.save();
    NET.empujar('cf_poner_pin',{p_ref:mid,p_pin:pin});
    return {ok:true,msg:'Listo: '+m.name.split(' ')[0]+' ya puede entrar con ese PIN'};
  },
  /* el socio perdió su PIN (o alguien se le adelantó): vuelve a 0000 y
     la app le volverá a pedir uno nuevo en cuanto entre */
  resetPin(mid){
    const m=Q.member(mid); if(!m) return {ok:false,msg:'No encuentro a ese socio'};
    m.pin=null; m.pinPropio=false; DBX.save();
    if(m.uid) NET.empujar('cf_reset_pin',{p_socio:m.uid});
    return {ok:true,msg:'La clave de '+m.name.split(' ')[0]+' vuelve a ser 0000. '+
      'Al entrar tendrá que elegir un PIN nuevo'};
  },
  /* el club corrige la ficha de un socio: aquí es donde se llenan
     los DNI que faltan y se arregla lo que trae mal la planilla */
  editMember(mid, d){
    const m=Q.member(mid); if(!m) return {ok:false,msg:'No encuentro a ese socio'};
    const nom=String(d.name||'').trim();
    if(nom.length<3) return {ok:false,msg:'Escribe el nombre completo'};
    const dni=String(d.dni||'').replace(/\D/g,'');
    if(dni){
      /* 8 es el DNI peruano; el carné de extranjería trae más dígitos
         y a veces ceros delante, que SÍ cuentan (002616850) */
      if(dni.length<8||dni.length>12) return {ok:false,msg:'El DNI son 8 dígitos. Si es carné de extranjería, puede traer más y los ceros de delante cuentan.'};
      const otro=DBX.db.members.find(x=>x.id!==mid&&x.dni&&
        String(x.dni).replace(/^0+/,'')===dni.replace(/^0+/,''));
      if(otro) return {ok:false,msg:'Ese DNI ya es de '+otro.name};
    }
    m.name=nom;
    m.dni=dni||'';
    if(d.sex)    m.sex=d.sex;
    if(d.edad!=null&&d.edad!=='') m.edad=+d.edad; else delete m.edad;
    m.phone=String(d.phone||'').trim();
    m.email=String(d.email||'').trim();
    m.goal =String(d.goal||'').trim();
    m.obs  =String(d.obs||'').trim();
    m.plan =d.plan||null;
    m.precio = (d.precio===''||d.precio==null) ? null : +d.precio;
    m.joined=d.joined||m.joined;
    m.venceHoja=d.planEnd||null;
    if(!m.ciclo) m.planEnd=d.planEnd||null;
    m.active=!!d.active;
    DBX.save();
    NET.empujar('cf_editar_socio',{p_ref:mid,d:{name:nom,dni,sex:d.sex,precio:m.precio,
      edad:(d.edad===''||d.edad==null)?null:+d.edad,phone:m.phone,email:m.email,
      goal:m.goal,obs:m.obs,plan:m.plan,joined:m.joined,planEnd:m.venceHoja,
      active:m.active}});
    return {ok:true,msg:'Ficha de '+nom.split(' ')[0]+' actualizada',
            sinDni:!dni};
  },
  /* el club revisó la pareja y son dos personas distintas */
  noSonLaMisma(clave){
    DBX.db.noRepes = DBX.db.noRepes || [];
    if(DBX.db.noRepes.indexOf(clave)<0) DBX.db.noRepes.push(clave);
    DBX.save();
    NET.empujar('cf_no_repes',{p_clave:clave});
    return {ok:true,msg:'Anotado: son dos personas distintas'};
  },
  toggleFreeze(mid){
    const m=Q.member(mid);m.frozen=!m.frozen;DBX.save();
    /* los 5 nombres siempre: con 3 el servidor no sabia a cual llamar */
    NET.empujar('cf_membresia',{p_ref:mid,p_accion:'congelar',

  },
  renew(mid,months,planK){

  saveMeas(d){
    DBX.db.meas.push(Object.assign({id:uid('me')},d));DBX.save();

    if(i>=0)DBX.db.nutri[i]=p; else DBX.db.nutri.push(p);

    NET.empujar('cf_dieta',{p_ref:p.m,d:p});

  setWater(mid,date,v){DBX.db.water[mid+'|'+date]=clamp(v,0,12);DBX.save();},
  setAdh(mid,date,done,total){DBX.db.adh[mid+'|'+date]={done,total};DBX.save();}
};

/* ═══ UI: toasts ══════════════════════════════════════════ */
function toast(msg,kind){
  kind=kind||'info';
  const root=$('#toasts');
  const el=document.createElement('div');
  el.className='toast '+kind;
  el.innerHTML='<span class="toast-ic">'+ic(kind==='ok'?'check':kind==='bad'?'alert':'bell',13)+
    '</span><span style="min-width:0">'+esc(msg)+'</span>';
  root.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},3400);
}
window.CFT=toast;

let modalEl=null;
function modal(o){
  closeModal();
  const ov=document.createElement('div');
  ov.className='ov';
  ov.innerHTML='<div class="modal'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true">'+
    '<div class="modal-h"><div style="flex:1;min-width:0"><h3>'+esc(o.title)+'</h3>'+
      (o.sub?'<p>'+esc(o.sub)+'</p>':'')+'</div>'+
      '<button class="x" data-x aria-label="Cerrar">'+ic('x',15)+'</button></div>'+
    '<div class="modal-b">'+o.body+'</div>'+
    (o.foot?'<div class="modal-f">'+o.foot+'</div>':'')+'</div>';
  document.body.appendChild(ov);modalEl=ov;
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  ov.querySelector('[data-x]').addEventListener('click',closeModal);
  document.addEventListener('keydown',escClose);
  if(o.onMount)o.onMount(ov);
  const f=ov.querySelector('input,select,textarea,button:not([data-x])');
  if(f&&!o.noFocus)setTimeout(()=>f.focus(),60);
  return ov;
}
function escClose(e){if(e.key==='Escape')closeModal();}
function closeModal(){
  if(modalEl){modalEl.remove();modalEl=null;document.removeEventListener('keydown',escClose);}
}
window.CFM={modal,closeModal};

/* ═══ GRÁFICOS ════════════════════════════════════════════ */
const G={
  /* línea con área, puntos y tooltip */
  line(data,o){
    o=o||{};
    const W=o.w||560,H=o.h||172,PL=o.pl||38,PR=14,PT=14,PB=26;
    if(!data.length)return '<div class="empty"><p>Sin datos todavía</p></div>';
    const vals=data.map(d=>d.v);
    let lo=o.min!=null?o.min:Math.min.apply(null,vals), hi=o.max!=null?o.max:Math.max.apply(null,vals);
    if(hi===lo){hi=lo+1;lo=lo-1;}
    const pad=(hi-lo)*0.16; lo-=pad; hi+=pad;
    const iw=W-PL-PR, ih=H-PT-PB;
    const X=i=>PL+(data.length===1?iw/2:i*iw/(data.length-1));
    const Y=v=>PT+ih-((v-lo)/(hi-lo))*ih;
    const gid='g'+Math.random().toString(36).slice(2,7);
    let grid='',ticks=4;
    for(let i=0;i<=ticks;i++){
      const y=PT+ih*i/ticks, v=hi-(hi-lo)*i/ticks;
      grid+='<line class="ch-grid" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"/>'+
        '<text class="ch-lbl" x="'+(PL-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+
        (o.fmtY?o.fmtY(v):Math.round(v*10)/10)+'</text>';
    }
    let ln='',ar='';
    data.forEach((d,i)=>{const x=X(i).toFixed(1),y=Y(d.v).toFixed(1);ln+=(i?'L':'M')+x+' '+y+' ';});
    ar='M'+X(0).toFixed(1)+' '+(PT+ih)+' L'+ln.slice(1).replace(/L/g,'L')+'L'+X(data.length-1).toFixed(1)+' '+(PT+ih)+' Z';
    let pts='',lbl='',hit='';
    const every=Math.ceil(data.length/(o.maxLbl||6));
    data.forEach((d,i)=>{
      const x=X(i),y=Y(d.v);
      pts+='<circle class="ch-pt" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(i===data.length-1?4.2:2.8)+'"/>';
      if(i%every===0||i===data.length-1)
        lbl+='<text class="ch-lbl" x="'+x.toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(d.l)+'</text>';
      hit+='<rect data-tip="'+esc((o.tip?o.tip(d):d.v)+'')+'" data-tl="'+esc(d.l)+'" data-x="'+x.toFixed(1)+
        '" data-y="'+y.toFixed(1)+'" x="'+(x-iw/(data.length*1.6)).toFixed(1)+'" y="'+PT+'" width="'+
        (iw/data.length*1.25).toFixed(1)+'" height="'+ih+'" fill="transparent" style="cursor:crosshair"/>';
    });
    return '<div class="chart-wrap" data-chart><svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#D8DCE1" stop-opacity=".19"/>'+
      '<stop offset="100%" stop-color="#D8DCE1" stop-opacity="0"/></linearGradient></defs>'+
      grid+'<path d="'+ar+'" fill="url(#'+gid+')"/>'+
      '<path class="ch-ln" d="'+ln.trim()+'"/>'+pts+lbl+hit+'</svg><div class="ch-tip"></div></div>';
  },
  /* barras verticales */
  bars(data,o){
    o=o||{};
    const W=o.w||560,H=o.h||160,PL=o.pl||32,PR=10,PT=12,PB=26;
    if(!data.length)return '<div class="empty"><p>Sin datos todavía</p></div>';
    const hi=Math.max(1,Math.max.apply(null,data.map(d=>d.v)));
    const iw=W-PL-PR, ih=H-PT-PB;
    const bw=iw/data.length, bar=Math.min(bw*0.62,30);
    let grid='';
    for(let i=0;i<=3;i++){
      const y=PT+ih*i/3, v=Math.round(hi-(hi)*i/3);
      grid+='<line class="ch-grid" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"/>'+
        '<text class="ch-lbl" x="'+(PL-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+v+'</text>';
    }
    let bs='',lb='';
    const every=Math.ceil(data.length/(o.maxLbl||7));
    data.forEach((d,i)=>{
      const h=(d.v/hi)*ih, x=PL+bw*i+(bw-bar)/2, y=PT+ih-h;
      const fill=d.hi?'#F2F3F5':'#5E636B';
      bs+='<rect data-tip="'+esc((o.tip?o.tip(d):d.v)+'')+'" data-tl="'+esc(d.l)+'" data-x="'+(x+bar/2).toFixed(1)+
        '" data-y="'+y.toFixed(1)+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bar.toFixed(1)+
        '" height="'+Math.max(2,h).toFixed(1)+'" rx="2.5" fill="'+fill+'" style="cursor:crosshair"/>';
      if(i%every===0||i===data.length-1)
        lb+='<text class="ch-lbl" x="'+(x+bar/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(d.l)+'</text>';
    });
    return '<div class="chart-wrap" data-chart><svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">'+
      grid+bs+lb+'</svg><div class="ch-tip"></div></div>';
  },
  /* anillo de progreso */
  ring(pct,o){
    o=o||{};
    const sz=o.sz||92,sw=o.sw||8,r=(sz-sw)/2,cx=sz/2,cir=2*Math.PI*r;
    const p=clamp(pct,0,100);
    const col=o.col||'#E4E7EB';
    return '<div class="ring" style="width:'+sz+'px;height:'+sz+'px">'+
      '<svg width="'+sz+'" height="'+sz+'">'+
      '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="#232329" stroke-width="'+sw+'"/>'+
      '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+
      '" stroke-linecap="round" stroke-dasharray="'+cir.toFixed(1)+'" stroke-dashoffset="'+
      (cir*(1-p/100)).toFixed(1)+'" style="transition:stroke-dashoffset .95s cubic-bezier(.22,.61,.36,1)"/>'+
      '</svg><div class="ring-c"><div><div class="ring-v">'+(o.label!=null?o.label:Math.round(p)+'%')+'</div>'+
      (o.sub?'<div class="ring-k">'+esc(o.sub)+'</div>':'')+'</div></div></div>';
  }
};
window.CFG=G;

/* tooltips de gráficos (delegado) */
document.addEventListener('mouseover',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t)return;
  const wrap=t.closest('[data-chart]');if(!wrap)return;
  const tip=wrap.querySelector('.ch-tip');if(!tip)return;
  const svg=wrap.querySelector('svg'),rb=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  const sx=rb.width/vb.width, sy=rb.height/vb.height;
  tip.innerHTML='<b>'+esc(t.getAttribute('data-tl'))+'</b>'+esc(t.getAttribute('data-tip'));
  tip.style.left=(parseFloat(t.getAttribute('data-x'))*sx)+'px';
  tip.style.top=(parseFloat(t.getAttribute('data-y'))*sy)+'px';
  tip.classList.add('on');
});
document.addEventListener('mouseout',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t)return;const w=t.closest('[data-chart]');
  if(w){const tip=w.querySelector('.ch-tip');if(tip)tip.classList.remove('on');}
});
})();
</script>
<script>
(function(){
'use strict';
const C=window.CF,DBX=window.CFDB,Q=window.CFQ,A=window.CFA,G=window.CFG,S=window.CFS;
const toast=window.CFT,{modal,closeModal}=window.CFM;
const {ic,$,$$,esc,clamp,PEN,DOW,DOWL,MON,ymd,parseYmd,addDays,daysBetween,fmtD,fmtDL,
       today,nowMin,t2m,m2t,initials,rel}=C;
const addD=n=>ymd(addDays(new Date(),n));
const V={}; window.CFV=V;

/* helpers compartidos ------------------------------------- */
function tile(k,v,unit,d,dcls,icon){
  return '<div class="tile sheen"><div class="tile-k">'+(icon?ic(icon,13):'')+'<span>'+esc(k)+'</span></div>'+
    '<div class="tile-v">'+v+(unit?'<em>'+esc(unit)+'</em>':'')+'</div>'+
    (d?'<div class="tile-d '+(dcls||'')+'">'+d+'</div>':'')+'</div>';
}
function meterBar(pct,cls){
  return '<div class="meter '+(cls||'')+'"><i style="width:'+clamp(pct,0,100).toFixed(1)+'%"></i></div>';
}
function planPill(m){
  const p=plan(m.plan),d=daysBetween(today(),m.planEnd);
  if(!m.active)return '<span class="pill p-n">Baja</span>';
  if(m.frozen)return '<span class="pill p-n">'+ic('snow',11)+' Congelada</span>';
  if(m.planEnd&&d<0)return '<span class="pill p-bad"><i class="dot"></i> Vencida</span>';
  if(C.tocaRenovar(m))return '<span class="pill p-bad"><i class="dot"></i> '+esc(C.porQueSeAcabo(m))+'</span>';
  if(!m.planEnd)return '<span class="pill p-warn"><i class="dot"></i> Sin fecha</span>';
  if(d<=7)return '<span class="pill p-warn"><i class="dot"></i> Vence en '+d+' d</span>';
  return '<span class="pill p-ch">'+esc(p.n)+'</span>';
}
function riskPill(r){
  if(r.sinMem)return '<span class="pill p-n">Sin membresía</span>';
  if(r.frozen)return '<span class="pill p-n">'+ic('snow',11)+' Congelada</span>';
  if(r.lvl>=3)return '<span class="pill p-bad"><i class="dot"></i> Alto</span>';
  if(r.lvl===2)return '<span class="pill p-warn"><i class="dot"></i> Medio</span>';
  if(r.lvl===1)return '<span class="pill p-n"><i class="dot"></i> Bajo</span>';
  return '<span class="pill p-ok"><i class="dot"></i> Al día</span>';
}
/* iniciales del entrenador, para identificar el bloque de un vistazo */
function coachTag(name){
  return '<span class="pill p-n">'+esc(initials(name))+'</span>';
}
V.isPast=function(c,date){
  return date<today() || (date===today() && t2m(c.time)+60<nowMin());
};
/* primer día, a partir de hoy, con algún bloque todavía reservable */
/* lunes de la semana desplazada n semanas desde hoy */
V.weekDays=function(off){
  const d=new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7)+(off||0)*7);
  const out=[];
  for(let i=0;i<7;i++){const x=new Date(d); x.setDate(d.getDate()+i); out.push(ymd(x));}
  return out;
};
V.firstOpenDay=function(){
  for(let i=0;i<14;i++){
    const d=ymd(addDays(new Date(),i));
    if(Q.sessions(d).some(c=>!V.isPast(c,d)))return d;
  }
  return today();
};
V.tile=tile;V.meterBar=meterBar;V.planPill=planPill;V.riskPill=riskPill;

/* ═══════════════════════════════════════════════════════════
   SOCIO · INICIO
   ═══════════════════════════════════════════════════════════ */
V.inicio=function(u){
  const m=Q.member(u.id), lm=Q.lastMeas(m.id), prev=Q.meas(m.id).slice(-2)[0];
  const streak=Q.streak(m.id);
  const mStart=today().slice(0,8)+'01';
  const mClasses=DBX.db.bookings.filter(b=>b.m===m.id&&b.date>=mStart&&b.st==='asistio').length;
  const dEnd=daysBetween(today(),m.planEnd);
  const nb=Q.nextBooking(m.id);
  const hour=new Date().getHours();
  const greet = hour<12?'Buenos días':hour<19?'Buenas tardes':'Buenas noches';

  /* aforo del club ahora mismo */
  const nowSes=Q.sessions(today()).filter(c=>{const s=t2m(c.time);return nowMin()>=s-10&&nowMin()<s+60;});
  const dayS=Q.sessions(today());
  const aforoNow = nowSes.length
    ? Math.round(nowSes.reduce((a,c)=>a+Q.taken(c.id,today()),0)/nowSes.reduce((a,c)=>a+c.cap,0)*100) : null;
  const aforoDay = dayS.length
    ? Math.round(dayS.reduce((a,c)=>a+Q.taken(c.id,today()),0)/dayS.reduce((a,c)=>a+c.cap,0)*100) : 0;

  /* hero -------------------------------------------------- */
  let h='<section class="hero"><div class="hero-in"><div class="hero-l">'+
    '<p class="eyebrow">'+esc(greet)+' · '+esc(DOWL[new Date().getDay()])+' '+new Date().getDate()+'</p>'+
    '<h1 class="dsp hero-h"><span class="wordmark">'+esc(m.name.split(' ')[0])+'</span></h1>'+
    '<p class="hero-p">'+esc(m.goal||'Listo para entrenar')+'. '+
      (nb? 'Entrenas '+(nb.date===today()?'hoy':esc(fmtD(nb.date)))+' a las '+esc(h12(Q.cls(nb.c).time))+
           ' con '+esc(Q.cls(nb.c).coach)+'.'
        :'Todavía no tienes ninguna hora reservada esta semana.')+'</p></div>'+
    '<div class="hero-r">'+
      '<div class="flame"><span>'+ic('fire',18)+'</span><div class="num">'+streak+'</div><small>Días de racha</small></div>'+
      '<div class="flame"><span>'+ic('bolt',18)+'</span><div class="num">'+mClasses+'</div><small>Clases este mes</small></div>'+
    '</div></div>'+
    '<div class="hero-bar">'+
      '<div class="hb"><p class="hb-k">Peso actual</p><div class="hb-v">'+(lm?lm.w.toFixed(1):'—')+'<em>kg</em></div></div>'+
      '<div class="hb"><p class="hb-k">Grasa corporal</p><div class="hb-v">'+(lm?lm.bf.toFixed(1):'—')+'<em>%</em></div></div>'+
      '<div class="hb"><p class="hb-k">Masa magra</p><div class="hb-v">'+((lm&&lm.lean!=null)?lm.lean.toFixed(1):'—')+'<em>kg</em></div></div>'+
      '<div class="hb"><p class="hb-k">Membresía</p><div class="hb-v" style="font-size:14px;align-items:center">'+planPill(m)+'</div></div>'+
    '</div></section>';

  /* tira de datos vivos ----------------------------------- */
  const mq=[
    aforoNow!=null?['Aforo ahora',aforoNow+'%']:['Aforo de hoy',aforoDay+'%'],
    ['Clases hoy',dayS.length],
    ['Socios activos',DBX.db.members.filter(x=>x.active&&!x.frozen).length],
    ['Tu plan',plan(m.plan).n],
    ['Renovación', !m.planEnd?'sin fecha':dEnd>=0?'en '+dEnd+' días':'vencida'],
    ['Entrenadores',5],['Salas',4]
  ];
  const mqi=mq.map(x=>'<span class="mq-i">'+esc(x[0])+' <b>'+esc(x[1])+'</b></span>').join('');
  h+='<div class="mq bleed"><div class="mq-in">'+mqi+mqi+'</div></div>';

  /* dos columnas ------------------------------------------ */
  h+='<div class="grid g-main">';

  /* --- columna izquierda --- */
  h+='<div class="stack">';
  /* próxima hora reservada */
  if(nb){
    const cl=Q.cls(nb.c), taken=Q.taken(cl.id,nb.date);
    const start=parseYmd(nb.date).getTime()+t2m(cl.time)*60000;
    const mins=Math.round((start-Date.now())/60000);
    const cd = mins<0?'En curso' : mins<60? 'En '+mins+' min' : mins<1440? 'En '+Math.round(mins/60)+' h' :
      'En '+Math.round(mins/1440)+' días';
    h+='<div class="card sheen" style="overflow:hidden">'+
      '<div class="card-pad" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+
       '<div style="flex:none;text-align:center;padding:14px 18px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2)">'+
         '<div class="num" style="font-size:30px">'+esc(h12p(cl.time).h)+
           '<span class="ampm">'+h12p(cl.time).s+'</span></div>'+
         '<div class="eyebrow" style="margin-top:5px">'+esc(fmtD(nb.date))+'</div></div>'+
       '<div style="flex:1;min-width:170px">'+
         '<p class="eyebrow" style="margin-bottom:6px">Tu próxima hora · '+esc(cd)+'</p>'+
         '<div style="font-size:21px;font-weight:800;letter-spacing:-.025em">'+esc(cl.coach)+'</div>'+
         '<div class="tiny mut" style="margin-top:5px">Bloque de 60 minutos · '+C.KCAL_H+' kcal aprox.</div>'+
         '<div class="slot-cap" style="margin-top:10px">'+meterBar(taken/cl.cap*100)+
           '<span>'+taken+'/'+cl.cap+'</span></div>'+
       '</div>'+
       '<div style="flex:none;display:flex;flex-direction:column;gap:7px">'+
         '<button class="btn btn-gh btn-sm" data-act="cancel" data-c="'+cl.id+'" data-d="'+nb.date+'">Cancelar</button>'+
       '</div>'+
      '</div></div>';
  } else {
    h+='<div class="card"><div class="empty"><div class="empty-ic">'+ic('cal',22)+'</div>'+
      '<h4>No tienes horas reservadas</h4><p>Reserva tu bloque de 60 minutos y te guardamos el sitio.</p>'+
      '<button class="btn btn-pri btn-sm" data-go="reservar" style="margin-top:14px">Ver horarios</button></div></div>';
  }

  /* reservas de la semana */
  const wk=Q.memberBookings(m.id).filter(b=>b.date>=today()&&b.date<=addD(7)&&
    ['confirmada','espera'].indexOf(b.st)>=0)
    .sort((a,b)=>a.date.localeCompare(b.date)||t2m(Q.cls(a.c).time)-t2m(Q.cls(b.c).time));
  h+='<div><div class="sec-h"><div><h3>Tus próximos 7 días</h3>'+
      '<p>'+wk.length+' hora'+(wk.length===1?'':'s')+' reservada'+(wk.length===1?'':'s')+'</p></div>'+

  if(wk.length){
    h+='<div class="grid" style="gap:8px">'+wk.map(b=>{
      const cl=Q.cls(b.c),tk=Q.taken(cl.id,b.date);
      return '<div class="slot mine"><div class="slot-t"><div class="h">'+esc(h12p(cl.time).h)+
        '<span class="ampm">'+h12p(cl.time).s+'</span></div>'+
        '<div class="d">'+esc(fmtD(b.date))+'</div></div>'+
        '<div class="slot-m"><div class="slot-n">'+esc(cl.coach)+
          (b.st==='espera'?' <span class="pill p-warn">En espera</span>':'')+'</div>'+
        '<div class="slot-c">Bloque de 60 min · '+tk+'/'+cl.cap+' cupos</div></div>'+
        '<div class="slot-a"><button class="btn btn-gh btn-xs" data-act="cancel" data-c="'+cl.id+
          '" data-d="'+b.date+'">Cancelar</button></div></div>';
    }).join('')+'</div>';
  } else {
    h+='<div class="card"><div class="empty"><p>Semana libre. Reserva al menos 3 horas para no perder la racha.</p></div></div>';
  }
  h+='</div>';

  /* rutina de hoy */
  const wo=Q.workout(m.id);
  if(wo){
    const idx=(new Date().getDay()+6)%7 % wo.days.length;
    const d=wo.days[idx];
    h+='<div><div class="sec-h"><div><h3>Rutina de hoy</h3><p>'+esc(wo.title)+' · por '+esc(wo.by)+'</p></div>'+
      '<button class="btn btn-qt btn-sm" data-go="rutina">Ver completa</button></div>'+
      '<div class="card"><div class="meal-h"><span class="meal-time">'+ic('dumb',16)+'</span>'+
        '<span class="meal-n">'+esc(d.n)+'</span><span class="meal-k">'+d.ex.length+' ejercicios</span></div>'+
      d.ex.slice(0,4).map((e,i)=>'<div class="ex"><div class="ex-i">'+(i+1)+'</div>'+
        '<div style="min-width:0"><div class="ex-n">'+esc(e.e)+'</div><div class="ex-m">Descanso '+esc(e.rest)+'</div></div>'+
        '<div class="ex-s">'+e.s+' × '+esc(e.r)+'<em>'+esc(e.w)+'</em></div></div>').join('')+
      (d.ex.length>4?'<div style="padding:11px 15px;text-align:center" class="tiny dim">+'+(d.ex.length-4)+' ejercicios más</div>':'')+
      '</div></div>';
  }
  h+='</div>'; /* fin columna izquierda */

  /* --- columna derecha --- */
  h+='<div class="stack">';
  /* carné de socio */
  const dLeftC=daysBetween(today(),m.planEnd);
  h+='<div class="card sheen" style="overflow:hidden"><div class="glow"></div>'+
    '<div class="card-pad" style="display:flex;flex-direction:column;gap:14px;position:relative">'+
    '<div class="row btw"><p class="eyebrow">Tu carné de socio</p>'+planPill(m)+'</div>'+
    '<div><p class="eyebrow" style="margin-bottom:4px">Tu DNI</p>'+
    '<div class="qr-code" style="font-size:31px">'+esc(ident(m))+'</div>'+
    '<div style="font-size:15px;font-weight:700;letter-spacing:-.015em;margin-top:6px">'+esc(m.name)+'</div>'+
    '<div class="tiny dim" style="margin-top:2px">Plan '+esc(plan(m.plan).n)+' · '+
      esc(C.venceTxt(m))+'</div></div>'+
    '<div class="hair"></div>'+
    '<p class="tiny dim" style="margin:0;line-height:1.5">Di tu DNI en recepción al llegar. '+
      'Si ya reservaste, puedes marcar tu llegada desde aquí.</p>'+
    '<button class="btn btn-pri btn-sm btn-blk" data-act="checkin">'+ic('check',15)+' Marcar mi llegada</button>'+
    '</div></div>';

  /* agua */
  const wtr=Q.water(m.id,today()), goalW=8;
  h+='<div class="card card-pad"><div class="row btw" style="margin-bottom:12px">'+
    '<div><p class="eyebrow">Hidratación de hoy</p>'+
    '<div style="font-size:19px;font-weight:800;letter-spacing:-.025em;margin-top:4px">'+(wtr*0.25).toFixed(2).replace('.',',')+
      ' <span class="tiny dim" style="font-weight:600">de 2 L</span></div></div>'+
    ic('drop',22)+'</div>'+
    '<div class="water" id="water">'+Array.from({length:goalW},(_,i)=>
      '<button class="glass'+(i<wtr?' on':'')+'" data-w="'+(i+1)+'" aria-label="Vaso '+(i+1)+'"></button>').join('')+
    '</div><p class="tiny dim" style="margin:11px 0 0">Toca los vasos para marcar lo que llevas. 1 vaso = 250 ml.</p></div>';

  /* adherencia nutricional */
  const pl=Q.plan(m.id);
  if(pl){
    let done=0,tot=0;
    for(let i=0;i<14;i++){const a=Q.adh(m.id,addD(-i));if(a){done+=a.done;tot+=a.total;}}
    const pct=tot?Math.round(done/tot*100):0;
    h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:13px">Adherencia al plan · 14 días</p>'+
      '<div class="ring-wrap">'+G.ring(pct,{sz:84,sw:8,sub:'cumplido',col:pct>=80?'#6EE7A8':pct>=60?'#F5B544':'#FF6B6B'})+
      '<div style="flex:1;min-width:120px"><div class="tiny mut" style="line-height:1.5">'+
        '<b style="color:var(--text)">'+done+'</b> de '+tot+' comidas registradas.<br>'+
        (pct>=80?'Vas muy bien. El nutricionista lo ve en su panel.':
         pct>=60?'Puedes apretar un poco más esta semana.':
                 'Habla con el nutricionista para ajustar el plan a tu día a día.')+
      '</div><button class="btn btn-gh btn-sm" data-go="nutricion" style="margin-top:11px">Ver plan</button></div></div></div>';
  }

  /* avisos */
  h+='<div><div class="sec-h"><div><h3>Del club</h3><p>Avisos y retos</p></div></div>'+
    (DBX.db.news.length?'':'<div class="card"><div class="empty"><p>Todavía no hay avisos.</p></div></div>')+
    '<div class="grid" style="gap:8px">'+DBX.db.news.slice(0,3).map(n=>
      '<div class="card card-pad sheen" style="padding:15px 16px">'+
      '<div class="row btw" style="margin-bottom:6px"><span class="pill p-n">'+esc(n.tag)+'</span>'+
      '<span class="tiny dim">'+esc(rel(n.d))+'</span></div>'+
      '<div style="font-size:13.5px;font-weight:700;letter-spacing:-.012em;margin-bottom:4px">'+esc(n.t)+'</div>'+
      '<div class="tiny mut" style="line-height:1.5">'+esc(n.b)+'</div></div>').join('')+'</div></div>';

  h+='</div></div>'; /* fin columnas */
  return h;
};

/* ═══════════════════════════════════════════════════════════
   SOCIO · RESERVAR
   Primera vista del socio. Manda el día: se abre en hoy, con la
   tira de la semana para cambiarlo y una vista de semana opcional.
   ═══════════════════════════════════════════════════════════ */
/* La semana siguiente SIEMPRE se puede mirar: hay socios que ya se
   apuntaron allí antes de esta regla y tienen que poder ver y cancelar
   su hora. Lo que se cierra hasta el domingo es apartar horas nuevas. */
const WK_MAX = 1;

V.reservar=function(u){
  const m    = Q.member(u.id);
  const hoy   = today();
  const wk    = clamp(S.wk||0,0,WK_MAX);
  const week  = V.weekDays(wk);
  const filt  = S.seg.cls||'todos';
  const vista = S.seg.rz==='semana' ? 'semana' : 'dia';

  let sel = S.day;
  if(!sel || week.indexOf(sel)<0) sel = week.indexOf(hoy)>=0 ? hoy : week[0];

  const coaches = ['todos'].concat(Array.from(new Set(DBX.db.classes.map(c=>c.coach))).sort());

  /* ── cómo suele llenarse cada bloque (4 semanas de histórico) ── */
  const hist={};
  for(let d=-27;d<=-1;d++){
    const dt=addD(d);
    Q.sessions(dt).forEach(c=>{
      if(!hist[c.id])hist[c.id]={s:0,c:0};
      hist[c.id].s+=Q.taken(c.id,dt); hist[c.id].c+=c.cap;
    });
  }
  function habito(cid){
    const x=hist[cid];
    if(!x||!x.c)return 'Bloque nuevo, aún sin histórico';
    const p=x.s/x.c;
    if(p>=.85)return 'Casi siempre se llena';
    if(p>=.55)return 'Suele quedar sitio';
    return 'Sala tranquila a esta hora';
  }
  /* resumen de un día: bloques, cupos libres y reservas propias */
  function resumen(d){
    const ss=Q.sessions(d); let libres=0,cap=0,mias=0,abiertos=0;
    ss.forEach(c=>{
      if(Q.blocked(c.id,d))return;              /* hora apartada por el club */
      abiertos++; cap+=c.cap; libres+=Math.max(0,c.cap-Q.taken(c.id,d));
      if(Q.booking(m.id,c.id,d))mias++; });
    return {n:abiertos,libres,cap,mias};
  }

  /* ── tira de la semana ──────────────────────────────────── */
  let tira='<div class="rz-week">';
  week.forEach(d=>{
    const dt=parseYmd(d), r=resumen(d), cerrado=!r.n, pasado=d<hoy;
    tira+='<button class="rz-day'+(d===sel?' on':'')+((cerrado||pasado)?' off':'')+'" data-day="'+d+'">'+
      '<div class="rz-dw">'+(d===hoy?'Hoy':DOW[dt.getDay()])+'</div>'+
      '<div class="rz-dn">'+dt.getDate()+'</div>'+
      '<div class="rz-df">'+(cerrado||pasado?'—':
          '<b>'+r.libres+'</b><span class="rz-dfw"> libres</span>')+'</div>'+
      '<div class="rz-dm'+(r.mias?'':' none')+'"></div></button>';
  });
  tira+='</div>';

  const a=parseYmd(week[0]), b=parseYmd(week[6]);
  const rango = a.getDate()+' '+MON[a.getMonth()]+' – '+b.getDate()+' '+MON[b.getMonth()];
  const rotulo = wk===0?'Esta semana':wk===1?'La próxima':'En '+wk+' semanas';

  /* ── franja de membresía: plan, clases, alta y renovación ── */
  const pl=plan(m.plan);
  /* el mismo conteo que ve el club: la tanda del socio, no el mes del
     calendario, que daba un número distinto en cada pantalla */
  const mesIni=today().slice(0,8)+'01';
  const usadas = (m.ciclo&&m.ciclo.usadas!=null) ? +m.ciclo.usadas
    : DBX.db.bookings.filter(b=>b.m===m.id&&b.date>=mesIni&&
        ['confirmada','asistio'].indexOf(b.st)>=0).length;
  const tope = (m.ciclo&&m.ciclo.clases!=null) ? +m.ciclo.clases : pl.classes;
  const quedan = tope!=null ? Math.max(0,tope-usadas) : null;
  const dias = m.planEnd ? daysBetween(today(),m.planEnd) : null;

  /* el club solo maneja dos ritmos: interdiario y diario */
  const ritmo = m.frozen ? 'Congelada'
    : pl.porSem==null ? 'Sin plan'
    : pl.porSem>=5 ? 'Diario' : 'Interdiario';
  const vence = dias==null?'sin fecha'
    : dias<0?'venció hace '+Math.abs(dias)+' d'
    : dias===0?'vence hoy'
    : dias===1?'queda 1 día':'quedan '+dias+' días';

  let h='<div class="stack">';
  h+='<div class="mb">'+
    '<div class="mb-top"><div class="mb-k">Tu plan</div>'+
      '<div class="mb-plan">'+esc(ritmo)+'</div>'+
      '<div class="mb-sub">'+(pl.porSem?pl.porSem+' veces por semana':'Pregunta en recepción')+
        (pl.classes!=null?' · '+pl.classes+' clases al mes':'')+'</div></div>'+
    '<div class="mb-row">'+
      (C.tocaRenovar(m)
         ? '<span class="bad"><b>'+(m.ciclo&&m.ciclo.motivo==='sin_sesiones'
             ? 'Usaste tus '+(m.ciclo.clases)+' sesiones'
             : 'Tu plan llegó a su fecha')+'</b> · habla con el club para renovar</span>'
       : quedan!=null?'<span><b>'+quedan+'</b> clases te quedan</span>'
                   :'<span>Sin plan registrado</span>')+
      '<span>Socio desde <b>'+esc(m.joined?fmtD(m.joined):'—')+'</b></span>'+
      '<span class="'+(dias==null?'':dias<0?'bad':dias<=7?'warn':'ok')+'">'+
        'Renueva el <b>'+esc(m.planEnd?fmtD(m.planEnd):'—')+'</b> · '+vence+'</span>'+
    '</div></div>';

  /* un cambio de hora al día */
  (function(){
    const puede=Q.puedeCambiar();
    h+='<div class="card card-pad" style="display:flex;gap:11px;align-items:flex-start;'+
       (puede?'':'border-color:#5A471C;background:var(--warnd)')+'">'+
      '<span style="flex:none;margin-top:1px;color:'+(puede?'var(--dim)':'var(--warn)')+'">'+
        ic(puede?'back':'alert',15)+'</span>'+
      '<div class="tiny'+(puede?' mut':'')+'" style="line-height:1.6'+(puede?'':';color:var(--warn)')+'">'+
        (puede
          ? '<b>Puedes cambiar de hora una vez al día.</b> Suelta la que tienes y apúntate a otra que esté '+
            'libre, aunque sea para hoy mismo. Después de ese cambio, la siguiente te la hace el club.'
          : '<b>Ya usaste tu cambio de hoy.</b> Se puede uno al día: mañana podrás otra vez, o pídele al club '+
            'que te mueva.')+
      '</div></div>';
  })();

  /* ── los días, con flechas para pasar de semana ─────────── */
  h+='<div class="sec-h" style="margin-bottom:9px"><div>'+
      '<p class="eyebrow">Elige el día</p>'+
      '<h3 style="margin-top:4px">'+esc(rango)+'</h3></div></div>';
  h+='<div class="rz-nav">'+
      '<button class="rz-ar"'+(wk<=0?' disabled':' data-wk="'+(wk-1)+'" aria-label="Semana anterior"')+'>'+ic('left',18)+'</button>'+
      tira+
      '<button class="rz-ar" data-sig'+(wk>=WK_MAX
        ? ' disabled'
        : ' data-wk="'+(wk+1)+'" aria-label="Semana siguiente"')+'>'+ic('right',18)+'</button>'+
    '</div>';
  /* los días que aún no se pueden apartar se avisan aquí, no se esconden:
     quien ya tenga hora en esa semana entra, la ve y puede cancelarla */
  if(sel > Q.finVentana())
    h+='<p class="tiny" style="margin:-2px 0 2px;line-height:1.5;color:var(--warn)">'+
       'Ese día todavía no se puede apartar: '+esc(Q.avisoVentana())+' Si ya tienes una hora '+
       'reservada aquí, sigue siendo tuya y puedes cancelarla.</p>';

  const ses=Q.sessions(sel);
  const r=resumen(sel);
  const dt=parseYmd(sel);

  /* ───────────────────────── VISTA SEMANA ─────────────────── */
  if(vista==='semana'){
    const times=Array.from(new Set(DBX.db.classes.map(c=>c.time))).sort((x,y)=>t2m(x)-t2m(y));
    const clsAt=(date,time)=>{const dw=parseYmd(date).getDay();
      return DBX.db.classes.find(c=>c.time===time&&c.days.indexOf(dw)>=0);};
    let grid='<div class="wk"><div class="wk-corner"></div>';
    week.forEach(d=>{const x=parseYmd(d);
      grid+='<button class="wk-h'+(d===sel?' on':'')+(d===hoy?' hoy':'')+'" data-day="'+d+'">'+
        '<div class="wk-hd">'+(d===hoy?'Hoy':DOW[x.getDay()])+'</div>'+
        '<div class="wk-hn">'+x.getDate()+'</div></button>';});
    times.forEach(tm=>{
      grid+='<div class="wk-t">'+esc(tm.slice(0,2))+'</div>';
      week.forEach(d=>{
        const c=clsAt(d,tm);
        if(!c){ grid+='<div class="wk-c wk-off"></div>'; return; }
        if(filt!=='todos'&&c.coach!==filt){
          grid+='<div class="wk-c wk-dim"><div class="wk-n">'+esc(c.coach.split(' ')[0])+'</div></div>';return;}
        const tk=Q.taken(c.id,d), free=Math.max(0,c.cap-tk), pct=clamp(tk/c.cap*100,0,100);
        const mine=Q.booking(m.id,c.id,d), past=V.isPast(c,d);
        const bloqW=Q.blocked(c.id,d);
        let st='wk-free', lbl=free+(free===1?' libre':' libres');
        if(mine&&mine.st==='espera'){st='wk-mine';lbl='En espera';}
        else if(mine){st='wk-mine';lbl='Reservada';}
        else if(!free){st='wk-full';lbl='Completa';}
        if(past)st+=' wk-past';
        const body='<div class="wk-n">'+esc(c.coach.split(' ')[0])+'</div>'+
                   '<div class="wk-f">'+lbl+'</div>'+
                   '<div class="wk-bar"><i class="'+(pct>=100?'bad':pct>=80?'warn':'')+
                     '" style="width:'+pct.toFixed(1)+'%"></i></div>';
        if(bloqW&&!past)     grid+='<div class="wk-c wk-off" title="El club apartó esta hora">'+
                                   '<div class="wk-n" style="opacity:.55">'+esc(c.coach.split(' ')[0])+'</div>'+
                                   '<div class="wk-f">No disponible</div></div>';
        else if(past)        grid+='<div class="wk-c '+st+'">'+body+'</div>';
        else if(!mine&&free) grid+='<button class="wk-c '+st+'" data-act="book" data-c="'+c.id+
                                   '" data-d="'+d+'" title="Reservar las '+esc(tm)+' con '+esc(c.coach)+'">'+body+'</button>';
        else                 grid+='<button class="wk-c '+st+'" data-day="'+d+'">'+body+'</button>';
      });
    });
    grid+='</div>';
    h+='<div><div class="wk-wrap">'+grid+'</div>'+
       '<div class="wk-leg">'+
         '<span><i style="background:var(--ok)"></i>Tus reservas</span>'+
         '<span><i style="background:var(--chrome-soft)"></i>Con cupos libres</span>'+
         '<span><i style="background:var(--warn)"></i>Completa · lista de espera</span>'+
         '<span><i style="background:var(--line2)"></i>El club no abre esa hora</span>'+
       '</div></div>';
    h+='</div>';
    return h;
  }

  /* ───────────────────────── VISTA DÍA ────────────────────── */
  h+='<div class="rz-hero sheen">'+
      '<div class="rz-hd">'+
        '<div class="rz-d">'+esc(DOWL[dt.getDay()])+' '+dt.getDate()+'</div>'+
        '<div class="rz-sub">'+esc(fmtDL(sel))+' · '+
          (r.n? (r.cap? Math.round((r.cap-r.libres)/r.cap*100):0)+'% de aforo'
              : 'El club no abre bloques este día')+'</div>'+
      '</div>'+
      '<div class="rz-k">'+
        '<div><div class="rz-kv">'+r.n+'</div><div class="rz-kk">Bloques</div></div>'+
        '<div><div class="rz-kv">'+r.libres+'</div><div class="rz-kk">Cupos libres</div></div>'+
        '<div><div class="rz-kv">'+r.mias+'</div><div class="rz-kk">Tus reservas</div></div>'+
      '</div></div>';

  /* filtro por entrenador */
  h+='<div class="sec-h sec-h-stack"><div><h3>Bloques de 60 minutos</h3>'+
    '<p>'+(r.n? r.libres+' cupos libres en '+r.n+' bloques':'Sin bloques este día')+'</p></div>'+
    '<div class="seg scroll-x">'+coaches.map(n=>
      '<button class="'+(filt===n?'on':'')+'" data-filt="'+esc(n)+'">'+
      (n==='todos'?'Todos':esc(n.split(' ')[0]))+'</button>').join('')+'</div></div>';

  const shown=ses.filter(c=>filt==='todos'||c.coach===filt);
  if(!shown.length){
    h+='<div class="card"><div class="empty"><div class="empty-ic">'+ic('cal',22)+'</div>'+
      '<h4>No hay bloques que mostrar</h4>'+
      '<p>Prueba con otro entrenador, o elige otro día en la tira de arriba.</p></div></div>';
  } else {
    let franja='';
    h+='<div class="rz-list">';
    shown.forEach(c=>{
      const f = t2m(c.time)<780 ? 'Mañana' : 'Tarde y noche';
      if(f!==franja){ franja=f; h+='<div class="rz-sec">'+esc(f)+'</div>'; }
      const tk=Q.taken(c.id,sel), free=c.cap-tk, pct=tk/c.cap*100;
      const wait=Q.waiting(c.id,sel);
      const mine=Q.booking(m.id,c.id,sel);
      const past=V.isPast(c,sel);
      const bloqD=Q.blocked(c.id,sel);
      const live=sel===hoy&&nowMin()>=t2m(c.time)&&nowMin()<t2m(c.time)+60;
      let act;
      if(bloqD&&!past) act='<span class="pill p-n">No disponible</span>';
      else if(past) act='<span class="pill p-n">Terminada</span>';
      else if(mine&&mine.st==='espera') act='<span class="pill p-warn">En espera</span>'+
        '<button class="btn btn-gh btn-xs" data-act="cancel" data-c="'+c.id+'" data-d="'+sel+'">Salir</button>';
      else if(mine) act='<span class="pill p-ok">'+ic('check',11)+' Reservada</span>'+
        '<button class="btn btn-gh btn-xs" data-act="cancel" data-c="'+c.id+'" data-d="'+sel+'">Cancelar</button>';
      else if(free>0) act='<button class="btn btn-pri btn-sm" data-act="book" data-c="'+c.id+'" data-d="'+sel+'">Reservar</button>';
      else act='<button class="btn btn-gh btn-sm" data-act="book" data-c="'+c.id+'" data-d="'+sel+'">Lista de espera</button>';
      h+='<div class="rz-b sheen'+(mine?' mine':'')+(past?' past':'')+(free<=0&&!mine?' full':'')+'"'+
        ' data-ancla="h'+esc(c.id)+'">'+
        '<div class="rz-t"><div class="rz-h">'+esc(h12p(c.time).h)+
          '<span class="ampm">'+h12p(c.time).s+'</span></div><div class="rz-hm">60 min</div></div>'+
        '<div class="rz-m"><div class="rz-c">'+esc(c.coach)+
          (live?' <span class="pill p-ok"><i class="dot dot-live"></i> En curso</span>':'')+'</div>'+
          '<div class="rz-note">'+(bloqD?'El club apartó esta hora':esc(habito(c.id))+
            (wait?' · <span style="color:var(--warn)">'+wait+' en espera</span>':''))+'</div>'+
          (bloqD?'':'<div class="rz-cap">'+meterBar(pct,pct>=100?'bad':pct>=80?'warn':'')+
            '<span>'+(free>0?free+' libre'+(free===1?'':'s')+' de '+c.cap:'Completa')+'</span></div>')+'</div>'+
        '<div class="rz-a">'+act+'</div></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
};
})();
</script>
<script>
(function(){
'use strict';
const C=window.CF,DBX=window.CFDB,Q=window.CFQ,A=window.CFA,G=window.CFG,S=window.CFS,V=window.CFV;
const {ic,$,$$,esc,clamp,PEN,DOW,DOWL,MON,ymd,parseYmd,addDays,daysBetween,fmtD,fmtDL,
       today,nowMin,t2m,initials,rel}=C;
const addD=n=>ymd(addDays(new Date(),n));
const tile=V.tile,meterBar=V.meterBar;

/* ═══════════════════════════════════════════════════════════
   ANTROPOMETRÍA · el método que usa el nutricionista del club
   ───────────────────────────────────────────────────────────
   Densidad corporal por Durnin-Womersley con los 4 pliegues
   clásicos (tríceps + bíceps + subescapular + cresta ilíaca),
   por sexo y banda de edad, y % de grasa por la ecuación de
   Siri. Comprobado contra 87 de sus 89 valoraciones: da el
   mismo número que su planilla, al decimal.
   ═══════════════════════════════════════════════════════════ */
const DW={
  H:[[19,1.1620,0.0630],[29,1.1631,0.0632],[39,1.1422,0.0544],[49,1.1620,0.0700],[200,1.1715,0.0779]],
  M:[[19,1.1549,0.0678],[29,1.1599,0.0717],[39,1.1423,0.0632],[49,1.1333,0.0612],[200,1.1339,0.0645]]
};
/* su tabla de referencia, tal cual la imprime en cada plan */
const NIV={
  H:[[39,8,20,25],[59,11,22,28],[200,13,25,30]],
  M:[[39,16,28,39],[59,18,30,40],[200,20,32,42]]   /* tal cual sus planillas */
};
function dwCoef(sexo,edad){
  const t=DW[sexo==='F'?'M':'H'];
  return (t.find(x=>edad<=x[0])||t[t.length-1]).slice(1);
}
function nivelRef(sexo,edad){
  const t=NIV[sexo==='F'?'M':'H'];
  return (t.find(x=>edad<=x[0])||t[t.length-1]).slice(1);  /* [bajo, saludable, sobrepeso] */
}
function nivelGrasa(pct,sexo,edad){
  if(pct==null)return null;
  const [a,b,c]=nivelRef(sexo,edad);
  if(pct<a)  return {n:'Bajo en grasa',k:'fl'};
  if(pct<=b) return {n:'Saludable',k:'up'};
  if(pct<=c) return {n:'Sobrepeso',k:'fl'};
  return {n:'Obesidad',k:'dn'};
}
/* v = valoración; devuelve lo mismo que ella escribe a mano */
function compo(v){
  if(!v)return null;
  const pl=v.pl||{};
  const s4=['tri','bic','sub','cre'].map(k=>pl[k]);
  const r={peso:v.peso,talla:v.talla,
           imc:(v.peso&&v.talla)?v.peso/Math.pow(v.talla/100,2):null};
  if(s4.some(x=>x==null||!(x>0)))return r;
  r.s4=s4.reduce((a,b)=>a+b,0);
  const [a,b]=dwCoef(v.sexo,v.edad||30);
  r.dens = a - b*Math.log10(r.s4);
  r.pct  = Math.round((495/r.dens-450)*100)/100;
  if(v.peso){
    r.kgGrasa = Math.round(v.peso*r.pct/100*1000)/1000;
    r.kgMagra = Math.round((v.peso-r.kgGrasa)*1000)/1000;
  }
  r.nivel = nivelGrasa(r.pct,v.sexo,v.edad||30);
  return r;
}
window.CFANT={compo,nivelGrasa,nivelRef,dwCoef};

const IMC=(w,h)=>h?w/Math.pow(h/100,2):0;
function imcTag(v){
  if(v<18.5)return ['Bajo peso','fl'];
  if(v<25)  return ['Peso saludable','up'];
  if(v<30)  return ['Sobrepeso','fl'];
  return ['Obesidad','dn'];
}
/* clasificación con la tabla del propio nutricionista */
function bfTag(v,sex,edad){
  const n=window.CFANT.nivelGrasa(v,sex,edad||35);
  return n?[n.n,n.k]:['Sin clasificar','fl'];
}
/* inv: true = bajar es lo deseado · null = dato neutro, sin juicio de valor */
function delta(now,before,inv,unit){
  if(before==null||now==null)return '<span class="dim">—</span>';
  const d=now-before;
  if(Math.abs(d)<0.05)return '<span class="dim">sin cambio</span>';
  const txt=(d>0?'+':'')+d.toFixed(1)+(unit||'');
  if(inv==null)return '<span class="dim">'+txt+'</span>';
  return '<span class="'+((inv?d<0:d>0)?'up':'dn')+'">'+txt+'</span>';
}
/* el peso solo es "bueno" o "malo" respecto al objetivo que el socio declaró */
function weightDelta(m,now,before,unit){
  if(before==null||now==null)return '<span class="dim">—</span>';
  if(m.dir==='mantener'){
    const d=now-before;
    if(Math.abs(d)<0.05)return '<span class="dim">sin cambio</span>';
    return '<span class="'+(Math.abs(d)<=1?'up':'fl')+'">'+(d>0?'+':'')+d.toFixed(1)+(unit||'')+'</span>';
  }
  return delta(now,before,m.dir!=='ganar',unit);
}
window.CFBODY={IMC,imcTag,bfTag,delta,weightDelta};

    tile('IMC',imc.toFixed(1),'',it[0],it[1],'chart')+
    tile('Grasa corporal',f1(lm.bf),'%',bt[0],bt[1],'drop')+
    tile('Masa magra',f1(lm.lean),'kg',

  /* perímetros */

  const dA=S.ctx.cmpA||first.date, dB=S.ctx.cmpB||lm.date;
  const A1=hist.find(x=>x.date===dA)||first, B1=hist.find(x=>x.date===dB)||lm;
  const ROWS=[['w','Peso','kg','W'],['bf','Grasa corporal','%',true],['fat','Kilos de grasa','kg',true],
              ['lean','Masa magra','kg',false],
              ['pTri','Pliegue del tríceps','mm',true],['pSub','Pliegue subescapular','mm',true],

  h+='<div><div class="sec-h"><div><h3>Comparar dos tomas</h3><p>Elige las fechas y mira la diferencia real</p></div></div>'+
    '<div class="card"><div class="card-pad"><div class="grid g2" style="margin-bottom:16px">'+
      '<div class="fld"><label for="cmpA">Desde</label><select class="inp" id="cmpA" data-cmp="A">'+

      '<div class="fld"><label for="cmpB">Hasta</label><select class="inp" id="cmpB" data-cmp="B">'+
        hist.map(x=>'<option value="'+x.date+'"'+(x.date===dB?' selected':'')+'>'+esc(fmtD(x.date))+'</option>').join('')+'</select></div>'+
    '</div></div><div class="tbl-wrap" style="border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px">'+

    ROWS.map(r=>{

      return '<tr><td style="font-weight:600">'+esc(r[1])+'</td>'+
        '<td class="r mut">'+(a==null?'—':f1(a)+(r[2]?' '+r[2]:''))+'</td>'+
        '<td class="r bold">'+(b==null?'—':f1(b)+(r[2]?' '+r[2]:''))+'</td>'+
        '<td class="r">'+(r[3]==='W'?weightDelta(m,b,a,' '+r[2]):delta(b,a,r[3],r[2]?' '+r[2]:''))+'</td></tr>';
    }).join('')+'</tbody></table></div></div></div>';

  /* fotos de progreso */
  const ph=(DBX.db.photos[m.id]||[]).filter(p=>p.img);
  h+='<div><div class="sec-h"><div><h3>Fotos de progreso</h3>'+
      '<p>Solo tú las ves. Se guardan en este dispositivo.</p></div>'+
      '<label class="btn btn-gh btn-sm" style="cursor:pointer">'+ic('camera',14)+' Añadir foto'+
      '<input type="file" accept="image/*" id="photoIn" hidden></label></div>';
  if(ph.length>=2){
    const a=ph[0],b=ph[ph.length-1];

  h+='</div>';
  return h;

/* El nutricionista agrupa las comidas por días (p. ej. "Lun · Mié · Vie").
   El socio lo ve por día suelto: este helper resuelve a qué grupo toca cada uno. */
V.planGroup=function(p,dow){
  if(!p||!p.days||!p.days.length)return null;
  const hit=p.days.find(d=>Array.isArray(d.dows)&&d.dows.indexOf(dow)>=0);
  if(hit)return hit;
  /* planes antiguos sin días declarados: si solo hay un grupo, vale para todo */
  if(p.days.length===1&&!Array.isArray(p.days[0].dows))return p.days[0];
  return null;
};
/* etiqueta legible a partir de los días marcados */
V.dowLabel=function(dows){
  if(!dows||!dows.length)return 'Sin días asignados';
  if(dows.length===7)return 'Todos los días';
  const order=[1,2,3,4,5,6,0];
  const idx=dows.map(d=>order.indexOf(d)).filter(i=>i>=0).sort((a,b)=>a-b);
  const seguido=idx.every((v,i)=>i===0||v===idx[i-1]+1);
  if(seguido&&idx.length>=3)return C.DOW[order[idx[0]]]+' a '+C.DOW[order[idx[idx.length-1]]];
  return idx.map(i=>C.DOW[order[i]]).join(' · ');
};

V.nutricion=function(u){
  const m=Q.member(u.id), p=Q.plan(m.id);
  if(!p){

  const esHoy = selDow===hoyDow;

     [['Proteína',p.prot,'g'],['Carbohidratos',p.carb,'g'],['Grasas',p.fat,'g'],['Agua',(p.water/1000).toFixed(1).replace('.',','),'L']]
      .map(x=>'<div class="hb"><p class="hb-k">'+esc(x[0])+'</p><div class="hb-v">'+x[1]+'<em>'+x[2]+'</em></div></div>').join('')+

  /* tira de días: de lunes a domingo */
