    '<span style="font-size:17px;font-weight:800;letter-spacing:-.025em">'+kcalDone+' <span class="tiny dim" style="font-weight:600">/ '+p.kcal+'</span></span></div></div>';

  h+='<div class="card card-pad"><div class="row btw" style="margin-bottom:12px">'+
    '<div><p class="eyebrow">Agua de hoy</p><div style="font-size:19px;font-weight:800;letter-spacing:-.025em;margin-top:4px">'+
      (wtr*0.25).toFixed(2).replace('.',',')+' <span class="tiny dim" style="font-weight:600">de '+(p.water/1000).toFixed(1).replace('.',',')+' L</span></div></div>'+
    ic('drop',22)+'</div><div class="water" id="water">'+
    Array.from({length:Math.round(p.water/250)},(_,i)=>
      '<button class="glass'+(i<wtr?' on':'')+'" data-w="'+(i+1)+'" aria-label="Vaso '+(i+1)+'"></button>').join('')+
    '</div></div>';

  const adhD=[];
  for(let i=13;i>=0;i--){const dt=addD(-i),a=Q.adh(m.id,dt);
    adhD.push({l:parseYmd(dt).getDate()+'',v:a?Math.round(a.done/a.total*100):0,hi:i===0});}
  h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:13px">Adherencia · últimos 14 días</p>'+
    G.bars(adhD,{h:142,pl:30,tip:d2=>d2.v+'% de comidas'})+'</div>';

  h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:11px">Lista de compras de la semana</p>'+
    '<div class="tiny mut" style="line-height:1.75">'+
    esc(Array.from(new Set(p.days.flatMap(x=>x.meals.flatMap(me=>me.items.map(i=>i.f)))))
      .slice(0,18).join(' · '))+'</div></div>';

  h+='</div></div></div>';
  return h;
};

/* ═══════════════════════════════════════════════════════════
   SOCIO · RUTINA
   ═══════════════════════════════════════════════════════════ */
V.rutina=function(u){
  const m=Q.member(u.id), w=Q.workout(m.id);
  if(!w){
    return '<div class="card"><div class="empty"><div class="empty-ic">'+ic('dumb',22)+'</div>'+
      '<h4>Sin rutina asignada</h4><p>Pídesela a tu entrenador en la próxima sesión y la verás aquí, '+
      'con series, repeticiones y los kilos de la última vez.</p></div></div>';
  }
  const di=clamp(S.seg.wo!=null?+S.seg.wo:0,0,w.days.length-1);
  const d=w.days[di];
  const doneK='wo|'+m.id+'|'+today()+'|'+di;
  const done=!!(DBX.db.notes.find(n=>n.k===doneK));
  const totalSets=d.ex.reduce((a,e)=>a+e.s,0);

  let h='<div class="stack">';
  h+='<div class="hero"><div class="hero-in" style="padding:26px 28px 22px">'+
    '<div class="hero-l"><p class="eyebrow">Rutina · por '+esc(w.by)+'</p>'+
    '<h1 class="dsp" style="font-size:clamp(28px,3.6vw,42px);margin:10px 0 9px"><span class="wordmark">'+esc(w.title)+'</span></h1>'+
    '<p class="hero-p">Desde el '+esc(fmtDL(w.start))+'. Sube el peso solo cuando completes todas las series del rango alto.</p></div>'+
    '<div class="hero-r"><div class="flame"><span>'+ic('dumb',18)+'</span><div class="num">'+w.days.length+'</div><small>Días por semana</small></div></div>'+
    '</div></div>';

  h+='<div class="sec-h"><div><h3>'+esc(d.n)+'</h3><p>'+d.ex.length+' ejercicios · '+totalSets+' series en total</p></div>'+
    '<div class="seg scroll-x">'+w.days.map((x,i)=>'<button class="'+(i===di?'on':'')+'" data-woday="'+i+'">'+
      esc(x.n.split('·')[0].trim())+'</button>').join('')+'</div></div>';

  h+='<div class="card">'+d.ex.map((e,i)=>
    '<div class="ex"><div class="ex-i">'+(i+1)+'</div>'+
    '<div style="min-width:0"><div class="ex-n">'+esc(e.e)+'</div>'+
    '<div class="ex-m">Descanso '+esc(e.rest)+'</div></div>'+
    '<div class="ex-s">'+e.s+' × '+esc(e.r)+'<em>'+esc(e.w)+'</em></div></div>').join('')+'</div>';

  h+='<div class="row" style="justify-content:center;margin-top:4px">'+
    '<button class="btn '+(done?'btn-gh':'btn-pri')+'" data-act="wodone" data-k="'+esc(doneK)+'">'+
    ic(done?'check':'play',15)+' '+(done?'Sesión completada hoy':'Marcar sesión como hecha')+'</button></div>';

  h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:10px">Cómo progresar</p>'+
    '<div class="tiny mut" style="line-height:1.65">Cuando llegues al tope del rango de repeticiones en todas las series '+
    'durante dos sesiones seguidas, sube entre 2,5 y 5 kg y vuelve al rango bajo. '+
    'Si no llegas al rango bajo dos sesiones seguidas, baja el peso un 10%.</div></div>';

  h+='</div>';
  return h;
};

/* ═══════════════════════════════════════════════════════════
   SOCIO · PROGRESO
   ═══════════════════════════════════════════════════════════ */
V.progreso=function(u){
  const m=Q.member(u.id);
  const att=DBX.db.bookings.filter(b=>b.m===m.id&&b.st==='asistio');
  const miss=DBX.db.bookings.filter(b=>b.m===m.id&&b.st==='falta').length;
  const kcal=att.length*C.KCAL_H;
  const hrs=att.length;
  const hist=Q.meas(m.id);

  /* asistencia por semana, 12 semanas */
  const weeks=[];
  for(let w=11;w>=0;w--){
    const end=addD(-w*7), start=addD(-w*7-6);
    const n=att.filter(b=>b.date>=start&&b.date<=end).length;
    weeks.push({l:parseYmd(start).getDate()+'/'+(parseYmd(start).getMonth()+1),v:n,hi:w===0});
  }

  /* horas con cada entrenador */
  const byCoach={};
  att.forEach(b=>{const c=Q.cls(b.c);if(c)byCoach[c.coach]=(byCoach[c.coach]||0)+1;});
  const types=Object.keys(byCoach).map(k=>({k,v:byCoach[k]})).sort((a,b)=>b.v-a.v);
  const maxT=types.length?types[0].v:1;

  /* ranking del mes */
  const mStart=today().slice(0,8)+'01';
  const board=DBX.db.members.map(x=>({m:x,n:DBX.db.bookings.filter(b=>b.m===x.id&&b.st==='asistio'&&b.date>=mStart).length}))
    .sort((a,b)=>b.n-a.n).slice(0,8);
  const myPos=DBX.db.members.map(x=>({id:x.id,n:DBX.db.bookings.filter(b=>b.m===x.id&&b.st==='asistio'&&b.date>=mStart).length}))
    .sort((a,b)=>b.n-a.n).findIndex(x=>x.id===m.id)+1;

  /* logros */
  const streak=Q.streak(m.id);
  const BADGES=[
   {n:'Primera sesión',d:'Rompiste el hielo',ok:att.length>=1,ic:'play'},
   {n:'10 horas',d:'La costumbre empieza',ok:att.length>=10,ic:'bolt'},
   {n:'50 horas',d:'Esto ya es tuyo',ok:att.length>=50,ic:'fire'},
   {n:'100 horas',d:'Socio veterano',ok:att.length>=100,ic:'trophy'},
   {n:'Racha de 7',d:'Una semana sin fallar',ok:streak>=7,ic:'fire'},
   {n:'Racha de 21',d:'Tres semanas seguidas',ok:streak>=21,ic:'star'},
   {n:'Madrugador',d:'10 sesiones antes de las 8',ok:att.filter(b=>{const c=Q.cls(b.c);return c&&parseInt(c.time)<8;}).length>=10,ic:'bolt'},
   {n:'Sin faltas',d:'Ninguna falta este mes',ok:DBX.db.bookings.filter(b=>b.m===m.id&&b.st==='falta'&&b.date>=mStart).length===0,ic:'shield'},
   {n:'Todo terreno',d:'Entrenaste con los 5 coaches',ok:types.length>=5,ic:'grid'},
   {n:'-5 kg',d:'Cinco kilos menos',ok:hist.length>1&&(hist[0].w-hist[hist.length-1].w)>=5,ic:'scale'},
   {n:'Hidratado',d:'2 L durante 7 días',ok:(function(){let c=0;for(let i=0;i<7;i++)if(Q.water(m.id,addD(-i))>=8)c++;return c>=7;})(),ic:'drop'},
   {n:'Plan al 90%',d:'Adherencia de campeón',ok:(function(){let d=0,t=0;for(let i=0;i<14;i++){const a=Q.adh(m.id,addD(-i));if(a){d+=a.done;t+=a.total;}}return t&&d/t>=0.9;})(),ic:'leaf'}
  ];
  const got=BADGES.filter(b=>b.ok).length;

  let h='<div class="stack">';
  h+='<div class="grid g4">'+
    V.tile('Sesiones completadas',att.length,'',
      att.length?'desde el '+esc(fmtDL(att.map(b=>b.date).sort()[0])):'aún ninguna','','check')+
    V.tile('Horas entrenadas',hrs,'h','cada bloque dura 60 minutos','','clock')+
    V.tile('Calorías quemadas',(kcal/1000).toFixed(1).replace('.',','),'k',
      'estimado en '+C.KCAL_H+' kcal por hora','','fire')+
    V.tile('Faltas sin avisar',miss,'',miss===0?'Impecable':'Avisa antes y no cuentan',miss===0?'up':'fl','alert')+
  '</div>';

  h+='<div class="grid g-main">';
  h+='<div class="stack">'+
    '<div class="card card-pad"><div class="sec-h" style="margin-bottom:14px">'+
      '<div><h3>Asistencia por semana</h3><p>Últimas 12 semanas</p></div>'+
      '<span class="pill p-n">Media '+(weeks.reduce((a,w)=>a+w.v,0)/12).toFixed(1).replace('.',',')+' / semana</span></div>'+
      G.bars(weeks,{h:170,tip:d=>d.v+' hora'+(d.v===1?'':'s')})+'</div>';

  if(hist.length>1){
    h+='<div class="card card-pad"><div class="sec-h" style="margin-bottom:14px">'+
      '<div><h3>Peso y grasa corporal</h3><p>Lo que se mide, se mueve</p></div></div>'+
      G.line(hist.map(d=>({l:parseYmd(d.date).getDate()+' '+MON[parseYmd(d.date).getMonth()],v:+d.w.toFixed(1)})),
        {h:168,tip:d=>d.v+' kg'})+
      '<div class="legend"><span><i style="background:#D8DCE1"></i>Peso corporal (kg)</span></div></div>';
  }

  h+='<div><div class="sec-h"><div><h3>Tus logros</h3><p>'+got+' de '+BADGES.length+' desbloqueados</p></div></div>'+
    '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px">'+
    BADGES.map(b=>'<div class="badge '+(b.ok?'got':'locked')+'"><div class="badge-ic">'+ic(b.ic,21)+'</div>'+
      '<div><div class="badge-n">'+esc(b.n)+'</div><div class="badge-d">'+esc(b.d)+'</div></div></div>').join('')+
    '</div></div>';
  h+='</div>';

  /* lateral */
  h+='<div class="stack">';
  h+='<div class="card card-pad"><div class="sec-h" style="margin-bottom:14px">'+
    '<div><h3>Ranking de octubre</h3><p>Tu posición: #'+myPos+'</p></div></div>'+
    '<div class="grid" style="gap:7px">'+board.map((b,i)=>{
      const me=b.m.id===m.id;
      return '<div class="row nw" style="gap:11px;padding:8px 9px;border-radius:9px;'+
        (me?'background:var(--panel2);border:1px solid var(--line2)':'border:1px solid transparent')+'">'+
        '<div style="width:22px;text-align:center;font-family:var(--f-d);font-size:15px;'+
          (i<3?'background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent':'color:var(--dim)')+
          '">'+(i+1)+'</div>'+
        '<div class="av sm'+(me?'':' gh')+'">'+esc(me?initials(b.m.name):'·')+'</div>'+
        '<div style="flex:1;min-width:0;font-size:13px;font-weight:'+(me?'700':'500')+';overflow:hidden;'+
          'text-overflow:ellipsis;white-space:nowrap">'+esc(me?'Tú':'Socio del club')+'</div>'+
        '<div style="font-size:13px;font-weight:700">'+b.n+'</div></div>';
    }).join('')+'</div></div>';

  h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:14px">Horas con cada entrenador</p>'+
    '<div class="grid" style="gap:11px">'+types.slice(0,6).map(t=>
      '<div class="macro"><div class="macro-top"><span class="macro-n">'+esc(t.k)+'</span>'+
      '<span class="macro-v">'+t.v+'</span></div>'+meterBar(t.v/maxT*100)+'</div>').join('')+'</div></div>';

  h+='<div class="card card-pad" style="background:linear-gradient(135deg,rgba(200,215,230,.05),transparent 65%)">'+
    '<div class="row" style="gap:12px;align-items:flex-start">'+
    '<div style="width:36px;height:36px;border-radius:10px;background:var(--chrome-soft);color:#0A0A0B;'+
      'display:grid;place-items:center;flex:none">'+ic('gift',18)+'</div>'+
    '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700">Trae a un amigo</div>'+
    '<div class="tiny mut" style="margin-top:4px;line-height:1.5">Que dé tu nombre en recepción al inscribirse. '+
      'Si se queda, ustedes dos reciben una semana gratis.</div></div></div></div>';

  h+='</div></div></div>';
  return h;
};
})();
</script>
<script>
(function(){
'use strict';
const C=window.CF,DBX=window.CFDB,Q=window.CFQ,A=window.CFA,G=window.CFG,S=window.CFS,V=window.CFV;
const {ic,$,$$,esc,clamp,PEN,DOW,DOWL,MON,ymd,parseYmd,addDays,daysBetween,fmtD,fmtDL,
       today,nowMin,t2m,initials,rel}=C;
const addD=n=>ymd(addDays(new Date(),n));
const tile=V.tile,meterBar=V.meterBar,planPill=V.planPill,riskPill=V.riskPill;

function heatColor(p){
  /* escala monocroma plata, invertida a propósito: la franja VACÍA es la que brilla,
     porque es la que pide una decisión. La llena se apaga: ya está resuelta. */
  const a=Math.pow(clamp(p,0,1),0.82);
  const l=Math.round(95-a*79);
  return 'hsl(216 '+Math.round(11-a*8)+'% '+l+'%)';
}

/* ═══════════════════════════════════════════════════════════
   ADMIN · PANEL
   ═══════════════════════════════════════════════════════════ */
V.panel=function(){
  const ms=DBX.db.members;
  /* sin fecha anotada NO es vencido: es un dato que falta, y ese socio
     sigue siendo activo mientras el club no diga otra cosa */
  const active=ms.filter(x=>x.active&&!x.frozen&&
    (!x.planEnd||daysBetween(today(),x.planEnd)>=0));
  const frozen=ms.filter(x=>x.frozen);
  const expired=ms.filter(x=>x.planEnd&&daysBetween(today(),x.planEnd)<0&&!x.frozen);
  const sinSes=ms.filter(x=>x.active&&!x.frozen&&C.tocaRenovar(x));
  const mrr=active.reduce((a,x)=>a+(planMes(plan(x.plan))||0),0);
  const risks=ms.map(x=>({m:x,r:Q.risk(x.id)})).filter(x=>x.r.lvl>=2&&!x.r.frozen)
    .sort((a,b)=>b.r.lvl-a.r.lvl||b.r.gap-a.r.gap);
  const todaySes=Q.sessions(today());
  const todayAtt=DBX.db.bookings.filter(b=>b.date===today()&&b.st==='asistio').length;
  const todayBk=todaySes.reduce((a,c)=>a+Q.taken(c.id,today()),0);
  const todayCap=todaySes.reduce((a,c)=>a+c.cap,0);

  /* ocupación media 28 días */
  let oSum=0,oCap=0;
  for(let d=-27;d<=0;d++){const dt=addD(d);Q.sessions(dt).forEach(c=>{oSum+=Q.taken(c.id,dt);oCap+=c.cap;});}
  const occ=Math.round(oSum/Math.max(1,oCap)*100);

  /* asistencia por semana */
  const weeks=[];
  for(let w=11;w>=0;w--){
    const end=addD(-w*7),start=addD(-w*7-6);
    const n=DBX.db.bookings.filter(b=>b.st==='asistio'&&b.date>=start&&b.date<=end).length;
    weeks.push({l:parseYmd(start).getDate()+'/'+(parseYmd(start).getMonth()+1),v:n,hi:w===0});
  }

  /* mapa de calor */
  const grid=Q.heat();
  const hours=Array.from(new Set(DBX.db.classes.map(c=>parseInt(c.time)))).sort((a,b)=>a-b);

  /* rendimiento por entrenador */
  const byCoach={};
  DBX.db.classes.forEach(c=>{if(!byCoach[c.coach])byCoach[c.coach]={cap:0,took:0,n:0};});
  for(let d=-27;d<=0;d++){const dt=addD(d);Q.sessions(dt).forEach(c=>{
    byCoach[c.coach].cap+=c.cap;byCoach[c.coach].took+=Q.taken(c.id,dt);byCoach[c.coach].n++;});}
  const perf=Object.keys(byCoach).map(k=>({k,...byCoach[k],pct:byCoach[k].took/Math.max(1,byCoach[k].cap)*100}))
    .sort((a,b)=>b.pct-a.pct);

  /* vencimientos próximos */
  const soon=ms.filter(x=>!x.frozen&&x.planEnd).map(x=>({m:x,d:daysBetween(today(),x.planEnd)}))
    .filter(x=>x.d>=-30&&x.d<=10).sort((a,b)=>a.d-b.d);

  let h='<div class="stack">';

  h+='<div class="grid g4 g-stats">'+
    tile('Socios activos',active.length,'',frozen.length+' congelados · '+expired.length+
      ' vencidos'+(sinSes.length?' · '+sinSes.length+' por renovar':''),'','users')+
    tile('Ingreso recurrente',PEN(mrr),'','al mes, solo membresías','','money')+
    tile('Ocupación media',occ,'%','últimos 28 días',occ>=70?'up':occ>=50?'fl':'dn','chart')+
    tile('En riesgo',risks.length,'','socios que hay que llamar',risks.length?'dn':'up','alert')+
  '</div>';

  h+='<div class="grid g-main">';

  /* izquierda */
  h+='<div class="stack">';
  h+='<div class="card card-pad"><div class="sec-h" style="margin-bottom:16px">'+
    '<div><h3>Mapa de calor de ocupación</h3><p>Media de los últimos 28 días por franja y día</p></div>'+
    '<div class="row" style="gap:7px"><span class="tiny dim">Vacía</span>'+
      '<span style="display:inline-flex;gap:2px">'+[0,.25,.5,.75,1].map(p=>
        '<i style="width:15px;height:11px;border-radius:2px;display:inline-block;background:'+heatColor(p)+'"></i>').join('')+
      '</span><span class="tiny dim">Llena</span>'+
      '<span class="tiny dim" style="margin-left:4px;display:inline-flex;align-items:center;gap:5px">'+
      '<i class="heat-c heat-off" style="width:15px;height:11px;min-height:0;border-radius:2px;display:inline-block"></i>'+
      'Sin clase</span></div></div>'+
    '<div class="scroll-x"><div class="heat" style="min-width:420px">'+
      '<div></div>'+[1,2,3,4,5,6,0].map(d=>'<div class="heat-h">'+DOW[d]+'</div>').join('')+
      hours.map(hh=>{
        return '<div class="heat-y">'+String(hh).padStart(2,'0')+':00</div>'+
        [1,2,3,4,5,6,0].map(d=>{
          const g=grid[hh+'|'+d];
          if(!g||!g.cap)return '<div class="heat-c heat-off" title="Sin clase programada"></div>';
          const p=g.sum/g.cap;
          return '<div class="heat-c" style="background:'+heatColor(p)+'" title="'+DOWL[d]+' '+hh+
            ':00 · '+Math.round(p*100)+'% de aforo"></div>';
        }).join('');
      }).join('')+
    '</div></div>'+
    '<p class="tiny dim" style="margin:13px 0 0;line-height:1.55">Las franjas claras son cupos que pagas igual '+
    'y nadie ocupa: ahí caben promociones, clases nuevas o menos personal. Las oscuras ya están llenas; '+
    'si se repiten, piden más cupos o una segunda sala.</p></div>';

  h+='<div class="card card-pad"><div class="sec-h" style="margin-bottom:14px">'+
    '<div><h3>Asistencias por semana</h3><p>Todas las clases del club</p></div></div>'+
    G.bars(weeks,{h:176,tip:d=>d.v+' asistencias'})+'</div>';

  h+='<div><div class="sec-h"><div><h3>Rendimiento por entrenador</h3>'+
    '<p>Ocupación media de sus bloques en los últimos 28 días</p></div></div><div class="tbl-wrap"><table>'+
    '<thead><tr><th>Entrenador</th><th class="r">Bloques</th>'+
    '<th class="r">Asistencias</th><th style="width:180px">Ocupación</th></tr></thead><tbody>'+
    perf.map(p=>'<tr><td><div class="cellp"><div class="av sm gh">'+esc(initials(p.k))+'</div>'+
      '<div style="min-width:0"><b>'+esc(p.k)+'</b></div></div></td>'+
      '<td class="r mut">'+p.n+'</td><td class="r bold">'+p.took+'</td>'+
      '<td><div class="row nw" style="gap:10px">'+meterBar(p.pct,p.pct>=80?'ok':p.pct>=55?'':'bad')+
      '<span class="tiny" style="min-width:34px;text-align:right;font-weight:700">'+Math.round(p.pct)+'%</span></div></td></tr>').join('')+
    '</tbody></table></div></div>';
  h+='</div>';

  /* derecha */
  h+='<div class="stack">';
  h+='<div class="card card-pad"><div class="sec-h" style="margin-bottom:13px">'+
    '<div><h3>Hoy en el club</h3><p>'+esc(DOWL[new Date().getDay()])+' '+esc(fmtDL(today()))+'</p></div></div>'+
    '<div class="ring-wrap">'+G.ring(Math.round(todayBk/Math.max(1,todayCap)*100),{sz:92,sw:9,sub:'aforo'})+
    '<div style="flex:1;min-width:110px"><div class="grid" style="gap:9px">'+
      '<div class="row btw"><span class="tiny mut">Bloques abiertos</span><b>'+todaySes.length+'</b></div>'+
      '<div class="row btw"><span class="tiny mut">Cupos reservados</span><b>'+todayBk+'</b></div>'+
      '<div class="row btw"><span class="tiny mut">Asistencias marcadas</span><b>'+todayAtt+'</b></div>'+
      '<div class="row btw"><span class="tiny mut">Cupos libres</span><b>'+(todayCap-todayBk)+'</b></div>'+
    '</div></div></div>'+
    '<button class="btn btn-gh btn-sm btn-blk" data-go="hoy" style="margin-top:15px">Ver la agenda de hoy</button></div>';

  h+='<div><div class="sec-h"><div><h3>Hay que llamarlos</h3><p>'+risks.length+' socios en riesgo</p></div>'+
    '<button class="btn btn-qt btn-sm" data-go="riesgo">Ver todos</button></div>';
  if(risks.length){
    h+='<div class="grid" style="gap:8px">'+risks.slice(0,5).map(x=>
      '<div class="card card-pad sheen" style="padding:13px 14px">'+
      '<div class="row nw" style="gap:11px"><div class="av sm gh">'+esc(initials(x.m.name))+'</div>'+
      '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;overflow:hidden;'+
        'text-overflow:ellipsis;white-space:nowrap">'+esc(x.m.name)+'</div>'+
      '<div class="tiny dim" style="margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
        esc(x.r.why)+'</div></div>'+riskPill(x.r)+'</div>'+
      '<button class="btn btn-gh btn-xs btn-blk" data-act="wa" data-m="'+x.m.id+'" style="margin-top:10px">'+
        ic('wa',13)+' Escribir por WhatsApp</button></div>').join('')+'</div>';
  } else {
    h+='<div class="card"><div class="empty"><p>Nadie en riesgo ahora mismo. Buen trabajo.</p></div></div>';
  }
  h+='</div>';

  h+='<div><div class="sec-h"><div><h3>Vencimientos</h3><p>Próximos 10 días y vencidos</p></div></div>'+
    '<div class="tbl-wrap"><table style="min-width:0"><tbody>'+
    soon.slice(0,8).map(x=>'<tr><td><div class="cellp"><div class="av sm gh">'+esc(initials(x.m.name))+'</div>'+
      '<div style="min-width:0"><b>'+esc(x.m.name)+'</b><span>'+esc(plan(x.m.plan).n)+' · '+planLbl(plan(x.m.plan))+'</span></div></div></td>'+
      '<td class="r" style="white-space:nowrap">'+(x.d<0?'<span class="pill p-bad">Vencida</span>':
        x.d<=3?'<span class="pill p-warn">'+x.d+' d</span>':'<span class="pill p-n">'+x.d+' d</span>')+'</td>'+
      '<td class="r"><button class="btn btn-gh btn-xs" data-act="renew" data-m="'+x.m.id+'">Renovar</button></td></tr>').join('')+
    '</tbody></table></div></div>';

  h+='</div></div></div>';
  return h;
};

/* ═══════════════════════════════════════════════════════════
   ADMIN · SOCIOS
   ═══════════════════════════════════════════════════════════ */
V.socios=function(){
  const qs=(S.ctx.q||'').toLowerCase();
  const f=S.seg.soc||'todos';
  let list=DBX.db.members.slice();
  if(qs)list=list.filter(m=>(m.name+' '+(m.dni||'')+' '+m.email+' '+m.phone).toLowerCase().indexOf(qs)>=0);
  /* Los que se fueron y no renovaron no ensucian la lista del día a día.
     Si el club busca a alguien por su nombre, sí sale: para eso está la
     pastilla «Baja». */
  if(f!=='bajas' && f!=='repes' && !qs) list=list.filter(m=>m.active);
  if(f==='bajas') list=list.filter(m=>!m.active);
  if(f==='riesgo')list=list.filter(m=>Q.risk(m.id).lvl>=2);
  if(f==='vencidos')list=list.filter(m=>m.planEnd&&daysBetween(today(),m.planEnd)<0&&!m.frozen);
  if(f==='renovar')list=list.filter(m=>m.active&&!m.frozen&&C.tocaRenovar(m));
  if(f==='congelados')list=list.filter(m=>m.frozen);
  if(f==='falta'){
    /* a una ficha dada de baja no hay nada que completarle */
    list=list.filter(m=>m.active&&Q.faltaInfo(m).length);
    /* primero los que ni siquiera pueden entrar a la app */
    list.sort((a,b)=>(a.dni?1:0)-(b.dni?1:0)||
                     Q.faltaInfo(b).length-Q.faltaInfo(a).length||
                     a.name.localeCompare(b.name,'es'));
  }
  const repes = Q.posiblesRepes();
  if(f==='repes'){
    const ids=new Set(); repes.forEach(x=>{ids.add(x.a.id);ids.add(x.b.id);});
    list=list.filter(m=>ids.has(m.id));
  }
  list.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  /* en «¿Repetidas?» se ordenan por pareja, no por nombre suelto */
  if(f==='repes'){
    const orden=[]; repes.forEach(x=>{orden.push(x.a.id,x.b.id);});
    list.sort((a,b)=>orden.indexOf(a.id)-orden.indexOf(b.id));
  }

  const nFalta=DBX.db.members.filter(m=>!m.demo&&m.active&&Q.faltaInfo(m).length).length;
  const nBajas=DBX.db.members.filter(m=>!m.active).length;
  const nVenc=DBX.db.members.filter(m=>m.planEnd&&!m.frozen&&
    daysBetween(today(),m.planEnd)<0).length;
  const nSin=DBX.db.members.filter(m=>m.active&&!m.frozen&&C.tocaRenovar(m)).length;
  const parDe={}; repes.forEach(x=>{parDe[x.a.id]=x; parDe[x.b.id]=x;});

  let h='<div class="stack">';
  h+='<div class="row btw" style="gap:12px">'+
    '<div style="flex:1;min-width:200px;max-width:380px;position:relative">'+
      '<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none">'+ic('search',15)+'</span>'+
      '<input class="inp" id="socQ" placeholder="Buscar por nombre, DNI o teléfono" value="'+esc(S.ctx.q||'')+'" style="padding-left:36px">'+
    '</div>'+
    '<div class="seg scroll-x">'+[['todos','Todos'],['riesgo','Riesgo'],
        ['vencidos','Vencidos'+(nVenc?' · '+nVenc:'')],
        ['renovar','Toca renovar'+(nSin?' · '+nSin:'')],
        ['congelados','Congelados'],
        ['falta','Falta'+(nFalta?' · '+nFalta:'')],
        ['repes','Repetidas'+(repes.length?' · '+repes.length:'')],
        ['bajas','Bajas'+(nBajas?' · '+nBajas:'')]].map(k=>
      '<button class="'+(f===k[0]?'on':'')+'" data-socf="'+k[0]+'">'+esc(k[1])+'</button>').join('')+'</div></div>';

  if(f==='falta'){
    const sinDni=DBX.db.members.filter(m=>m.active&&!m.dni).length;
    h+='<div class="card card-pad"><div class="tiny mut" style="line-height:1.6">'+
      'Fichas a las que les falta algún dato, las más incompletas arriba. '+
      (sinDni?'<b style="color:var(--bad)">A '+sinDni+' les falta el DNI: hasta que lo tengas no pueden entrar a la app.</b> ':'')+
      'El resto hace falta para cobrar, avisar por WhatsApp o clasificar su composición. '+
      'Toca «Editar» y se llena ahí mismo.</div></div>';
  }
  if(f==='renovar') h+='<div class="card card-pad"><div class="tiny mut" style="line-height:1.6">'+
    'Socios cuyo plan ya se acabó, sea porque gastaron todas sus sesiones o porque '+
    'se cumplieron los meses que dura. Toca preguntarles si renuevan. Mientras tanto '+
    'no pueden apartar hora desde la app.</div></div>';
  if(f==='bajas') h+='<div class="card card-pad"><div class="tiny mut" style="line-height:1.6">'+
    'Socios antiguos que no renovaron. No se borran: su historial y sus valoraciones '+
    'siguen ahí por si vuelven. No cuentan como vencidos ni como fichas incompletas, '+
    'y no salen en el resto de listas.</div></div>';
  if(f==='repes') h+='<div class="card card-pad"><div class="tiny mut" style="line-height:1.6">'+
    'Nombres tan parecidos que podrían ser la misma persona anotada dos veces. Van en parejas. '+
    'Cuando confirmes que son dos personas distintas, pulsa <b>«Son distintas»</b> y la pareja deja de aparecer.</div></div>';

  const ultima = f==='falta'?'Qué falta' : f==='repes'?'Se parece a' : 'Riesgo';
  h+='<div class="desliza">Desliza la tabla de lado para ver el resto y los botones →</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Socio</th><th>Estado</th><th>Plan</th>'+
    '<th class="r">Clases 30 d</th><th>Última visita</th><th>'+esc(ultima)+'</th><th class="r">Acciones</th></tr></thead><tbody>'+
    (list.length?list.map(m=>{
      const r=Q.risk(m.id), lv=Q.lastVisit(m.id);
      const n30=Q.attendedSince(m.id,addD(-30));
      return '<tr><td><div class="cellp"><div class="av sm gh">'+esc(initials(m.name))+'</div>'+
        '<div style="min-width:0"><b>'+esc(m.name)+'</b><span>'+esc(ident(m))+'</span></div></div></td>'+
        '<td>'+planPill(m)+C.sesLinea(m)+'</td>'+
        '<td><span class="pill p-n">'+esc(plan(m.plan).n)+'</span><div class="tiny dim" style="margin-top:3px">'+
          PEN(plan(m.plan).price)+'/mes</div></td>'+
        '<td class="r bold">'+n30+'</td>'+
        '<td class="mut tiny">'+(lv?esc(rel(lv)):'Nunca')+'</td>'+
        '<td>'+(
          f==='falta'
            ? Q.faltaInfo(m).map(x=>'<span class="pill '+(x==='DNI'?'p-bad':'p-warn')+'" '+
                'style="margin:1px 3px 1px 0">'+esc(x)+'</span>').join('')
          : f==='repes' && parDe[m.id]
            ? (()=>{const o=parDe[m.id].a.id===m.id?parDe[m.id].b:parDe[m.id].a;
                return '<b style="font-size:12.5px">'+esc(o.name)+'</b>'+
                  '<div class="tiny dim" style="margin-top:2px">'+esc(ident(o))+' · '+
                  (o.active?'activo':'inactivo')+'</div>'+
                  '<div class="tiny" style="color:var(--warn);margin-top:2px">'+
                  esc(parDe[m.id].motivo)+'</div>';})()
          : riskPill(r))+'</td>'+
        '<td class="r"><div class="row nw" style="justify-content:flex-end;gap:5px">'+
          (f==='falta'
            ? '<button class="btn btn-gh btn-xs" data-act="editsoc" data-m="'+m.id+'">Editar</button>'
            : f==='repes' && parDe[m.id]
            ? '<button class="btn btn-gh btn-xs" data-act="norepe" data-k="'+esc(parDe[m.id].clave)+'">Son distintas</button>'
            : '')+
          '<button class="btn btn-gh btn-xs" data-act="member" data-m="'+m.id+'">Ficha</button>'+
          '<button class="btn btn-gh btn-xs" data-act="pinreset" data-m="'+m.id+'" '+
            'title="Ver o cambiar su PIN">PIN</button>'+
          '<button class="btn btn-gh btn-xs" data-act="wa" data-m="'+m.id+'">'+ic('wa',12)+'</button>'+
        '</div></td></tr>';
    }).join('')
    :'<tr><td colspan="7"><div class="empty"><h4>Sin resultados</h4><p>Prueba con otro nombre o cambia el filtro.</p></div></td></tr>')+
  '</tbody></table></div>';
  h+='<p class="tiny dim">'+list.length+' de '+DBX.db.members.length+' socios</p>';
  h+='</div>';
  return h;
};

/* ═══════════════════════════════════════════════════════════

  h+='<div><h3 style="margin:0;font-size:15px;font-weight:800">Quién cubre cada hora</h3>'+

    DBX.db.classes.reduce((a,c)=>a+c.days.length,0)+' sesiones por semana</p></div>';

  h+='<div class="scroll-x"><div style="min-width:760px;display:grid;grid-template-columns:62px repeat(7,minmax(0,1fr));gap:4px">'+
    '<div></div>'+[1,2,3,4,5,6,0].map(d=>'<div class="heat-h" style="font-size:10px;padding:6px 0">'+DOWL[d]+'</div>').join('');

        '<div class="tiny dim" style="font-size:10px;line-height:1.3">'+c.cap+' cupos</div>'+

      '<div class="tiny mut" style="margin-top:3px;line-height:1.55">La planilla que envió el club no trae quién '+

      'escribe el nombre real: el socio lo ve al momento en su app.</div></div></div></div>';

    '<div class="tiny mut" style="line-height:1.6">Cada recuadro es una hora con un entrenador en sala. Toca uno para '+
    'cambiar de entrenador o ajustar el aforo. Los huecos punteados son horas cerradas: compáralos con el mapa de calor '+
    'del panel antes de abrir una franja nueva.</div></div>';

  return h;
};

/* ═══════════════════════════════════════════════════════════
   ADMIN · PLANES Y PRECIOS
   Lo que el club vende. Antes estaba escrito dentro de la app y
   solo se podía cambiar tocando el código; ahora lo lleva el club.
   ═══════════════════════════════════════════════════════════ */
V.tarifas=function(){
  const P=DBX.PLANS;
  const claves=Object.keys(P).sort((a,b)=>
    (P[a].orden==null?999:P[a].orden)-(P[b].orden==null?999:P[b].orden) ||
    String(P[a].n).localeCompare(String(P[b].n)));
  const cuantos=k=>DBX.db.members.filter(m=>m.plan===k&&m.active!==false).length;
  const vivos=claves.filter(k=>P[k].activo!==false);
  const guardados=claves.filter(k=>P[k].activo===false);

  /* lo que suman los planes vigentes: en los negociados, lo que paga cada
     socio según su ficha */
  const ingreso=DBX.db.members.filter(m=>m.active!==false&&m.plan&&P[m.plan])
    .reduce((a,m)=>a+(Q.cuotaDe(m)||0),0);
  /* un negociado sin monto en la ficha de alguien que lo tiene sí es un hueco */
  const sinMonto=DBX.db.members.filter(m=>m.active!==false&&Q.planNegociado(m.plan)
    &&m.precio==null).length;

  let h='<div class="stack">';
  h+='<div><h3 style="margin:0;font-size:15px;font-weight:800">Lo que vende el club</h3>'+
    '<p class="tiny dim" style="margin:2px 0 0">'+vivos.length+' plan'+(vivos.length===1?'':'es')+' a la venta'+
    (guardados.length?' · '+guardados.length+' retirado'+(guardados.length===1?'':'s'):'')+
    (ingreso?' · '+PEN(ingreso)+' en planes vigentes':'')+'</p></div>';

  if(sinMonto) h+='<div class="card card-pad" style="border-color:#5A471C;background:var(--warnd)">'+
    '<div class="row" style="gap:12px;align-items:flex-start">'+ic('alert',17)+
    '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700;color:var(--warn)">'+
    (sinMonto===1?'Un socio en plan negociado sin monto'
                 :sinMonto+' socios en plan negociado sin monto')+'</div>'+
    '<div class="tiny mut" style="margin-top:3px;line-height:1.55">En los planes sin precio de lista, el monto '+
    'se escribe en la ficha de cada socio: Socios → la persona → Editar datos. Mientras falte, las '+
    'estadísticas no cuentan lo que paga.</div></div></div></div>';

  const tarjeta=k=>{
    const p=P[k], n=cuantos(k), muerto=p.activo===false;
    return '<button class="card sheen" data-act="tarifa" data-k="'+esc(k)+'" style="padding:15px 16px;'+
      'text-align:left;display:flex;flex-direction:column;gap:9px;cursor:pointer;width:100%'+
      (muerto?';opacity:.62':'')+'">'+
      '<div class="row" style="gap:10px;align-items:flex-start;width:100%">'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:14.5px;font-weight:800;letter-spacing:-.01em">'+esc(p.n)+'</div>'+
          '<div class="tiny dim" style="margin-top:2px">'+
            (p.meses?(p.meses===1?'1 mes':p.meses+' meses'):'')+
            (p.porSem?' · '+p.porSem+' veces por semana':'')+
            (p.classes?' · '+p.classes+' sesiones':'')+'</div>'+
        '</div>'+
        '<div style="text-align:right;flex:0 0 auto">'+
          '<div style="font-size:15px;font-weight:800;letter-spacing:-.02em'+
            (p.price==null?';color:var(--mut);font-size:12px;font-weight:700':'')+'">'+
            (p.price==null?'precio por socio':PEN(p.price))+'</div>'+
          (muerto?'<div class="pill p-n" style="margin-top:4px">Retirado</div>':'')+
        '</div>'+
      '</div>'+
      (p.desc?'<div class="tiny mut" style="line-height:1.5">'+esc(p.desc)+'</div>':'')+
      '<div class="tiny dim">'+(n?(n===1?'1 socio lo tiene':n+' socios lo tienen'):'nadie lo tiene todavía')+'</div>'+
    '</button>';
  };

  h+='<div class="grid g2" style="gap:11px">'+vivos.map(tarjeta).join('')+'</div>';

  if(guardados.length){
    h+='<div><p class="eyebrow" style="margin:4px 0 9px">Retirados de la venta</p>'+
      '<div class="grid g2" style="gap:11px">'+guardados.map(tarjeta).join('')+'</div></div>';
  }

  h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:9px">Cómo funciona</p>'+
    '<div class="tiny mut" style="line-height:1.6">Toca un plan para cambiarle el precio, las sesiones o la '+
    'descripción. Los cambios se ven al momento en la ficha de cada socio y en las estadísticas. '+
    'Un plan que alguien tiene contratado no se borra: se retira de la venta y deja de aparecer al dar de alta, '+
    'pero quienes ya lo tienen lo conservan hasta que renueven.</div></div>';
  h+='</div>';
  return h;
};

/* ═══════════════════════════════════════════════════════════
   ADMIN · HOY (lista de clases y entradas)
   ═══════════════════════════════════════════════════════════ */
V.hoy=function(){
  /* La consulta entra aquí solo para mirar: ve quién entrena a cada hora,
     pero no mueve, ni quita, ni marca asistencia. Eso lo lleva el club. */
  const mando = !!(S.user && S.user.role==='admin');
  const hoyY=today();
  const wk=clamp(S.wk||0,-1,4);
  const week=V.weekDays(wk);
  let sel=S.day;
  if(!sel||week.indexOf(sel)<0) sel = week.indexOf(hoyY)>=0 ? hoyY : week[0];
  const ses=Q.sessions(sel);

  const a=parseYmd(week[0]), b2=parseYmd(week[6]);
  const rango=a.getDate()+' '+MON[a.getMonth()]+' – '+b2.getDate()+' '+MON[b2.getMonth()];

  let h='<div class="stack">';
  /* los mismos días que ve el socio, con flechas para cambiar de semana */
  let days='<div class="rz-week">';
  week.forEach(d=>{
    const dt=parseYmd(d), ss=Q.sessions(d);
    let libres=0, apuntados=0;
    ss.forEach(c=>{ if(Q.blocked(c.id,d))return;
      libres+=Math.max(0,c.cap-Q.taken(c.id,d));
      apuntados+=Q.roster(c.id,d).filter(x=>x.st!=='espera').length; });
    days+='<button class="rz-day'+(d===sel?' on':'')+(ss.length?'':' off')+'" data-day="'+d+'">'+
      '<div class="rz-dw">'+(d===hoyY?'Hoy':DOW[dt.getDay()])+'</div>'+
      '<div class="rz-dn">'+dt.getDate()+'</div>'+
      '<div class="rz-df">'+(ss.length?'<b>'+apuntados+'</b><span class="rz-dfw"> apuntados</span>':'—')+'</div>'+
      '<div class="rz-dm none"></div></button>';
  });
  days+='</div>';
  h+='<div class="sec-h" style="margin-bottom:9px"><div>'+
      '<p class="eyebrow">Elige el día</p>'+
      '<h3 style="margin-top:4px">'+esc(rango)+'</h3></div></div>';
  h+='<div class="rz-nav">'+
      '<button class="rz-ar" data-wk="'+(wk-1)+'" aria-label="Semana anterior">'+ic('left',18)+'</button>'+
      days+
      '<button class="rz-ar" data-wk="'+(wk+1)+'" aria-label="Semana siguiente">'+ic('right',18)+'</button>'+
    '</div>';

  if(!ses.length){
    h+='<div class="card"><div class="empty"><div class="empty-ic">'+ic('cal',22)+'</div>'+
      '<h4>Cerrado ese día</h4><p>El horario no tiene bloques abiertos.</p></div></div>';
  }
  ses.forEach(c=>{
    const bloq=Q.blocked(c.id,sel);
    const roster=Q.roster(c.id,sel);
    const tk=Q.taken(c.id,sel);
    const inRoom=roster.filter(b=>b.st==='asistio').length;
    const libres=Math.max(0,c.cap-tk);

(function(){
'use strict';
const C=window.CF,DBX=window.CFDB,Q=window.CFQ,A=window.CFA,G=window.CFG,S=window.CFS,V=window.CFV;
const B=window.CFBODY;
const {ic,$,$$,esc,clamp,PEN,DOW,DOWL,MON,ymd,parseYmd,addDays,daysBetween,fmtD,fmtDL,
       today,initials,rel}=C;
const addD=n=>ymd(addDays(new Date(),n));
const tile=V.tile,meterBar=V.meterBar;

/* La planilla del club anota la edad, no la fecha de nacimiento: hay que
   mirar las dos. Devuelve null cuando no consta, para no fingir un 30. */
function edadM(m){
  if(!m) return null;
  if(m.edad!=null&&m.edad!=='') return +m.edad;
  if(m.born) return age(m.born);
  return null;
}
function age(born){
  if(!born)return 30;
  const b=parseYmd(born),n=new Date();
  let a=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;
  return a;
}
/* Mifflin-St Jeor + factor de actividad por clases/semana */
function macros(sex,w,h,yrs,perWeek,goal){
  const bmr = 10*w + 6.25*h - 5*yrs + (sex==='F'?-161:5);
  const af = perWeek<=1?1.2 : perWeek<=3?1.375 : perWeek<=5?1.55 : 1.725;
  const tdee = bmr*af;
  const mult = goal==='deficit'?0.80 : goal==='superavit'?1.10 : 1.0;
  const kcal = Math.round(tdee*mult/10)*10;
  const prot = Math.round(w*(goal==='deficit'?2.0:1.8));
  const fat  = Math.round(kcal*0.25/9);
  const carb = Math.max(0,Math.round((kcal - prot*4 - fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,carb,fat,water:Math.round(w*35/100)*100};
}
window.CFNUT={age,edadM,macros};

function adh14(mid){
  let d=0,t=0;
  for(let i=0;i<14;i++){const a=Q.adh(mid,addD(-i));if(a){d+=a.done;t+=a.total;}}
  return t?Math.round(d/t*100):null;
}

  if(f==='semana') list=list.filter(m=>Q.tocaMedir(m.id).orden===2);

    tile('Adherencia media',avgAdh==null?'—':avgAdh,avgAdh==null?'':'%',
      adhVals.length?'de los que registran comidas':'nadie registra comidas todavía',

  h+='<div class="row btw" style="gap:12px">'+
    '<div style="flex:1;min-width:200px;max-width:380px;position:relative">'+
      '<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none">'+ic('search',15)+'</span>'+
      '<input class="inp" id="pacQ" placeholder="Buscar socio" value="'+esc(S.ctx.q||'')+'" style="padding-left:36px">'+
    '</div>'+
    '<div class="seg scroll-x">'+[['todos','Todos'],
        ['toca','Medir'+(toca?' · '+toca:'')],
        ['semana','Semana'+(semana?' · '+semana:'')],
        ['sinplan','Sin dieta'],
        ['falta','Falta'+(nFalta?' · '+nFalta:'')]].map(k=>
      '<button class="'+(f===k[0]?'on':'')+'" data-pacf="'+k[0]+'">'+esc(k[1])+'</button>').join('')+'</div>'+
    '<button class="btn btn-gh btn-sm" data-act="measure">'+ic('ruler',15)+' Nueva valoración</button></div>';

  if(f==='toca'||f==='semana') h+='<div class="card card-pad"><div class="tiny mut" style="line-height:1.6">'+
    'La valoración se repite cada <b>'+Q.CICLO+' días</b>. Aquí salen los socios a los que ya les toca o '+
    'les toca esta semana: es la lista para pedirles la cita. En cuanto registres la valoración desde '+

  if(f==='falta') h+='<div class="card card-pad"><div class="tiny mut" style="line-height:1.6">'+
    'Socios con la ficha de cuerpo incompleta. Lo que falta sale en su fila: se llena desde '+
    '«Medir» y la dieta desde «Crear plan», y aparece al momento en la app del socio.</div></div>';

  h+='<div class="desliza">Desliza la tabla de lado para ver la dieta y los botones →</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Socio</th><th class="r">Peso</th><th class="r">IMC</th>'+
    '<th class="r">Grasa</th><th>'+(f==='falta'?'Qué falta':'Toca medir')+'</th><th>Dieta</th>'+
    '<th style="width:140px">Adherencia</th><th class="r">Acciones</th></tr></thead><tbody>'+
    (list.length?list.map(m=>{
      const lm=Q.lastMeas(m.id), pl=Q.plan(m.id), ad=adh14(m.id);
      const imc=lm&&lm.w&&lm.h?B.IMC(lm.w,lm.h):0;
      const tm=Q.tocaMedir(m.id);
      return '<tr><td><button class="cellp cellp-b" data-act="paciente" data-m="'+m.id+'" '+

        '<div style="min-width:0;text-align:left"><b>'+esc(m.name)+'</b><span>'+esc(ident(m))+
          (edadM(m)?' · '+edadM(m)+' años':'')+(m.sex?' · '+(m.sex==='F'?'Mujer':'Hombre'):'')+
          '</span></div></button></td>'+
        '<td class="r bold">'+(lm&&lm.w!=null?lm.w.toFixed(1):'—')+'</td>'+
        '<td class="r mut">'+(imc?imc.toFixed(1):'—')+'</td>'+
        '<td class="r mut">'+(lm&&lm.bf!=null?lm.bf.toFixed(1)+'%':'—')+'</td>'+
        '<td>'+(f==='falta'
          ? Q.faltaCuerpo(m).map(x=>'<span class="pill '+(x==='valoración'?'p-bad':'p-warn')+
              '" style="margin:1px 3px 1px 0">'+esc(x)+'</span>').join('')
          : '<span class="pill p-'+tm.k+'">'+esc(tm.txt)+'</span>'+
            (lm?'<div class="tiny dim" style="margin-top:2px;white-space:nowrap">'+esc(rel(lm.date))+'</div>':''))+'</td>'+

  '</tbody></table></div>';

V.calculadora=function(){
  const mid=S.ctx.calcM||DBX.db.members[0].id;
  const m=Q.member(mid), lm=Q.lastMeas(mid);
  const goal=S.ctx.calcG||'deficit';
  const perWeek=+(S.ctx.calcF!=null?S.ctx.calcF:(Q.attendedSince(mid,addD(-28))/4).toFixed(0))||3;
  const w=lm?lm.w:70, hh=lm?lm.h:170, yrs=edadM(m)||30;
  const r=macros(m.sex,w,hh,yrs,perWeek,goal);

  let h='<div class="stack">';
  h+='<div class="card card-pad"><div class="sec-h" style="margin-bottom:17px">'+
    '<div><h3>Calculadora de requerimientos</h3><p>Mifflin-St Jeor con factor de actividad real del socio</p></div></div>'+
    '<div class="grid g3" style="margin-bottom:18px">'+
    '<div class="fld"><label for="calcM">Socio</label><select class="inp" id="calcM" data-calc="M">'+
      DBX.db.members.map(x=>'<option value="'+x.id+'"'+(x.id===mid?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label for="calcG">Objetivo</label><select class="inp" id="calcG" data-calc="G">'+
      [['deficit','Perder grasa (-20%)'],['mantener','Mantener'],['superavit','Ganar masa (+10%)']].map(x=>
      '<option value="'+x[0]+'"'+(goal===x[0]?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label for="calcF">Entrenos por semana</label>'+
      '<input class="inp" id="calcF" type="number" min="0" max="10" value="'+perWeek+'" data-calc="F"></div>'+
    '</div>';

  if(!lm){
    h+='<div class="card card-pad" style="background:var(--warnd);border-color:#5A471C">'+
      '<div class="tiny" style="color:#F5D08A">Este socio no tiene valoración. Los cálculos usan 70 kg y 170 cm '+
      'por defecto: regístrale una medición antes de entregarle el plan.</div></div>';
  }

  h+='<div class="grid g4" style="margin-bottom:18px">'+
    tile('Metabolismo basal',r.bmr,'kcal','lo que gasta en reposo','','bolt')+
    tile('Gasto total diario',r.tdee,'kcal','con '+perWeek+' entrenos/semana','','fire')+
    tile('Objetivo calórico',r.kcal,'kcal',goal==='deficit'?'déficit del 20%':goal==='superavit'?'superávit del 10%':'mantenimiento','','leaf')+
    tile('Agua recomendada',(r.water/1000).toFixed(1).replace('.',','),'L','35 ml por kilo','','drop')+
  '</div>';

  h+='<div class="grid g2"><div class="card card-pad"><p class="eyebrow" style="margin-bottom:15px">Reparto de macronutrientes</p>'+
    '<div class="grid" style="gap:15px">'+
    [['Proteína',r.prot,r.prot*4,(goal==='deficit'?'2,0':'1,8')+' g por kilo'],
     ['Carbohidratos',r.carb,r.carb*4,'el resto de las calorías'],
     ['Grasas',r.fat,r.fat*9,'25% de las calorías']].map(x=>
    '<div class="macro"><div class="macro-top"><span class="macro-n">'+esc(x[0])+'</span>'+
      '<span class="macro-v">'+x[1]+' g <em>· '+x[2]+' kcal</em></span></div>'+
      meterBar(x[2]/r.kcal*100)+'<div class="tiny dim">'+esc(x[3])+'</div></div>').join('')+
    '</div></div>'+
    '<div class="card card-pad"><p class="eyebrow" style="margin-bottom:15px">Datos usados</p>'+
    '<div class="grid" style="gap:11px">'+
    [['Sexo',m.sex==='F'?'Mujer':'Hombre'],['Edad',yrs+' años'],['Peso',w.toFixed(1)+' kg'],
     ['Talla',hh+' cm'],['Clases últimas 4 semanas',Q.attendedSince(mid,addD(-28))],
     ['Factor de actividad',perWeek<=1?'1,20 sedentario':perWeek<=3?'1,375 ligero':perWeek<=5?'1,55 moderado':'1,725 alto']]
    .map(x=>'<div class="row btw"><span class="tiny mut">'+esc(x[0])+'</span><b class="tiny">'+esc(x[1])+'</b></div>').join('')+
    '</div>'+
    '<button class="btn btn-pri btn-sm btn-blk" data-act="planedit" data-m="'+mid+'" style="margin-top:17px">'+
      ic('leaf',14)+' Crear plan con estos valores</button></div></div>';

  h+='</div>';

  h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:9px">Aviso</p>'+
    '<div class="tiny mut" style="line-height:1.6">Estas cifras son una estimación de partida, no una prescripción. '+
    'Ajústalas con la evolución real del socio: si en dos semanas no se mueve el peso en la dirección esperada, '+
    'corrige entre 100 y 200 kcal antes de cambiar el reparto de macros.</div></div>';
  h+='</div>';
  return h;
};
})();
</script>
<script>
(function(){
'use strict';
const C=window.CF,DBX=window.CFDB,Q=window.CFQ,A=window.CFA,G=window.CFG,S=window.CFS,V=window.CFV;
const B=window.CFBODY,N=window.CFNUT,toast=window.CFT,{modal,closeModal}=window.CFM;
const {ic,$,$$,esc,clamp,uid,PEN,DOW,DOWL,MON,ymd,parseYmd,addDays,daysBetween,fmtD,fmtDL,
       today,initials,rel}=C;
const addD=n=>ymd(addDays(new Date(),n));
const M={}; window.CFMOD=M;

function fld(id,label,input){return '<div class="fld"><label for="'+id+'">'+esc(label)+'</label>'+input+'</div>';}
function inp(id,o){o=o||{};
  return '<input class="inp" id="'+id+'" type="'+(o.type||'text')+'"'+
    (o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.val!=null?' value="'+esc(o.val)+'"':'')+
    (o.step?' step="'+o.step+'"':'')+(o.min!=null?' min="'+o.min+'"':'')+(o.max!=null?' max="'+o.max+'"':'')+
    (o.inputmode?' inputmode="'+o.inputmode+'"':'')+(o.maxlength?' maxlength="'+o.maxlength+'"':'')+'>';}
function sel(id,opts,cur){
  return '<select class="inp" id="'+id+'">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+
    (String(o[0])===String(cur)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';}

/* ─── nuevo socio ───────────────────────────────────────── */
M.newmember=function(){
  modal({title:'Nuevo socio',sub:'Se identifica con su DNI; el PIN lo crea él la primera vez que entra',
    body:'<div class="grid" style="gap:14px">'+

      fld('nmDni','DNI o carné de extranjería',
          inp('nmDni',{ph:'8 dígitos · extranjero, su carné',inputmode:'numeric',maxlength:12}))+
      '<div class="grid g2" style="gap:14px">'+
        fld('nmSex','Sexo',sel('nmSex',[['F','Mujer'],['M','Hombre']],'F'))+
        fld('nmBorn','Fecha de nacimiento',inp('nmBorn',{type:'date'}))+'</div>'+
      '<div class="grid g2" style="gap:14px">'+
        fld('nmPhone','Teléfono',inp('nmPhone',{ph:'+51 9__ ___ ___'}))+
        fld('nmMail','Correo',inp('nmMail',{type:'email',ph:'nombre@correo.com'}))+'</div>'+
      '<div class="grid g2" style="gap:14px">'+
        fld('nmPlan','Plan',sel('nmPlan',Object.keys(DBX.PLANS).map(k=>[k,plan(k).n+' · '+planLbl(plan(k))+
          (plan(k).classes?' · '+plan(k).classes+' clases':' · ilimitado')]),'p3x1m'))+
        fld('nmMonths','Meses contratados',sel('nmMonths',[[1,'1 mes'],[3,'3 meses'],[6,'6 meses'],[12,'12 meses']],1))+'</div>'+
      '<div class="grid g2" style="gap:14px">'+
        fld('nmGoal','Objetivo que declara',inp('nmGoal',{ph:'Bajar grasa, ganar fuerza…'}))+
        fld('nmDir','Hacia dónde',sel('nmDir',[['perder','Bajar peso'],['mantener','Mantenerse'],['ganar','Ganar peso']],'perder'))+'</div>'+
    '</div>',
    foot:'<button class="btn btn-gh" data-close>Cancelar</button>'+
         '<button class="btn btn-pri" id="nmSave">Crear socio</button>',
    onMount(ov){
      ov.querySelector('[data-close]').onclick=closeModal;
      ov.querySelector('#nmSave').onclick=()=>{
        const name=$('#nmName',ov).value.trim();
        if(!name){toast('Escribe el nombre del socio','bad');$('#nmName',ov).focus();return;}
        const dni=$('#nmDni',ov).value.replace(/\D/g,'');
        if(dni.length<8||dni.length>12){
          toast('El DNI son 8 dígitos. Si es carné de extranjería, puede traer más y los ceros de delante cuentan.','bad');$('#nmDni',ov).focus();return;}
        if(Q.byCode(dni)){toast('Ya hay un socio con ese DNI','bad');$('#nmDni',ov).focus();return;}
        const m=A.createMember({name,dni,sex:$('#nmSex',ov).value,born:$('#nmBorn',ov).value,
          phone:$('#nmPhone',ov).value.trim(),email:$('#nmMail',ov).value.trim(),
          plan:$('#nmPlan',ov).value,months:+$('#nmMonths',ov).value,goal:$('#nmGoal',ov).value.trim(),
          dir:$('#nmDir',ov).value});
        closeModal();
        M.credentials(m);
        window.CFR.render();
      };
    }});
};

M.credentials=function(m){
  modal({title:'Socio creado',sub:'Ya puede entrar a la app desde su teléfono.',
    body:'<div class="card card-pad" style="text-align:center;background:var(--bg2)">'+

      '<div class="tiny dim" style="margin-top:3px">'+esc(plan(m.plan).n)+' · '+esc(C.venceTxt(m))+'</div>'+
      '<div class="hair" style="margin:19px 0"></div>'+
      '<div class="grid g2" style="gap:14px">'+
        '<div><p class="eyebrow">Su DNI</p><div class="qr-code" style="font-size:27px;margin-top:6px">'+esc(ident(m))+'</div></div>'+
        '<div><p class="eyebrow">PIN</p><div class="tiny dim" style="margin-top:10px;line-height:1.5">Lo elige él solo, '+
          'la primera vez que entre con su DNI.</div></div>'+
      '</div></div>'+
      '<p class="tiny dim" style="margin:15px 0 0;text-align:center">Nadie más puede crearle el PIN: lo pone él desde su teléfono.</p>',
    foot:'<button class="btn btn-gh" id="crCopy">Copiar datos</button>'+
         '<button class="btn btn-pri" data-close>Listo</button>',
    onMount(ov){
      ov.querySelector('[data-close]').onclick=closeModal;
      ov.querySelector('#crCopy').onclick=()=>copy(
        'CLUB FITNESS\nSocio: '+m.name+'\nEntra con su DNI: '+ident(m)+'\nPIN: lo crea al entrar la primera vez'+
        '\nPlan: '+plan(m.plan).n);
    }});
};

/* ─── ficha de socio ────────────────────────────────────── */
M.member=function(mid){
  const m=Q.member(mid); if(!m)return;
  const r=Q.risk(mid), lm=Q.lastMeas(mid), pl=Q.plan(mid);
  const att=DBX.db.bookings.filter(b=>b.m===mid&&b.st==='asistio');
  const last=Q.memberBookings(mid).slice(0,8);
  const dEnd=daysBetween(today(),m.planEnd);
  modal({wide:true,title:m.name,sub:identL(m)+' · socio desde el '+fmtDL(m.joined),
    body:'<div class="stack" style="gap:17px">'+
      '<div class="row" style="gap:14px"><div class="av lg">'+esc(initials(m.name))+'</div>'+
      '<div style="flex:1;min-width:140px"><div class="row" style="gap:7px;margin-bottom:6px">'+
        V.planPill(m)+V.riskPill(r)+'</div>'+
      '<div class="tiny mut">'+esc(m.phone||'Sin teléfono')+' · '+esc(m.email||'sin correo')+'</div>'+
      '<div class="tiny dim" style="margin-top:2px">'+esc(m.goal||'Sin objetivo declarado')+'</div></div></div>'+
      '<div class="grid g4" style="gap:10px">'+
        V.tile('Clases totales',att.length,'','','','check')+
        V.tile('Últimos 30 días',Q.attendedSince(mid,addD(-30)),'','','','bolt')+
        V.tile('Racha',Q.streak(mid),'días','','','fire')+
        V.tile('Peso',lm?lm.w.toFixed(1):'—','kg',lm?esc(rel(lm.date)):'sin medir','','scale')+
      '</div>'+
      (r.why?'<div class="card card-pad" style="background:'+(r.lvl>=3?'var(--badd)':'var(--warnd)')+
        ';border-color:'+(r.lvl>=3?'#5A2A2A':'#5A471C')+'"><div class="tiny" style="color:'+
        (r.lvl>=3?'#FFB0B0':'#F5D08A')+'"><b>Atención:</b> '+esc(r.why)+'</div></div>':'')+
      '<div><p class="eyebrow" style="margin-bottom:10px">Membresía</p>'+
      '<div class="card card-pad"><div class="row btw" style="gap:12px;flex-wrap:wrap">'+
        '<div><div style="font-size:15px;font-weight:800">'+esc(plan(m.plan).n)+' · '+PEN(plan(m.plan).price)+'/mes</div>'+
        '<div class="tiny dim" style="margin-top:2px">'+esc(
          !m.planEnd?'Falta anotar hasta cuándo pagó'
          : dEnd<0?'Venció hace '+(-dEnd)+' días · '+fmtDL(m.planEnd)
                  :'Vence en '+dEnd+' días · '+fmtDL(m.planEnd))+'</div></div>'+
        '<div class="row" style="gap:7px">'+
          '<button class="btn btn-gh btn-sm" data-mact="renew">Renovar</button>'+
          '<button class="btn btn-gh btn-sm" data-mact="freeze">'+(m.frozen?'Reactivar':'Congelar')+'</button>'+
        '</div></div></div></div>'+
      '<div><p class="eyebrow" style="margin-bottom:10px">Últimas reservas</p>'+
      (last.length?'<div class="tbl-wrap"><table style="min-width:0"><tbody>'+last.map(b=>{
        const c=Q.cls(b.c);
        return '<tr><td style="white-space:nowrap"><b class="tiny">'+esc(fmtD(b.date))+'</b>'+
          '<div class="tiny dim">'+(c?esc(h12(c.time)):'sin hora')+'</div></td>'+
          '<td><b class="tiny">'+(c?esc(c.name):'Entrenó')+'</b><div class="tiny dim">'+
            (c?esc(c.coach):'Registro de la planilla')+'</div></td>'+
          '<td class="r">'+(b.st==='asistio'?'<span class="pill p-ok">Asistió</span>':
            b.st==='falta'?'<span class="pill p-bad">Faltó</span>':
            b.st==='espera'?'<span class="pill p-warn">En espera</span>':
            b.st==='cancelada'?'<span class="pill p-n">Cancelada</span>':'<span class="pill p-ch">Reservada</span>')+'</td></tr>';
      }).join('')+'</tbody></table></div>':'<div class="card"><div class="empty"><p>Sin reservas todavía</p></div></div>')+'</div>'+
      (pl?'<div><p class="eyebrow" style="margin-bottom:10px">Plan nutricional</p>'+
        '<div class="card card-pad"><div style="font-size:14px;font-weight:700">'+esc(pl.title)+'</div>'+
        '<div class="tiny dim" style="margin-top:3px">'+pl.kcal+' kcal · '+pl.prot+' g proteína · por '+esc(pl.by)+'</div></div></div>':'')+
    '</div>',
    foot:'<button class="btn btn-gh" data-mact="edit">'+ic('user',14)+' Editar datos</button>'+
         '<button class="btn btn-gh" data-mact="wa">'+ic('wa',14)+' WhatsApp</button>'+
         '<button class="btn btn-gh" data-mact="pinreset">'+ic('back',14)+' Restablecer PIN</button>'+
         '<button class="btn btn-gh" data-mact="measure">'+ic('ruler',14)+' Nueva valoración</button>'+
         '<button class="btn btn-pri" data-close>Cerrar</button>',
    onMount(ov){
      ov.querySelector('[data-close]').onclick=closeModal;

        const a=b.getAttribute('data-mact');
        if(a==='renew'){closeModal();M.renew(mid);}
        if(a==='freeze'){const f=A.toggleFreeze(mid);closeModal();
          toast(f?'Membresía congelada':'Membresía reactivada','ok');window.CFR.render();}
        if(a==='wa'){closeModal();M.wa(mid);}
        if(a==='measure'){closeModal();M.measure(mid);}
        if(a==='pinreset'){closeModal();M.pinreset(mid);}
        if(a==='edit'){closeModal();M.editar(mid);}
      });
    }});
};

/* ─── ficha del socio (lo que abre la consulta) ────────────
   Todo lo que está registrado de ese cuerpo, con sus propias
   casillas: los 8 pliegues, los 6 perímetros y el historial. */
function edadDe(m){
  if(m.edad)return m.edad;
  if(!m.born)return null;
  const b=parseYmd(m.born),h=new Date();
  let a=h.getFullYear()-b.getFullYear();
  if(h.getMonth()<b.getMonth()||(h.getMonth()===b.getMonth()&&h.getDate()<b.getDate()))a--;
  return a;
}
M.paciente=function(mid){
  const m=Q.member(mid); if(!m)return;
  const hist=Q.meas(mid);
  const ed=edadDe(m);
  const sub=identL(m)+' · '+(ed?ed+' años':'edad sin registrar')+' · '+(m.sex==='F'?'Mujer':'Hombre');
  const pie='<button class="btn btn-gh" data-act="measure" data-m="'+mid+'">'+ic('ruler',14)+' Nueva valoración</button>'+
            '<button class="btn btn-pri" data-x>Cerrar</button>';

  if(!hist.length){
    modal({wide:true,title:m.name,sub,
      body:'<div class="empty"><div class="empty-ic">'+ic('scale',22)+'</div>'+
        '<h4>Sin ninguna valoración</h4><p>De esta persona no hay nada medido todavía. '+
        'En cuanto registres la primera toma, aquí aparecen su composición y su historial.</p></div>',
      foot:pie});
    return;
  }

  const f1=v=>(v==null||isNaN(v))?'—':(+v).toFixed(1);
  const lm=hist[hist.length-1], prev=hist.length>1?hist[hist.length-2]:null, first=hist[0];
  const imc=B.IMC(lm.w,lm.h), it=B.imcTag(imc), bt=B.bfTag(lm.bf,m.sex,ed);
  const ref=window.CFANT.nivelRef(m.sex,ed||30);
  const PL=[['pTri','Tríceps'],['pSub','Subescapular'],['pBic','Bíceps'],['pIli','Cresta ilíaca'],
            ['pSup','Supraespinal'],['pAbd','Abdominal'],['pMus','Muslo'],['pPie','Pierna']];
  const PE=[['cBra','Brazo relajado'],['cBraF','Brazo flexionado'],['cCin','Cintura'],
            ['cCad','Cadera'],['cMus','Muslo medio'],['cPie','Pantorrilla']];

  /* una casilla vacía no se pinta: la planilla no siempre trae todo */
  const celdas=(def,unid)=>def.map(k=>{
    const v=lm[k[0]], p=prev?prev[k[0]]:null;
    if(v==null)return '';
    return '<div class="bm"><div class="bm-k">'+esc(k[1])+'</div>'+
      '<div class="bm-v">'+f1(v)+'<em>'+unid+'</em></div>'+
      '<div class="bm-d fl">'+(p==null?'primera vez':B.delta(v,p,null,' '+unid))+'</div></div>';
  }).join('');
  const hay=def=>def.some(k=>lm[k[0]]!=null);

  let h='<div class="stack" style="gap:17px">';

  h+='<div class="row" style="gap:14px"><div class="av lg">'+esc(initials(m.name))+'</div>'+
    '<div style="flex:1;min-width:150px">'+
      '<div class="row" style="gap:7px;margin-bottom:6px">'+
        '<span class="pill p-'+(bt[1]==='up'?'ok':bt[1]==='dn'?'bad':'warn')+'">'+esc(bt[0])+'</span>'+
        V.planPill(m)+'</div>'+
      '<div class="tiny mut">'+esc(hist.length)+' valoración'+(hist.length===1?'':'es')+
        ' · la última, '+esc(rel(lm.date))+' ('+esc(fmtDL(lm.date))+')</div>'+
      '<div class="tiny dim" style="margin-top:2px">'+esc(m.goal||'Sin objetivo declarado')+
        (lm.by?' · midió '+esc(lm.by):'')+'</div></div></div>';

  h+='<div class="grid g4" style="gap:10px">'+
    V.tile('Peso',f1(lm.w),'kg',prev?B.weightDelta(m,lm.w,prev.w,' kg')+' desde la anterior':'primera toma','','scale')+
    V.tile('IMC',imc?imc.toFixed(1):'—','',it[0],it[1],'chart')+
    V.tile('Grasa corporal',f1(lm.bf),'%',f1(lm.fat)+' kg de grasa','','drop')+
    V.tile('Masa magra',f1(lm.lean),'kg',prev?B.delta(lm.lean,prev.lean,false,' kg')+' desde la anterior':'primera toma','','dumb')+
  '</div>';

  h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:5px">Cómo se clasifica</p>'+
    '<div class="tiny mut" style="line-height:1.6">Con sus cuatro pliegues (tríceps, bíceps, subescapular y cresta ilíaca) '+
    'por Durnin-Womersley y Siri. Para '+(m.sex==='F'?'una mujer':'un hombre')+' de '+(ed||30)+' años, su tabla marca '+
    '<b>bajo</b> por debajo de '+ref[0]+'%, <b>saludable</b> hasta '+ref[1]+'% y <b>sobrepeso</b> hasta '+ref[2]+'%.</div></div>';

  if(hay(PL)) h+='<div><div class="sec-h"><div><h3>Pliegues de la última toma</h3>'+
    '<p>'+esc(fmtDL(lm.date))+(prev?' · comparados con el '+esc(fmtDL(prev.date)):'')+'</p></div></div>'+
    '<div class="bmap">'+celdas(PL,'mm')+'</div></div>';

  if(hay(PE)) h+='<div><div class="sec-h"><div><h3>Perímetros</h3><p>En centímetros, de la misma toma</p></div></div>'+
    '<div class="bmap">'+celdas(PE,'cm')+'</div></div>';

  if(!hay(PL)&&!hay(PE)) h+='<div class="card card-pad"><div class="tiny mut" style="line-height:1.6">'+
    'De esta persona hay peso y composición, pero no están cargados sus pliegues ni sus perímetros. '+
    'Al registrar una valoración nueva quedan guardados y aparecen aquí.</div></div>';

  h+='<div><div class="sec-h"><div><h3>Historial</h3><p>Todas sus valoraciones, de la más reciente a la primera</p></div></div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th class="r">Peso</th><th class="r">IMC</th>'+
    '<th class="r">Grasa</th><th class="r">Kg grasa</th><th class="r">Masa magra</th><th>Clasificación</th>'+
    '</tr></thead><tbody>'+
    hist.slice().reverse().map(x=>{
      const i2=B.IMC(x.w,x.h), t2=B.bfTag(x.bf,m.sex,ed);
      return '<tr><td style="font-weight:600">'+esc(fmtD(x.date))+'</td>'+
        '<td class="r bold">'+f1(x.w)+'</td><td class="r mut">'+(i2?i2.toFixed(1):'—')+'</td>'+
        '<td class="r bold">'+f1(x.bf)+(x.bf==null?'':'%')+'</td>'+
        '<td class="r mut">'+f1(x.fat)+'</td><td class="r mut">'+f1(x.lean)+'</td>'+
        '<td class="tiny mut">'+esc(x.bf==null?'—':t2[0])+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';

  if(hist.length>1){
    h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:5px">Desde la primera toma</p>'+
      '<div class="tiny mut" style="line-height:1.7">'+
      'Peso '+B.weightDelta(m,lm.w,first.w,' kg')+' · grasa '+B.delta(lm.bf,first.bf,true,' %')+
      ' · masa magra '+B.delta(lm.lean,first.lean,false,' kg')+
      ' · cintura '+B.delta(lm.cCin,first.cCin,true,' cm')+
      '<span class="dim"> (entre el '+esc(fmtDL(first.date))+' y el '+esc(fmtDL(lm.date))+')</span></div></div>';
  }
  if(lm.note) h+='<div class="card card-pad"><p class="eyebrow" style="margin-bottom:5px">Nota de la última toma</p>'+
    '<div class="tiny mut" style="line-height:1.6">'+esc(lm.note)+'</div></div>';

  h+='</div>';
  modal({wide:true,title:m.name,sub,body:h,
    foot:'<button class="btn btn-gh" data-act="planedit" data-m="'+mid+'">'+ic('leaf',14)+
         (Q.plan(mid)?' Ver su plan':' Crear plan')+'</button>'+pie});
};

/* ─── editar la ficha de un socio ──────────────────────────
   Es el sitio donde el club llena lo que falta: el DNI sobre todo,
   que es con lo que el socio entra a la app. */
M.editar=function(mid){
  const m=Q.member(mid); if(!m)return;
  const planes=[['','Sin plan']].concat(Object.keys(DBX.PLANS).filter(k=>k!=='demo')
    .map(k=>[k, plan(k).n+(plan(k).classes?' · '+plan(k).classes+' clases':'')]));
  modal({wide:true,title:'Editar ficha',sub:m.name+' · '+identL(m),
    body:'<div class="grid" style="gap:14px">'+
      (m.dni?'':'<div class="card card-pad" style="border-color:#5A471C;background:var(--warnd)">'+
        '<div class="tiny" style="color:var(--warn);line-height:1.6"><b>Sin DNI no puede entrar a la app.</b> '+
        'Es el único dato con el que el socio inicia sesión: en cuanto lo escribas aquí, podrá entrar con la clave 0000 '+
        'y elegir su PIN.</div></div>')+
      fld('eeName','Nombre completo',inp('eeName',{val:m.name})) +
      '<div class="grid g2" style="gap:14px">'+
        fld('eeDni','DNI o carné',
            inp('eeDni',{val:m.dni||'',ph:'8 dígitos · extranjero, su carné',
                         inputmode:'numeric',maxlength:12}))+
        fld('eeTel','Teléfono',inp('eeTel',{val:m.phone||'',ph:'+51 9__ ___ ___'}))+'</div>'+
      '<div class="grid g2" style="gap:14px">'+
        fld('eeSex','Sexo',sel('eeSex',[['F','Mujer'],['M','Hombre']],m.sex||'F'))+
        fld('eeEdad','Edad',inp('eeEdad',{type:'number',val:m.edad!=null?m.edad:'',min:5,max:99}))+'</div>'+
      fld('eeMail','Correo',inp('eeMail',{type:'email',val:m.email||''}))+
      '<div class="hair"></div>'+
      '<div class="grid g2" style="gap:14px">'+
        fld('eePlan','Plan',sel('eePlan',planes,m.plan||''))+
        fld('eeAct','Estado',sel('eeAct',[['1','Activo'],['0','Inactivo']],m.active?'1':'0'))+'</div>'+
      /* Los planes de lista tienen su precio en el plan; los negociados, en
         la ficha de cada socio. El campo solo sale cuando hace falta. */
      '<div id="eePrecioCaja"'+(Q.planNegociado(m.plan)?'':' hidden')+'>'+
        fld('eePrecio','Cuánto paga este socio (S/.)',
            inp('eePrecio',{type:'number',min:0,step:'1',inputmode:'numeric',
                            val:m.precio==null?'':m.precio,ph:'lo acordado con él'}))+
        '<p class="tiny dim" style="margin:5px 0 0;line-height:1.5">Este plan no tiene precio de lista: '+
        'cada socio paga lo que se acordó. Lo que escribas aquí es lo que cuentan las estadísticas.</p>'+
      '</div>'+
      '<div class="grid g2" style="gap:14px">'+
        fld('eeAlta','Se dio de alta',inp('eeAlta',{type:'date',val:m.joined||''}))+
        fld('eeVence','Vence el (según la hoja)',
          inp('eeVence',{type:'date',val:m.venceHoja||m.planEnd||''}))+'</div>'+
      ((m.ciclo&&m.venceHoja&&m.ciclo.fin!==m.venceHoja)
        ? '<div class="tiny mut" style="margin:-6px 0 0;line-height:1.6">Su primera clase fue el '+
          esc(fmtDL(m.ciclo.arranque))+', así que contando desde ahí su mes cierra el <b>'+
          esc(fmtDL(m.ciclo.fin))+'</b>. La app usa esa fecha; aquí arriba está la de la hoja.</div>'
        : '')+
      fld('eeGoal','Objetivo que declara',inp('eeGoal',{val:m.goal||'',ph:'Bajar grasa, ganar fuerza…'}))+
      fld('eeObs','Observación del club',inp('eeObs',{val:m.obs||'',ph:'Paga con tarjeta, paga por 2…'}))+
      '<p class="login-err" id="eeErr" style="margin:0"></p>'+
    '</div>',
    foot:'<button class="btn btn-gh" data-x>Cancelar</button>'+
         '<button class="btn btn-pri" id="eeOk">Guardar</button>',
    onMount(ov){
      /* el campo del monto aparece y desaparece según el plan elegido */
      const caja=ov.querySelector('#eePrecioCaja');
      ov.querySelector('#eePlan').onchange=e=>{
        caja.hidden = !Q.planNegociado(e.target.value);
      };
      ov.querySelector('#eeOk').onclick=()=>{
        const g=id=>ov.querySelector('#'+id).value;
        const r=A.editMember(mid,{name:g('eeName'),dni:g('eeDni'),sex:g('eeSex'),
          edad:g('eeEdad'),phone:g('eeTel'),email:g('eeMail'),plan:g('eePlan')||null,
          precio:Q.planNegociado(g('eePlan'))?g('eePrecio'):'',
          joined:g('eeAlta'),planEnd:g('eeVence')||null,active:g('eeAct')==='1',
          goal:g('eeGoal'),obs:g('eeObs')});
        if(!r.ok){ov.querySelector('#eeErr').textContent=r.msg;return;}
        closeModal(); toast(r.msg,'ok');
        if(r.sinDni) setTimeout(()=>toast('Sigue sin DNI: todavía no puede entrar a la app','info'),800);
        window.CFR.render();
      };
    }});
};

/* el club devuelve a un socio a la clave de fábrica */
/* ─── el PIN de un socio, desde el club ────────────────────

   ponérselo ahí mismo si está en recepción y no puede entrar. */

  modal({title:'PIN de '+m.name.split(' ')[0],sub:m.name+' · '+identL(m),
    body:'<div class="grid" style="gap:15px">'+
      '<div class="card card-pad" style="background:var(--bg2)"><div class="row btw" style="gap:12px">'+
        '<span class="tiny mut">Ahora mismo</span>'+
        (tiene?'<span class="pill p-ok">'+ic('check',11)+' Tiene su propio PIN</span>'
              :'<span class="pill p-warn">Sigue en 0000</span>')+
      '</div></div>'+

      '<div><p class="eyebrow" style="margin-bottom:9px">Lo normal</p>'+
      '<div class="card card-pad"><div class="tiny mut" style="line-height:1.65;margin-bottom:11px">'+
        'Su clave vuelve a <b>0000</b> y la app le pedirá elegir un PIN nuevo la próxima vez que entre. '+
        'Así nadie del club llega a saber su clave.</div>'+
        '<button class="btn btn-gh" id="prCero" style="width:100%">'+ic('back',14)+' Volver a 0000</button>'+
      '</div></div>'+

      '<div><p class="eyebrow" style="margin-bottom:9px">Si está en recepción</p>'+
      '<div class="card card-pad">'+
        '<div class="tiny mut" style="line-height:1.65;margin-bottom:11px">'+
          'Ponle tú el PIN y dícelo. Dile que lo cambie él después desde «Mi cuenta».</div>'+
        '<div class="row" style="gap:9px;align-items:flex-end">'+
          '<div style="flex:1">'+inp('prPin',{val:'',ph:'4 números',inputmode:'numeric',maxlength:4})+'</div>'+
          '<button class="btn btn-pri" id="prPoner" style="flex:none">Ponerlo</button>'+
        '</div>'+
      '</div></div>'+
      '<p class="login-err" id="prErr" style="margin:0"></p>'+
    '</div>',
    foot:'<button class="btn btn-gh" data-x>Cerrar</button>',
    onMount(ov){
      ov.querySelector('#prCero').onclick=()=>{
        const r=A.resetPin(mid);closeModal();toast(r.msg,r.ok?'ok':'bad');
