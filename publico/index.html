M.renew=function(mid){
  const m=Q.member(mid);
  modal({title:'Renovar membresía',sub:m.name+' · '+plan(m.plan).n,
    body:'<div class="grid" style="gap:14px">'+
      fld('rnPlan','Plan',sel('rnPlan',Object.keys(DBX.PLANS).map(k=>[k,plan(k).n+' · '+planLbl(plan(k))]),m.plan))+
      fld('rnM','Meses',sel('rnM',[[1,'1 mes'],[3,'3 meses · 5% dto.'],[6,'6 meses · 10% dto.'],[12,'12 meses · 15% dto.']],1))+
      '<div class="card card-pad" style="background:var(--bg2)"><div class="row btw">'+
        '<span class="tiny mut">Total a cobrar</span>'+
        '<span id="rnTot" style="font-size:19px;font-weight:800;letter-spacing:-.025em">—</span></div></div>'+
    '</div>',
    foot:'<button class="btn btn-gh" data-close>Cancelar</button>'+
         '<button class="btn btn-pri" id="rnGo">Confirmar cobro</button>',
    onMount(ov){
      const calc=()=>{
        const p=plan($('#rnPlan',ov).value).price, n=+$('#rnM',ov).value;
        const d={1:0,3:.05,6:.10,12:.15}[n]||0;
        $('#rnTot',ov).textContent=PEN(Math.round(p*n*(1-d)));
      };
      $('#rnPlan',ov).onchange=calc;$('#rnM',ov).onchange=calc;calc();
      ov.querySelector('[data-close]').onclick=closeModal;
      ov.querySelector('#rnGo').onclick=()=>{
        m.plan=$('#rnPlan',ov).value;
        const end=A.renew(mid,+$('#rnM',ov).value,m.plan);
        closeModal();toast('Renovada hasta el '+fmtDL(end),'ok');window.CFR.render();
      };
    }});
};

/* ─── WhatsApp ──────────────────────────────────────────── */
M.wa=function(mid){
  const m=Q.member(mid), r=Q.risk(mid), lv=Q.lastVisit(mid);
  const first=m.name.split(' ')[0];
  let msg;
  if(!lv) msg='Hola '+first+', soy Marco del CLUB FITNESS. Ya tienes tu cuenta lista: entra a la app con tu DNI'+
    ', crea tu PIN y reserva tu primera clase. Si quieres, te acompaño en la primera sesión y te enseño las máquinas. ¿Qué día te viene bien?';
  else if(r.lvl>=3) msg='Hola '+first+', soy Marco del CLUB FITNESS. Te extrañamos: han pasado '+(r.gap||'varios')+
    ' días desde tu última clase. ¿Te guardo sitio para esta semana? Si algo cambió en tus horarios, lo acomodamos.';
  else if(r.lvl===2) msg='Hola '+first+', ¿todo bien? Vi que esta semana entrenaste menos de lo habitual. '+
    'Tengo cupo a las 18:00 con Rubén y a las 19:00 con Camila. ¿Te reservo alguno?';
  else if(daysBetween(today(),m.planEnd)<=5) msg='Hola '+first+', tu plan '+plan(m.plan).n+
    ' vence el '+fmtDL(m.planEnd)+'. Si renuevas antes del vencimiento mantienes tu precio actual. ¿Te lo dejo listo?';
  else msg='Hola '+first+', soy Marco del CLUB FITNESS. ¿Cómo vas con los entrenamientos? Cualquier cosa que necesites, aquí estoy.';

  /* wa.me no perdona ni un espacio, y sin número abre WhatsApp sin
     destinatario, que es peor que no ofrecer el botón. */
  const num=String(m.phone||'').replace(/[^0-9]/g,'');
  const waUrl=num?('https://wa.me/'+num+'?text='+encodeURIComponent(msg)):null;
  modal({title:'Mensaje para '+m.name,sub:(m.phone||'Sin teléfono registrado')+' · '+(r.why||'Seguimiento'),
    body:'<div class="grid" style="gap:14px">'+
      fld('waMsg','Mensaje sugerido','<textarea class="inp" id="waMsg" rows="6">'+esc(msg)+'</textarea>')+
      '<div class="card card-pad" style="background:var(--bg2)">'+
      '<p class="eyebrow" style="margin-bottom:8px">Contexto</p>'+
      '<div class="tiny mut" style="line-height:1.6">'+
        'Última visita: <b>'+(lv?esc(rel(lv)):'nunca')+'</b> · '+
        'Clases últimos 14 días: <b>'+(r.r14||0)+'</b> · '+
        'Membresía: <b>'+esc(C.venceTxt(m))+'</b>'+
      '</div></div></div>',
    foot:'<button class="btn btn-gh" id="waCopy">Copiar mensaje</button>'+
         (waUrl
           ? '<a class="btn btn-pri" href="'+esc(waUrl)+'" target="_blank" rel="noopener">'+ic('wa',14)+' Abrir WhatsApp</a>'
           : '<button class="btn btn-pri" data-act="editsoc" data-m="'+esc(m.id)+'">Anotar su celular</button>'),
    onMount(ov){
      ov.querySelector('#waCopy').onclick=()=>copy($('#waMsg',ov).value);
    }});
};

/* ─── valoración (nutri / admin) ────────────────────────── */
M.measure=function(mid){
  const list=DBX.db.members;
  mid=mid||(list[0]&&list[0].id);
  const prev=Q.lastMeas(mid);
  /* el valor de la última vez: primero como lo manda el club (cCin, cCad…),
     y si no, como lo guardaba la app vieja (waist, hip…) */
  const ant=(a,b)=>{
    if(prev && prev[a]!=null) return prev[a];
    if(prev && b && prev[b]!=null) return prev[b];
    return '';
  };
  modal({wide:true,title:'Nueva valoración',sub:'Los datos aparecen al instante en la app del socio',
    body:'<div class="grid" style="gap:15px">'+
      '<div class="grid g2" style="gap:14px">'+
        fld('mvM','Socio',sel('mvM',list.map(x=>[x.id,x.name+' · '+ident(x)]),mid))+
        fld('mvD','Fecha',inp('mvD',{type:'date',val:today()}))+'</div>'+
      '<div><p class="eyebrow" style="margin-bottom:10px">Talla y peso</p>'+
      '<div class="grid g2" style="gap:11px">'+
        fld('mvH','Talla (cm)',inp('mvH',{type:'number',step:'0.5',val:prev?prev.h:''}))+
        fld('mvW','Peso (kg)',inp('mvW',{type:'number',step:'0.1',val:prev?prev.w:''}))+
      '</div></div>'+
      '<div><p class="eyebrow" style="margin-bottom:4px">Pliegues cutáneos (mm)</p>'+
      '<p class="tiny dim" style="margin:0 0 10px;line-height:1.5">Los cuatro de '+
      '<b>Durnin &amp; Womersley</b>. Con ellos la app saca la densidad y el % de grasa sola, '+
      'igual que la hoja de cálculo: no hay que escribirlos a mano.</p>'+
      '<div class="grid g4" style="gap:11px">'+
        fld('mvPT','Tríceps',      inp('mvPT',{type:'number',step:'0.5',min:1,max:80,val:prev&&prev.pTri!=null?prev.pTri:'',ph:'mm'}))+
        fld('mvPB','Bíceps',       inp('mvPB',{type:'number',step:'0.5',min:1,max:80,val:prev&&prev.pBic!=null?prev.pBic:'',ph:'mm'}))+
        fld('mvPS','Subescapular', inp('mvPS',{type:'number',step:'0.5',min:1,max:80,val:prev&&prev.pSub!=null?prev.pSub:'',ph:'mm'}))+
        fld('mvPI','Cresta ilíaca',inp('mvPI',{type:'number',step:'0.5',min:1,max:80,val:prev&&prev.pIli!=null?prev.pIli:'',ph:'mm'}))+
      '</div>'+
      '<div class="card card-pad" id="mvDW" style="background:var(--bg2);margin-top:12px"></div>'+
      '<div id="mvManual" style="margin-top:11px"></div>'+
      '</div>'+
      '<div><p class="eyebrow" style="margin-bottom:4px">Perímetros (cm) · opcional</p>'+
      '<p class="tiny dim" style="margin:0 0 10px;line-height:1.5">Los mismos que toma la '+
      'consulta en su cuaderno. El pecho salió: no se usaba para nada.</p>'+
      '<div class="grid g4" style="gap:11px">'+
        fld('mvWa','Cintura',inp('mvWa',{type:'number',step:'0.1',val:ant('cCin','waist')}))+
        fld('mvHi','Cadera',inp('mvHi',{type:'number',step:'0.1',val:ant('cCad','hip')}))+
        fld('mvAr','Brazo relajado',inp('mvAr',{type:'number',step:'0.1',val:ant('cBra','arm')}))+
        fld('mvArF','Brazo flexionado',inp('mvArF',{type:'number',step:'0.1',val:ant('cBraF','armF')}))+
      '</div><div class="grid g4" style="gap:11px;margin-top:11px">'+
        fld('mvTh','Muslo medio',inp('mvTh',{type:'number',step:'0.1',val:ant('cMus','thigh')}))+
        fld('mvCa','Pierna',inp('mvCa',{type:'number',step:'0.1',val:ant('cPie','calf')}))+
      '</div></div>'+
      '<div class="card card-pad" id="mvCalc" style="background:var(--bg2)"></div>'+
      fld('mvN','Nota para el socio','<textarea class="inp" id="mvN" rows="3" placeholder="Qué ves y qué toca ajustar"></textarea>')+
    '</div>',
    foot:'<button class="btn btn-gh" data-close>Cancelar</button>'+
         '<button class="btn btn-pri" id="mvSave">Guardar valoración</button>',
    onMount(ov){
      /* ── los pliegues: densidad y % de grasa, en vivo ── */
      const updDW=()=>{
        const m=Q.member($('#mvM',ov).value)||{};
        const val=s2=>{const v=$(s2,ov).value; return v===''?null:+v;};
        const c=Q.composicion(m.sex,m.edad,val('#mvPT'),val('#mvPB'),val('#mvPS'),val('#mvPI'));
        const t=Q.tramoTexto(m.sex,m.edad);
        const caja=$('#mvDW',ov), man=$('#mvManual',ov);
        if(!c){
          caja.innerHTML='<p class="tiny dim" style="margin:0;line-height:1.55">Escribe los cuatro pliegues '+
            'y aquí sale la densidad y el % de grasa. <b>'+esc(t)+'</b> — el tramo sale de la ficha del socio, '+
            'así que si le falta la edad o el sexo, corrígelos en Socios antes de medir.</p>';
          man.innerHTML='<div class="grid g2" style="gap:11px">'+
            fld('mvBF','Grasa (%) a mano',inp('mvBF',{type:'number',step:'0.1',val:prev?prev.bf:''}))+
            fld('mvMM','Músculo (kg)',inp('mvMM',{type:'number',step:'0.1',val:prev?prev.mm:''}))+
            '</div><p class="tiny dim" style="margin:6px 0 0">Solo si mides con balanza o con otra fórmula.</p>';
          return;
        }
        const w=+$('#mvW',ov).value;
        const kg = w ? +(w*c.grasa/100).toFixed(1) : null;
        const magra = (w&&kg!=null) ? +(w-kg).toFixed(1) : null;
        const n=window.CFANT.nivelGrasa(c.grasa,m.sex,m.edad||30);
        const niv=n?n.n:'';
        caja.innerHTML='<p class="eyebrow" style="margin-bottom:12px">Durnin &amp; Womersley · '+esc(t)+'</p>'+
          '<div class="grid g4" style="gap:12px">'+
          [['Suma de pliegues',c.suma+' mm','tríceps + bíceps + subescapular + cresta'],
           ['Densidad',c.densidad.toFixed(6),'C '+c.C+' · M '+c.M],
           ['Grasa corporal',c.grasa.toFixed(2)+' %',niv||'Siri (1961)'],
           ['En kilos',(kg!=null?kg+' kg de grasa':'—'),(magra!=null?magra+' kg de masa magra':'falta el peso')]]
          .map(x=>'<div><div class="bm-k">'+esc(x[0])+'</div><div style="font-size:17px;font-weight:800;'+
            'letter-spacing:-.03em;margin-top:3px">'+esc(x[1])+'</div><div class="tiny dim">'+esc(x[2])+'</div></div>').join('')+
          '</div>';
        man.innerHTML='';
      };

      const upd=()=>{
        const w=+$('#mvW',ov).value, h=+$('#mvH',ov).value, id=$('#mvM',ov).value;
        const m=Q.member(id);
        const box=$('#mvCalc',ov);
        updDW();
        if(!w||!h){box.innerHTML='<p class="tiny dim">Escribe talla y peso para ver IMC y requerimientos.</p>';return;}
        const imc=B.IMC(w,h), t=B.imcTag(imc);
        const r=N.macros(m.sex||'F',w,h,N.edadM(m)||30,Math.round(Q.attendedSince(id,addD(-28))/4)||3,'deficit');
        box.innerHTML='<p class="eyebrow" style="margin-bottom:12px">Cálculo automático</p>'+
          '<div class="grid g4" style="gap:12px">'+
          [['IMC',imc.toFixed(1),t[0]],['Gasto diario',r.tdee+' kcal','estimado'],
           ['Objetivo déficit',r.kcal+' kcal','-20%'],['Proteína',r.prot+' g','2,0 g/kg']]
          .map(x=>'<div><div class="bm-k">'+esc(x[0])+'</div><div style="font-size:17px;font-weight:800;'+
            'letter-spacing:-.03em;margin-top:3px">'+esc(x[1])+'</div><div class="tiny dim">'+esc(x[2])+'</div></div>').join('')+
          '</div>';
      };
      ['#mvW','#mvH','#mvM','#mvPT','#mvPB','#mvPS','#mvPI']
        .forEach(s2=>{const e=$(s2,ov); if(e){e.oninput=upd;e.onchange=upd;}});
      upd();
      ov.querySelector('[data-close]').onclick=closeModal;
      ov.querySelector('#mvSave').onclick=()=>{
        /* los campos del % a mano desaparecen cuando hay pliegues */
        const g=s2=>{const e=$(s2,ov); if(!e)return null;
                     const v=e.value; return v===''?null:+v;};
        const w=g('#mvW'),h=g('#mvH');
        if(!w||!h){toast('Talla y peso son obligatorios','bad');return;}
        const id=$('#mvM',ov).value;
        const m2=Q.member(id)||{};
        const c=Q.composicion(m2.sex,m2.edad,g('#mvPT'),g('#mvPB'),g('#mvPS'),g('#mvPI'));
        /* con los pliegues manda la fórmula; si no los hay, vale el % a mano */
        const bf = c ? c.grasa : (g('#mvBF')||0);
        A.saveMeas({m:id,date:$('#mvD',ov).value||today(),h,w,bf,mm:g('#mvMM')||0,
          pTri:g('#mvPT'),pBic:g('#mvPB'),pSub:g('#mvPS'),pIli:g('#mvPI'),
          fat: (c&&w)?+(w*c.grasa/100).toFixed(2):null,
          lean:(c&&w)?+(w-w*c.grasa/100).toFixed(2):null,
          /* el club los guarda como c_cin, c_cad, c_bra, c_bra_f, c_mus y c_pie */
          waist:g('#mvWa'),hip:g('#mvHi'),arm:g('#mvAr'),armF:g('#mvArF'),
          thigh:g('#mvTh'),calf:g('#mvCa'),
          by:(window.CFS.user&&window.CFS.user.name)||'Equipo CLUB FITNESS',note:$('#mvN',ov).value.trim()});
        closeModal();toast('Valoración guardada','ok');window.CFR.render();
      };
    }});
};

function copy(txt){
  try{
    navigator.clipboard.writeText(txt).then(()=>toast('Copiado al portapapeles','ok'),
      ()=>toast('No se pudo copiar. Selecciona el texto a mano.','bad'));
  }catch(e){toast('No se pudo copiar. Selecciona el texto a mano.','bad');}
}
M.copy=copy;M.fld=fld;M.inp=inp;M.sel=sel;
})();
</script>
<script>
(function(){
'use strict';
const C=window.CF,DBX=window.CFDB,Q=window.CFQ,A=window.CFA,S=window.CFS,V=window.CFV;
const N=window.CFNUT,toast=window.CFT,{modal,closeModal}=window.CFM,M=window.CFMOD;
const {ic,$,$$,esc,clamp,uid,PEN,ymd,parseYmd,addDays,daysBetween,fmtDL,today,initials}=C;
const addD=n=>ymd(addDays(new Date(),n));
const fld=M.fld,inp=M.inp,sel=M.sel;

/* ─── editor de plan nutricional ────────────────────────── */
M.planedit=function(mid){
  const list=DBX.db.members;
  mid=mid||(list[0]&&list[0].id);
  const ex=Q.plan(mid);
  /* copia de trabajo: nada se guarda hasta pulsar Guardar */
  const P = ex ? JSON.parse(JSON.stringify(ex)) : {
    id:uid('np'),m:mid,title:'',obj:'',kcal:2000,prot:140,carb:200,fat:60,water:2500,
    start:today(),end:addD(42),by:(S.user&&S.user.name)||'Nutricionista',note:'',
    days:[{d:'Todos los días',dows:[1,2,3,4,5,6,0],meals:[{n:'Desayuno',t:'07:00',items:[{f:'',q:'',k:0}]}]}]
  };
  let dayIdx=0;

  modal({wide:true,title:ex?'Editar plan nutricional':'Nuevo plan nutricional',
    sub:'El socio lo ve en su app en cuanto guardas',
    body:'<div class="stack" style="gap:17px">'+
      '<div class="grid g2" style="gap:14px">'+
        fld('peM','Socio',sel('peM',list.map(x=>[x.id,x.name+' · '+ident(x)]),P.m))+
        fld('peT','Título del plan',inp('peT',{ph:'Déficit moderado · Fase 2',val:P.title}))+'</div>'+
      fld('peO','Objetivo',inp('peO',{ph:'Reducir grasa manteniendo masa muscular',val:P.obj}))+
      '<div><div class="row btw" style="margin-bottom:11px"><p class="eyebrow">Objetivos diarios</p>'+
        '<button class="btn btn-gh btn-xs" id="peCalc">'+ic('bolt',12)+' Calcular desde su última valoración</button></div>'+
        '<div class="grid g4" style="gap:11px">'+
          fld('peK','Calorías',inp('peK',{type:'number',val:P.kcal}))+
          fld('peP','Proteína (g)',inp('peP',{type:'number',val:P.prot}))+
          fld('peC','Carbohidratos (g)',inp('peC',{type:'number',val:P.carb}))+
          fld('peF','Grasas (g)',inp('peF',{type:'number',val:P.fat}))+
        '</div>'+
        '<div class="grid g3" style="gap:11px;margin-top:11px">'+
          fld('peW','Agua (ml)',inp('peW',{type:'number',step:'100',val:P.water}))+
          fld('peS','Desde',inp('peS',{type:'date',val:P.start}))+
          fld('peE','Hasta',inp('peE',{type:'date',val:P.end}))+
        '</div>'+
        '<p class="tiny dim" id="peChk" style="margin:10px 0 0"></p></div>'+
      '<div><div class="row btw" style="margin-bottom:11px"><p class="eyebrow">Comidas por grupo de días</p>'+
        '<div class="row" style="gap:6px"><div class="seg scroll-x" id="peTabs"></div>'+
        '<button class="btn btn-gh btn-xs" id="peAddDay">'+ic('plus',12)+' Grupo</button></div></div>'+
        '<div id="peDay"></div></div>'+
      fld('peN','Indicaciones para el socio','<textarea class="inp" id="peN" rows="3" placeholder="Cómo repartir las comidas, qué pesar, qué evitar">'+esc(P.note)+'</textarea>')+
    '</div>',
    foot:'<button class="btn btn-gh" data-close>Cancelar</button>'+
         (ex?'<button class="btn btn-dg" id="peDel">Eliminar plan</button>':'')+
         '<button class="btn btn-pri" id="peSave">Guardar y publicar</button>',
    onMount(ov){
      const q=s=>$(s,ov);
      function macroCheck(){
        const k=+q('#peK').value,p=+q('#peP').value,c=+q('#peC').value,f=+q('#peF').value;
        const sum=p*4+c*4+f*9, d=sum-k;
        q('#peChk').innerHTML = Math.abs(d)<=60
          ? '<span style="color:var(--ok)">Los macros cuadran con las calorías ('+sum+' kcal).</span>'
          : '<span style="color:var(--warn)">Los macros suman '+sum+' kcal, '+(d>0?'+':'')+d+' respecto al objetivo. Ajusta antes de publicar.</span>';
      }
      ['#peK','#peP','#peC','#peF'].forEach(s=>q(s).oninput=macroCheck);
      macroCheck();

      q('#peCalc').onclick=()=>{
        const id=q('#peM').value, m=Q.member(id), lm=Q.lastMeas(id);
        if(!lm){toast('Ese socio no tiene valoración todavía','bad');return;}
        const r=N.macros(m.sex||'F',lm.w,lm.h,N.edadM(m)||30,Math.round(Q.attendedSince(id,addD(-28))/4)||3,'deficit');
        q('#peK').value=r.kcal;q('#peP').value=r.prot;q('#peC').value=r.carb;
        q('#peF').value=r.fat;q('#peW').value=r.water;
        macroCheck();toast('Calculado con su peso de '+lm.w.toFixed(1)+' kg','ok');
      };

      function tabs(){
        q('#peTabs').innerHTML=P.days.map((d,i)=>'<button class="'+(i===dayIdx?'on':'')+
          '" data-pd="'+i+'">'+esc(d.d)+'</button>').join('');
        q('#peTabs').querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{dayIdx=+b.getAttribute('data-pd');tabs();day();});
      }
      function day(){
        const d=P.days[dayIdx];
        if(!d){q('#peDay').innerHTML='';return;}
        const usados={};
        P.days.forEach((g,gi)=>{if(gi!==dayIdx)(g.dows||[]).forEach(x=>usados[x]=g.d);});
        q('#peDay').innerHTML=
          '<div style="margin-bottom:13px">'+
            '<p class="eyebrow" style="margin-bottom:9px">Días a los que aplica esta pauta</p>'+
            '<div class="row" style="gap:6px;margin-bottom:10px">'+[1,2,3,4,5,6,0].map(dw=>
              '<button class="btn '+((d.dows||[]).indexOf(dw)>=0?'btn-pri':'btn-gh')+' btn-sm" data-pdow="'+dw+'"'+
              ' style="min-width:52px"'+(usados[dw]!=null?' title="Ya lo cubre: '+esc(usados[dw])+'"':'')+'>'+
              C.DOW[dw]+(usados[dw]!=null?' <span style="opacity:.5">•</span>':'')+'</button>').join('')+'</div>'+
            '<div class="row" style="gap:9px">'+
              '<button class="btn btn-gh btn-sm" id="peAddMeal">'+ic('plus',13)+' Comida</button>'+
              (P.days.length>1?'<button class="btn btn-dg btn-sm" id="peDelDay">Quitar grupo</button>':'')+
              '<span class="tiny dim" id="peDowWarn" style="flex:1;min-width:0"></span>'+
            '</div>'+
          '</div>'+
          '<div class="grid" style="gap:10px">'+d.meals.map((me,mi)=>
            '<div class="meal"><div class="meal-h" style="gap:9px">'+
              '<input class="inp" data-mt="'+mi+'" value="'+esc(me.t)+'" style="width:84px;padding:7px 9px;font-size:13px">'+
              '<input class="inp" data-mn="'+mi+'" value="'+esc(me.n)+'" placeholder="Desayuno" style="flex:1;min-width:110px;padding:7px 9px;font-size:13px">'+
              '<span class="meal-k">'+me.items.reduce((a,x)=>a+(+x.k||0),0)+' kcal</span>'+
              '<button class="x" data-dm="'+mi+'" aria-label="Quitar comida">'+ic('x',14)+'</button>'+
            '</div><div class="meal-b">'+me.items.map((it,ii)=>
              '<div class="food" style="gap:8px;padding:8px 13px">'+
                '<input class="inp" data-f="'+mi+','+ii+'" value="'+esc(it.f)+'" placeholder="Alimento" style="flex:1;min-width:0;padding:7px 9px;font-size:13px">'+
                '<input class="inp" data-q="'+mi+','+ii+'" value="'+esc(it.q)+'" placeholder="150 g" style="width:86px;padding:7px 9px;font-size:13px">'+
                '<input class="inp" data-k="'+mi+','+ii+'" value="'+esc(it.k)+'" type="number" placeholder="kcal" style="width:76px;padding:7px 9px;font-size:13px">'+
                '<button class="x" data-df="'+mi+','+ii+'" aria-label="Quitar alimento">'+ic('x',13)+'</button>'+
              '</div>').join('')+
              '<div style="padding:8px 13px"><button class="btn btn-gh btn-xs" data-af="'+mi+'">'+ic('plus',12)+' Alimento</button></div>'+
            '</div></div>').join('')+'</div>';

        function dowWarn(){
          const cubre={};
          P.days.forEach(g=>(g.dows||[]).forEach(x=>cubre[x]=1));
          const faltan=[1,2,3,4,5,6,0].filter(x=>!cubre[x]);
          const w=q('#peDowWarn');
          if(!w)return;
          w.innerHTML = faltan.length
            ? '<span style="color:var(--warn)">Sin pauta: '+faltan.map(x=>C.DOW[x]).join(', ')+'</span>'
            : '<span style="color:var(--ok)">La semana está cubierta</span>';
        }
        dowWarn();
        $$('[data-pdow]',ov).forEach(b=>b.onclick=()=>{
          const dw=+b.getAttribute('data-pdow');
          d.dows=d.dows||[];
          const i=d.dows.indexOf(dw);
          if(i>=0)d.dows.splice(i,1);
          else{
            /* un día solo puede estar en un grupo */
            P.days.forEach((g,gi)=>{if(gi!==dayIdx&&g.dows){const j=g.dows.indexOf(dw);if(j>=0)g.dows.splice(j,1);}});
            d.dows.push(dw);
          }
          d.d=window.CFV.dowLabel(d.dows);
          P.days.forEach(g=>{if(g.dows)g.d=window.CFV.dowLabel(g.dows);});
          tabs();day();
        });
        q('#peAddMeal').onclick=()=>{d.meals.push({n:'',t:'12:00',items:[{f:'',q:'',k:0}]});day();};
        const dd=q('#peDelDay');
        if(dd)dd.onclick=()=>{P.days.splice(dayIdx,1);dayIdx=0;tabs();day();};
        $$('[data-mt]',ov).forEach(e=>e.oninput=()=>{d.meals[+e.getAttribute('data-mt')].t=e.value;});
        $$('[data-mn]',ov).forEach(e=>e.oninput=()=>{d.meals[+e.getAttribute('data-mn')].n=e.value;});
        $$('[data-dm]',ov).forEach(e=>e.onclick=()=>{d.meals.splice(+e.getAttribute('data-dm'),1);day();});
        $$('[data-af]',ov).forEach(e=>e.onclick=()=>{d.meals[+e.getAttribute('data-af')].items.push({f:'',q:'',k:0});day();});
        const pair=a=>a.split(',').map(Number);
        $$('[data-f]',ov).forEach(e=>e.oninput=()=>{const[a,b]=pair(e.getAttribute('data-f'));d.meals[a].items[b].f=e.value;});
        $$('[data-q]',ov).forEach(e=>e.oninput=()=>{const[a,b]=pair(e.getAttribute('data-q'));d.meals[a].items[b].q=e.value;});
        $$('[data-k]',ov).forEach(e=>e.oninput=()=>{const[a,b]=pair(e.getAttribute('data-k'));d.meals[a].items[b].k=+e.value||0;});
        $$('[data-df]',ov).forEach(e=>e.onclick=()=>{const[a,b]=pair(e.getAttribute('data-df'));d.meals[a].items.splice(b,1);day();});
      }
      q('#peAddDay').onclick=()=>{P.days.push({d:'Sin días asignados',dows:[],meals:[{n:'',t:'08:00',items:[{f:'',q:'',k:0}]}]});
        dayIdx=P.days.length-1;tabs();day();};
      tabs();day();

      ov.querySelector('[data-close]').onclick=closeModal;
      const del=q('#peDel');
      if(del)del.onclick=()=>{
        const i=DBX.db.nutri.findIndex(x=>x.id===P.id);
        if(i>=0)DBX.db.nutri.splice(i,1);
        DBX.save();closeModal();
        if(/^[0-9a-f]{8}-/i.test(String(P.id)))
          window.CFNET.empujar('cf_borrar_dieta',{p_id:P.id},r=>toast(r.msg,'ok'));
        else toast('Plan eliminado','ok');
        window.CFR.render();
      };
      q('#peSave').onclick=()=>{
        P.m=q('#peM').value;P.title=q('#peT').value.trim();P.obj=q('#peO').value.trim();
        P.kcal=+q('#peK').value||0;P.prot=+q('#peP').value||0;P.carb=+q('#peC').value||0;
        P.fat=+q('#peF').value||0;P.water=+q('#peW').value||2000;
        P.start=q('#peS').value||today();P.end=q('#peE').value||addD(42);P.note=q('#peN').value.trim();
        P.by=(S.user&&S.user.name)||'Nutricionista';
        if(!P.title){toast('Ponle un título al plan','bad');q('#peT').focus();return;}
        P.days=P.days.map(d=>({d:window.CFV.dowLabel(d.dows||[]),dows:(d.dows||[]).slice(),
          meals:d.meals.filter(me=>me.items.some(i=>i.f.trim()))
            .map(me=>({n:me.n||'Comida',t:me.t||'00:00',items:me.items.filter(i=>i.f.trim())}))}))
          .filter(d=>d.meals.length&&d.dows.length);
        if(!P.days.length){toast('Marca los días de cada grupo y añade al menos un alimento','bad');return;}
        A.savePlan(P);closeModal();toast('Plan publicado para '+Q.member(P.m).name.split(' ')[0],'ok');
        window.CFR.render();
      };
    }});
};

/* ─── editor de un plan del club ────────────────────────── */
M.tarifa=function(clave){
  const P=DBX.PLANS, ex=clave?P[clave]:null;
  const p = ex ? Object.assign({},ex) : {n:'',price:null,classes:null,porSem:3,meses:1,desc:'',activo:true};
  const cuantos = clave ? DBX.db.members.filter(m=>m.plan===clave&&m.active!==false).length : 0;

  /* el código es interno y no se toca una vez creado: es lo que guarda
     la ficha de cada socio */
  const codigo = c => 'p'+(c.porSem||3)+'x'+(c.meses||1)+'m';

  modal({title:ex?'Editar plan':'Nuevo plan',
    sub:ex?'Lo que cambies se ve al momento en las fichas y en las estadísticas'
          :'Lo que el club vende: duración, cuántas veces por semana y precio',
    body:'<div class="grid" style="gap:15px">'+
      fld('tfN','Nombre del plan',inp('tfN',{val:p.n,ph:'Mensual 3x',maxlength:40}))+
      '<div class="grid g3" style="gap:11px">'+
        fld('tfM','Duración',sel('tfM',[[1,'1 mes'],[2,'2 meses'],[3,'3 meses'],[4,'4 meses'],
            [6,'6 meses'],[12,'12 meses']],p.meses||1))+
        fld('tfS','Veces por semana',inp('tfS',{type:'number',min:1,max:7,val:p.porSem==null?'':p.porSem}))+
        fld('tfC','Sesiones en total',inp('tfC',{type:'number',min:1,max:400,val:p.classes==null?'':p.classes}))+
      '</div>'+
      fld('tfP','Precio en soles',inp('tfP',{type:'number',min:0,step:'1',inputmode:'numeric',
          val:p.price==null?'':p.price,ph:'499'}))+
      fld('tfD','Descripción corta',inp('tfD',{val:p.desc||'',maxlength:110,
          ph:'Tres entrenamientos por semana con entrenador en sala'}))+
      '<p class="tiny dim" id="tfAviso" style="margin:0;line-height:1.55"></p>'+
      (ex&&cuantos?'<div class="card card-pad" style="padding:11px 13px"><div class="tiny mut" '+
        'style="line-height:1.55">'+(cuantos===1?'1 socio tiene':cuantos+' socios tienen')+
        ' este plan contratado. Cambiar el precio no les cambia lo que ya pagaron: '+
        'aplica desde su próxima renovación.</div></div>':'')+
    '</div>',
    foot:'<button class="btn btn-gh" data-close>Cancelar</button>'+
         (ex?'<button class="btn btn-dg" id="tfDel">'+(cuantos?'Retirar':'Eliminar')+'</button>':'')+
         '<button class="btn btn-pri" id="tfSave">Guardar</button>',
    onMount(ov){
      ov.querySelector('[data-close]').onclick=closeModal;
      const aviso=ov.querySelector('#tfAviso');
      /* sugerencia viva de cuántas sesiones salen de la duración */
      const recalcular=()=>{
        const sem=+$('#tfS',ov).value||0, mes=+$('#tfM',ov).value||0;
        if(sem&&mes) aviso.textContent='A '+sem+' veces por semana durante '+
          (mes===1?'un mes':mes+' meses') +' salen unas '+Math.round(sem*4*mes)+' sesiones.';
        else aviso.textContent='';
      };
      ov.querySelector('#tfS').oninput=recalcular;
      ov.querySelector('#tfM').onchange=recalcular;
      recalcular();

      const del=ov.querySelector('#tfDel');
      if(del)del.onclick=()=>{
        if(cuantos){ P[clave].activo=false; }
        else { delete P[clave]; }
        DBX.save(); closeModal();
        window.CFNET.empujar('cf_borrar_plan',{p_clave:clave},r=>toast(r.msg,'ok'));
        window.CFR.render();
      };

      ov.querySelector('#tfSave').onclick=()=>{
        const nombre=$('#tfN',ov).value.trim();
        if(!nombre){toast('Escribe el nombre del plan','bad');return;}
        const meses=+$('#tfM',ov).value||1;
        const porSem=$('#tfS',ov).value===''?null:+$('#tfS',ov).value;
        const clases=$('#tfC',ov).value===''?null:+$('#tfC',ov).value;
        const precio=$('#tfP',ov).value===''?null:+$('#tfP',ov).value;
        if(precio!=null&&precio<0){toast('El precio no puede ser negativo','bad');return;}
        const desc=$('#tfD',ov).value.trim();
        const obj={n:nombre,price:precio,classes:clases,porSem:porSem,meses:meses,
                   desc:desc||null,activo:p.activo!==false};
        let k=clave;
        if(!k){
          k=codigo({porSem:porSem,meses:meses});
          let i=2; while(P[k]){ k=codigo({porSem:porSem,meses:meses})+'-'+i; i++; }
        }
        P[k]=Object.assign({color:'p-n',orden:p.orden},obj);
        DBX.save(); closeModal();
        window.CFNET.empujar('cf_guardar_plan',{d:{clave:k,nombre:nombre,precio:precio,
          clases:clases,por_semana:porSem,meses:meses,descripcion:desc,
          activo:obj.activo,orden:p.orden}}, r=>toast(r.msg,'ok'));
        window.CFR.render();
      };
    }});
};

/* ─── editor de bloque horario ──────────────────────────── */
M.classedit=function(cid){
  const ex=cid?Q.cls(cid):null;
  const coaches=Array.from(new Set(DBX.db.classes.map(x=>x.coach))).sort();
  const c = ex ? Object.assign({},ex) :
    {id:uid('c'),coach:coaches[0]||'',time:'18:00',days:[1,2,3,4,5],cap:16};
  modal({title:ex?'Editar bloque':'Nuevo bloque horario',
    sub:'Una hora de sala con un entrenador y un cupo',
    body:'<div class="grid" style="gap:15px">'+
      '<div class="grid g3" style="gap:11px">'+
        fld('ceC','Entrenador',sel('ceC',coaches.map(x=>[x,x]),c.coach))+
        fld('ceT','Hora de inicio',inp('ceT',{type:'time',val:c.time}))+
        fld('ceP','Aforo',inp('ceP',{type:'number',min:1,max:60,val:c.cap}))+'</div>'+
      '<div><p class="eyebrow" style="margin-bottom:10px">Días de la semana</p>'+
      '<div class="row" style="gap:6px">'+[1,2,3,4,5,6,0].map(d=>
        '<button class="btn '+(c.days.indexOf(d)>=0?'btn-pri':'btn-gh')+' btn-sm" data-cd="'+d+'" '+
        'style="min-width:54px">'+C.DOW[d]+'</button>').join('')+'</div></div>'+
      '<p class="tiny dim" style="margin:0;line-height:1.55">El bloque dura 60 minutos. Si ya hay otro bloque '+
      'a la misma hora ese día, el socio solo verá uno: revisa el horario antes de guardar.</p>'+
    '</div>',
    foot:'<button class="btn btn-gh" data-close>Cancelar</button>'+
         (ex?'<button class="btn btn-dg" id="ceDel">Eliminar</button>':'')+
         '<button class="btn btn-pri" id="ceSave">Guardar</button>',
    onMount(ov){
      let days=c.days.slice();
      ov.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{
        const d=+b.getAttribute('data-cd'), i=days.indexOf(d);
        if(i>=0)days.splice(i,1); else days.push(d);
        b.className='btn '+(days.indexOf(d)>=0?'btn-pri':'btn-gh')+' btn-sm';
      });
      ov.querySelector('[data-close]').onclick=closeModal;
      const del=ov.querySelector('#ceDel');
      if(del)del.onclick=()=>{
        const i=DBX.db.classes.findIndex(x=>x.id===cid);
        if(i>=0)DBX.db.classes.splice(i,1);
        DBX.save();closeModal();
        /* el club manda: si hay gente apuntada, lo devuelve y avisa */
        window.CFNET.empujar('cf_borrar_bloque',{p_id:cid},r=>toast(r.msg,'ok'));
        window.CFR.render();
      };
      ov.querySelector('#ceSave').onclick=()=>{
        if(!days.length){toast('Elige al menos un día','bad');return;}
        const obj={id:c.id,coach:$('#ceC',ov).value,time:$('#ceT',ov).value||'18:00',
          days:days.sort(),cap:+$('#ceP',ov).value||16};
        const i=DBX.db.classes.findIndex(x=>x.id===c.id);
        if(i>=0)DBX.db.classes[i]=obj; else DBX.db.classes.push(obj);
        DBX.save();closeModal();
        window.CFNET.empujar('cf_guardar_bloque',{d:obj},r=>toast(r.msg,'ok'));
        window.CFR.render();
      };
    }});
};
})();
</script>
<script>
(function(){
'use strict';
const C=window.CF,DBX=window.CFDB,Q=window.CFQ,A=window.CFA,G=window.CFG,S=window.CFS,V=window.CFV;
const toast=window.CFT,{modal,closeModal}=window.CFM,M=window.CFMOD;
const {ic,$,$$,esc,clamp,PEN,DOW,DOWL,MON,ymd,parseYmd,addDays,daysBetween,fmtD,fmtDL,
       today,nowMin,t2m,initials,rel}=C;
const addD=n=>ymd(addDays(new Date(),n));

/* ═══ NAVEGACIÓN POR ROL ══════════════════════════════════ */
const NAV={
  socio:[
    {sec:'Entrenar'},
    {k:'reservar', n:'Reservar',   i:'cal',  t:'Reservar tu hora',   s:'Elige el día, mira quién entrena y reserva'},
    {sec:'Mi progreso'},
    {k:'cuerpo',   n:'Mi cuerpo',  i:'body', t:'Mi cuerpo',          s:'Peso, talla y composición corporal'},
    {k:'nutricion',n:'Nutrición',  i:'leaf', t:'Mi plan nutricional',s:'Subido por la nutricionista del club'},
    {k:'progreso', n:'Progreso',   i:'chart',t:'Mi progreso',        s:'Asistencia, logros y ranking'}
  ],
  admin:[
    {sec:'Día a día'},
    {k:'hoy',    n:'Agenda',   i:'clock', t:'Agenda del día',    s:'Quién entrena a cada hora'},
    {k:'socios', n:'Socios',   i:'users', t:'Socios',            s:'Altas, renovaciones y fichas'},
    {sec:'Gestión'},
    {k:'riesgo', n:'Riesgo',   i:'alert', t:'Radar de abandono', s:'A quién llamar antes de que se vaya'},
    {k:'clases', n:'Horario',  i:'cal',   t:'Horario semanal',   s:'Bloques, entrenadores y cupos'},
    {k:'tarifas',n:'Planes',   i:'money', t:'Planes y precios',  s:'Qué vende el club y a qué precio'},
    {k:'panel',  n:'Estadísticas', i:'chart', t:'Estadísticas',  s:'Socios, ingresos, ocupación y asistencia'},
    {k:'cuentas',n:'Cuentas',      i:'user',  t:'Cuentas del club', s:'Quién entra al panel y con qué clave'},
    /* El club ve también lo del nutricionista: la misma cuenta lo abarca todo.
       Planes y Calculadora siguen en el código pero fuera del menú hasta que
       el club los pida: basta con volver a listarlos aquí. */
    {sec:'Consulta'},
    /* En el panel del club ya hay un «Socios»: aquí se llama por lo que trae,
       para que no salgan dos entradas con el mismo nombre. */
    {k:'pacientes',  n:'Cuerpo y dieta', i:'body',t:'Cuerpo y dieta',
     s:'Medidas, composición y planes nutricionales'}
  ],
  nutri:[
    /* La agenda va primero: lo pidió Alejandro. Es lo que Angelo y Meche
       miran al llegar — quién entra a cada hora — y las fichas vienen
       después, cuando toca medir a alguien. */
    {sec:'Día a día'},
    {k:'hoy',        n:'Agenda',      i:'clock',t:'Agenda del día', s:'Quién entrena a cada hora'},
    {sec:'Consulta'},
    {k:'pacientes',  n:'Socios',      i:'users',t:'Socios',     s:'Cuerpo, dieta y a quién toca medir'}
  ]
};
/* En el teléfono caben cinco. El resto vive en «Más». */
const TABS={socio:['reservar','cuerpo','nutricion','progreso'],
            admin:['hoy','socios','riesgo','pacientes','mas'],
            nutri:['hoy','pacientes']};
const MAS={n:'Más',i:'menu'};

function navItems(role){return NAV[role].filter(x=>x.k);}
/* el resto de secciones, para el teléfono */
function abrirMas(){
  const role=S.user.role;
  const fuera=navItems(role).filter(x=>TABS[role].indexOf(x.k)<0);
  window.CFM.modal({title:'Todo el panel',sub:'Las demás secciones',
    body:'<div class="grid" style="gap:7px">'+fuera.map(x=>
      '<button class="nav-i" data-ir="'+x.k+'" style="width:100%">'+ic(x.i,16)+
      '<span>'+esc(x.n)+'</span></button>').join('')+
      '<div class="hair" style="margin:5px 0"></div>'+
      '<button class="nav-i" id="masCuenta" style="width:100%">'+ic('user',16)+
      '<span>Mi cuenta</span></button>'+
      '<button class="nav-i" id="masSalir" style="width:100%;color:#FF9A9A">'+ic('out',16)+
      '<span>Cerrar sesión</span></button>'+
    '</div>',
    onMount(ov){
      ov.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>{
        S.route=b.getAttribute('data-ir'); window.CFM.closeModal(); render(); });
      ov.querySelector('#masCuenta').onclick=()=>{
        window.CFM.closeModal(); setTimeout(()=>document.getElementById('whoBtn').click(),80); };
      ov.querySelector('#masSalir').onclick=()=>{
        window.CFM.closeModal(); setTimeout(()=>window.CFSALIR(),80); };
    }});
}
function meta(role,k){return navItems(role).find(x=>x.k===k)||navItems(role)[0];}

/* ═══ ACCIONES DE LA BARRA SUPERIOR ═══════════════════════ */
function topActions(role,route){
  if(role==='socio'){
    if(route==='reservar')return '';
    if(route==='cuerpo')return '<button class="btn btn-gh btn-sm" data-go="progreso">Ver progreso</button>';
    if(route==='nutricion')return '<button class="btn btn-gh btn-sm" data-go="cuerpo">Mis medidas</button>';
    return '';
  }
  if(role==='admin'){
    if(route==='hoy')return S.user&&S.user.role==='admin'
      ? '<button class="btn btn-pri btn-sm" data-act="newmember">'+ic('plus',14)+' Socio</button>' : '';
    if(route==='socios')return '<button class="btn btn-pri btn-sm" data-act="newmember">'+ic('plus',14)+' Nuevo socio</button>';
    if(route==='clases')return '<button class="btn btn-pri btn-sm" data-act="newclass">'+ic('plus',14)+' Nuevo bloque</button>';
    if(route==='tarifas')return '<button class="btn btn-pri btn-sm" data-act="newtarifa">'+ic('plus',14)+' Nuevo plan</button>';
    return '';
  }
  if(role==='nutri'){
    if(route==='planes')return '<button class="btn btn-pri btn-sm" data-act="planedit">'+ic('plus',14)+' Nuevo plan</button>';
    if(route==='calculadora')return '<button class="btn btn-gh btn-sm" data-go="pacientes">Ver socios</button>';
    return '';
  }
  return '';
}

/* ═══ RENDER ══════════════════════════════════════════════ */
function render(){
  const u=S.user; if(!u)return;
  const role=u.role;
  const items=navItems(role);
  if(!items.some(x=>x.k===S.route))S.route=items[0].k;
  const mt=meta(role,S.route);

  /* rail */
  $('#railNav').innerHTML=NAV[role].map(x=>{
    if(x.sec)return '<div class="rail-sec">'+esc(x.sec)+'</div>';
    let badge='';
    if(x.k==='riesgo'){
      const n=DBX.db.members.filter(m=>Q.risk(m.id).lvl>=2).length;
      if(n)badge='<span class="nav-b hot">'+n+'</span>';
    }
    if(x.k==='reservar'&&role==='socio'){
      const n=DBX.db.bookings.filter(b=>b.m===u.id&&b.date>=today()&&b.st==='confirmada').length;
      if(n)badge='<span class="nav-b">'+n+'</span>';
    }
    if(x.k==='pacientes'){
      const n=DBX.db.members.filter(m=>{const l=Q.lastMeas(m.id);return !l||daysBetween(l.date,today())>45;}).length;
      if(n)badge='<span class="nav-b">'+n+'</span>';
    }
    return '<button class="nav-i'+(S.route===x.k?' on':'')+'" data-go="'+x.k+'">'+ic(x.i,17)+
      '<span>'+esc(x.n)+'</span>'+badge+'</button>';
  }).join('');

  /* identidad */
  $('#whoAv').textContent=initials(u.name);
  const tw=$('#tbWhoAv'); if(tw) tw.textContent=initials(u.name);
  $('#whoName').textContent=u.name;
  $('#whoRole').textContent = role==='socio'?(u.dni?'DNI '+u.dni:'Socio'):role==='admin'?'Administrador':'Nutricionista';

  /* barra superior */
  $('#tbH').textContent=mt.t;
  $('#tbS').textContent=mt.s;
  $('#tbA').innerHTML=topActions(role,S.route);

  /* tabs móviles */
  $('#tabsIn').innerHTML=TABS[role].map(k=>{
    if(k==='mas'){
      const fuera=navItems(role).filter(x=>TABS[role].indexOf(x.k)<0).map(x=>x.k);
      const aqui=fuera.indexOf(S.route)>=0;
      return '<button class="tab'+(aqui?' on':'')+'" data-go="mas">'+ic(MAS.i,19)+
             '<span>'+esc(MAS.n)+'</span></button>';
    }
    const x=meta(role,k);
    return '<button class="tab'+(S.route===k?' on':'')+'" data-go="'+k+'">'+ic(x.i,19)+'<span>'+esc(x.n)+'</span></button>';
  }).join('');

  /* vista */
  const fn=V[S.route];
  /* Al volver a dibujar la misma vista —reservar, cancelar, marcar— se
     conserva dónde estaba mirando. Solo se sube arriba al cambiar de vista. */
  const mismaVista = render._ruta===S.route && render._quien===(u.id||u.dni||u.code);
  const yWin = window.scrollY||document.documentElement.scrollTop||0;
  const yVis = $('#view').scrollTop;
  /* Guardar los píxeles no basta: al volver la respuesta del club, las
     tarjetas cambian de alto (una pasa a «Reservada») y el mismo píxel ya
     no es el mismo sitio. Se recuerda QUÉ tarjeta estaba arriba y a qué
     altura, y luego se vuelve a poner ahí. */
  let ancla=null;
  if(mismaVista){
    const todas=$('#view').querySelectorAll('[data-ancla]');
    for(const el of todas){
      const r=el.getBoundingClientRect();
      if(r.bottom>0){ ancla={k:el.getAttribute('data-ancla'),top:r.top}; break; }
    }
  }
  render._ruta=S.route; render._quien=u.id||u.dni||u.code;

  $('#view').classList.toggle('quieto',mismaVista);
  $('#view').innerHTML = fn ? fn(u) : '<div class="empty"><p>Vista no encontrada</p></div>';

  if(mismaVista){
    const recolocar=()=>{
      $('#view').scrollTop=yVis;
      if(yWin)window.scrollTo(0,yWin);
      if(!ancla)return;
      const el=$('#view').querySelector('[data-ancla="'+ancla.k.replace(/"/g,'')+'"]');
      if(!el)return;
      const d=el.getBoundingClientRect().top-ancla.top;
      if(Math.abs(d)<1)return;
      if($('#view').scrollHeight>$('#view').clientHeight+1) $('#view').scrollTop+=d;
      else window.scrollBy(0,d);
    };
    recolocar();
    /* el contenido puede tardar un cuadro en medir: se reafirma */
    requestAnimationFrame(recolocar);
  }else{
    $('#view').scrollTop=0;
    window.scrollTo(0,0);
  }

  /* el horario semanal se abre centrado en el día elegido (clave en móvil) */
  const wkw=$('#view').querySelector('.wk-wrap'), onh=$('#view').querySelector('.wk-h.on');
  if(wkw&&onh&&wkw.scrollWidth>wkw.clientWidth){
    const rw=wkw.getBoundingClientRect(), rh=onh.getBoundingClientRect();
    wkw.scrollLeft=Math.max(0,wkw.scrollLeft+(rh.left-rw.left)-(rw.width-rh.width)/2);
  }
  window.scrollTo({top:0,behavior:'auto'});
  afterRender();
}
window.CFR={render};

/* ═══ POST-RENDER ═════════════════════════════════════════ */
function afterRender(){
  /* la tira de días deja a la vista el día elegido */
  $$('.days').forEach(c=>{
    try{
      const on=c.querySelector('.day.on');
      if(!on||c.scrollWidth<=c.clientWidth+2)return;
      c.scrollLeft=Math.max(0,on.offsetLeft-(c.clientWidth-on.offsetWidth)/2);
    }catch(e){}
  });

  /* comparador de fotos */
  const cmp=$('#cmp');
  if(cmp){
    const set=e=>{
      const r=cmp.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
      S.cmp=clamp(x/r.width*100,2,98);
      cmp.style.setProperty('--sp',S.cmp+'%');
    };
    let on=false;
    const dn=e=>{on=true;set(e);e.preventDefault();};
    const mv=e=>{if(on)set(e);};
    const up=()=>{on=false;};
    cmp.addEventListener('mousedown',dn);cmp.addEventListener('touchstart',dn,{passive:false});
    window.addEventListener('mousemove',mv);window.addEventListener('touchmove',mv,{passive:true});
    window.addEventListener('mouseup',up);window.addEventListener('touchend',up);
  }
  /* búsquedas */
  /* «Cerrar mi sesión» de la pantalla de Cuentas */
  const sy=$('#salirYa');
  if(sy)sy.onclick=()=>window.CFSALIR();

  const sq=$('#socQ')||$('#pacQ');
  if(sq){
    sq.addEventListener('input',()=>{S.ctx.q=sq.value;
      clearTimeout(sq._t);sq._t=setTimeout(()=>{const p=sq.selectionStart;render();
        const n=$('#socQ')||$('#pacQ'); if(n){n.focus();try{n.setSelectionRange(p,p);}catch(e){}}},220);});
  }
  /* subida de foto */
  const pin=$('#photoIn');
  if(pin)pin.addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=420, sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        const data=cv.toDataURL('image/jpeg',0.72);
        const mid=S.user.id;
        if(!DBX.db.photos[mid])DBX.db.photos[mid]=[];
        DBX.db.photos[mid].push({date:today(),label:'Foto',img:data});
        DBX.db.photos[mid]=DBX.db.photos[mid].filter(p=>p.img).slice(-6);
        try{DBX.save();}catch(err){}
        toast('Foto guardada en este dispositivo','ok');render();
      };
      im.src=r.result;
    };
    r.readAsDataURL(f);
  });
}

/* ═══ EVENTOS ═════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('[data-go],[data-act],[data-k],[data-day],[data-filt],[data-bodymet],'+
    '[data-nutdow],[data-woday],[data-socf],[data-pacf],[data-chk],[data-w],[data-b],[data-wk],[data-rz]');
  if(!t)return;
  const g=n=>t.getAttribute(n);

  if(g('data-go')){
    const r=g('data-go');
    if(r==='mas'){abrirMas();return;}
    if(r==='reservar'&&S.route!=='reservar')S.day=V.firstOpenDay();
    if(r==='hoy'&&S.route!=='hoy')S.day=today();
    S.route=r;S.ctx.q='';render();return;
  }
  if(g('data-rz')){S.seg.rz=g('data-rz');render();return;}
  if(g('data-wk')){
    const lim = S.user&&S.user.role==='admin' ? [-1,4] : [0,1];
    S.wk=clamp(+g('data-wk'),lim[0],lim[1]);
    const w=V.weekDays(S.wk);
    S.day = w.indexOf(today())>=0 ? today() : w[0];
    render();return;
  }
  if(g('data-day')){S.day=g('data-day');render();return;}
  if(g('data-filt')){S.seg.cls=g('data-filt');render();return;}
  if(g('data-bodymet')){S.seg.body=g('data-bodymet');render();return;}
  if(g('data-nutdow')){S.ctx.nutDow=+g('data-nutdow');render();return;}
  if(g('data-woday')){S.seg.wo=g('data-woday');render();return;}
  if(g('data-socf')){S.seg.soc=g('data-socf');render();return;}
  if(g('data-pacf')){S.seg.pac=g('data-pacf');render();return;}

  /* marcar alimento · solo el día de hoy, y queda guardado */
  if(g('data-chk')){
    const k=g('data-chk'), t=today(), key=S.user.id+'|'+t;
    const pl=Q.plan(S.user.id);
    const grp=pl?V.planGroup(pl,parseYmd(t).getDay()):null;
    if(!grp)return;
    const cur=Object.assign({},DBX.db.checks[key]||{});
    /* si aún no había marcas propias, partimos de lo ya registrado */
    if(!DBX.db.checks[key]){
      const rec=DBX.db.adh[key];
      if(rec&&rec.done){let left=rec.done;
        grp.meals.forEach((me,mi)=>me.items.forEach((it,ii)=>{if(left>0){cur[mi+'-'+ii]=1;left--;}}));}
    }
    if(cur[k])delete cur[k]; else cur[k]=1;
    DBX.db.checks[key]=cur;
    const tot=grp.meals.reduce((a,me)=>a+me.items.length,0);
    A.setAdh(S.user.id,t,Object.keys(cur).length,tot||1);
    render();return;
  }
  /* vasos de agua */
  if(g('data-w')){
    const v=+g('data-w');
    const cur=Q.water(S.user.id,today());
    A.setWater(S.user.id,today(),cur===v?v-1:v);
    render();return;
  }

  const act=g('data-act'); if(!act)return;
  const mid=g('data-m'), cid=g('data-c'), date=g('data-d');

  if(act==='book'){
    const r=A.book(S.user.id,cid,date);
    toast(r.msg,r.ok?(r.st==='espera'?'info':'ok'):'bad');
    if(r.ok)render();
    return;
  }
  if(act==='cancel'){
    const r=A.cancel(S.user.id,cid,date);
    toast(r.msg,r.ok?(r.late?'info':'ok'):'bad');
    if(r.promoted)setTimeout(()=>toast(r.promoted.name.split(' ')[0]+' pasó de la lista de espera a la clase','info'),700);
    if(r.ok)render();
    return;
  }
  /* ── el club bloquea o libera una hora ── */
  if(act==='block'){
    const cl=Q.cls(cid);
    modal({title:'Bloquear las '+h12(cl.time),sub:fmtDL(date)+' · '+cl.coach,
      body:'<div class="grid" style="gap:12px">'+
        '<p class="tiny mut" style="margin:0;line-height:1.6">El socio verá esa hora como '+
        '<b>no disponible</b> y no podrá reservarla. Lo que ya estaba reservado se mantiene: '+
        'si quieres vaciarla, mueve o quita antes a cada persona.</p>'+
        '<div class="fld"><label for="blN">Motivo (lo ve solo el club)</label>'+
        '<input class="inp" id="blN" maxlength="60" placeholder="Mantenimiento, evento, clase privada…"></div></div>',
      foot:'<button class="btn btn-gh" data-x>Cancelar</button>'+
           '<button class="btn btn-pri" id="blOk">Bloquear</button>',
      onMount(ov){
        ov.querySelector('#blOk').onclick=()=>{
          const r=A.block(cid,date,ov.querySelector('#blN').value);
          closeModal();toast(r.msg,r.ok?'ok':'bad');if(r.ok)render();
        };
      }});
    return;
  }
  if(act==='unblock'){
    const r=A.unblock(cid,date);toast(r.msg,r.ok?'ok':'bad');if(r.ok)render();return;
  }

  /* ── apuntar a un socio del padrón, también si la hora ya pasó ── */
  if(act==='addsoc'){
    const cl=Q.cls(cid);
    const libres=Math.max(0,cl.cap-Q.taken(cid,date));
    const pas=Q.pasada(cid,date);
    const mesIni=date.slice(0,8)+'01';
    const base=DBX.db.members.filter(m=>!m.demo).map(m=>{
      const pl=plan(m.plan);
      const usadas=DBX.db.bookings.filter(b=>b.m===m.id&&b.date>=mesIni&&
        ['confirmada','asistio'].indexOf(b.st)>=0).length;
      const ya=!!Q.booking(m.id,cid,date);
      const otra=!ya&&DBX.db.bookings.some(b=>b.m===m.id&&b.date===date&&
        ['confirmada','asistio','espera'].indexOf(b.st)>=0&&Q.cls(b.c)&&Q.cls(b.c).time===cl.time);
      return {m,pl,usadas,ya,otra,
        venc:!!(m.planEnd&&daysBetween(date,m.planEnd)<0),
        k:(m.name+' '+(m.dni||'')).toLowerCase()};
    }).sort((a,b)=>(a.m.active===b.m.active?0:a.m.active?-1:1)||a.m.name.localeCompare(b.m.name));

    const fila=x=>{
      const m=x.m;
      const no = x.ya?'Ya está en esta hora' : x.otra?'Ocupado a las '+h12(cl.time) : '';
      const avisos=[];
      if(!m.active) avisos.push('Inactivo');
      else if(x.venc) avisos.push('Vencido');
      else if(x.pl.classes&&x.usadas>=x.pl.classes) avisos.push('Sin clases');
      return '<button class="pk'+(no?' off':'')+'"'+(no?' disabled':' data-pk="'+m.id+'"')+'>'+
        '<span class="av sm gh">'+esc(initials(m.name))+'</span>'+
        '<span class="pk-m"><b>'+esc(m.name)+'</b><span class="tiny dim">'+
          esc(ident(m))+(x.pl.classes?' · '+x.usadas+'/'+x.pl.classes+' este mes':'')+
          ' · '+esc(x.pl.n)+'</span></span>'+
        '<span class="pk-s">'+(no?'<span class="tiny dim">'+esc(no)+'</span>'
          :avisos.length?'<span class="pill p-warn">'+esc(avisos[0])+'</span>'
          :'<span class="tiny dim pk-add">Añadir</span>')+'</span></button>';
    };

    modal({title:'Añadir socio',sub:'Las '+h12(cl.time)+' del '+fmtDL(date)+' · '+cl.coach,
      body:'<div class="grid" style="gap:11px">'+
        '<p class="tiny mut" style="margin:0;line-height:1.6">Quedan <b>'+libres+'</b> de los '+cl.cap+
          ' cupos de la hora.'+(pas?' Esa hora ya pasó: quien apuntes entra con la asistencia marcada.'
          :' Entra confirmado, sin pasar por lista de espera.')+'</p>'+
        '<div class="fld"><input class="inp" id="skQ" maxlength="40" autocomplete="off" '+
          'placeholder="Buscar por nombre o DNI"></div>'+
        '<div class="pk-l" id="skL"></div></div>',
      onMount(ov){
        const L=ov.querySelector('#skL'), inp=ov.querySelector('#skQ');
        const pinta=()=>{
          const q=inp.value.trim().toLowerCase();
          const r=base.filter(x=>!q||x.k.indexOf(q)>=0).slice(0,40);
          L.innerHTML=r.length?r.map(fila).join('')
            :'<p class="tiny dim" style="padding:12px 2px;margin:0">Ningún socio con ese nombre o DNI.</p>';
          L.querySelectorAll('[data-pk]').forEach(btn=>btn.onclick=()=>{
            const r2=A.bookMember(cid,date,btn.getAttribute('data-pk'));
            if(!r2.ok){toast(r2.msg,'bad');return;}
            closeModal();toast(r2.msg,'ok');render();
          });
        };
        inp.addEventListener('input',pinta); pinta();
      }});
    return;
  }

  /* ── invitado: ocupa un cupo sin entrar al padrón ── */
  if(act==='addinv'){
    const cl=Q.cls(cid);
    modal({title:'Añadir invitado',sub:'Las '+h12(cl.time)+' del '+fmtDL(date)+' · '+cl.coach,
      body:'<div class="grid" style="gap:12px">'+
        '<p class="tiny mut" style="margin:0">Ocupa un cupo como cualquier socio, pero no entra al padrón.</p>'+
        '<div class="fld"><label for="ivN">Nombre del invitado</label>'+
        '<input class="inp" id="ivN" maxlength="40" autocapitalize="words" placeholder="Nombre y apellido"></div></div>',
      foot:'<button class="btn btn-gh" data-x>Cancelar</button>'+
           '<button class="btn btn-pri" id="ivOk">Añadir</button>',
      onMount(ov){
        const go=()=>{const r=A.addGuest(cid,date,ov.querySelector('#ivN').value);
          if(!r.ok){toast(r.msg,'bad');return;} closeModal();toast(r.msg,'ok');render();};
        ov.querySelector('#ivOk').onclick=go;
        ov.querySelector('#ivN').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
        ov.querySelector('#ivN').focus();
      }});
    return;
  }

  /* ── quitar a alguien de una hora ── */
  if(act==='dropbk'){
    const bid=g('data-b'), b=DBX.db.bookings.find(x=>x.id===bid);
    if(!b)return;
    const quien=b.inv||(Q.member(b.m)||{}).name||'esta reserva';
    const cl=Q.cls(b.c);
    modal({title:'Quitar de las '+h12(cl.time),sub:quien,
      body:'<p class="tiny mut" style="margin:0;line-height:1.6">Se libera el cupo y, si hay lista de espera, '+
        'entra la primera persona. Esto no se puede deshacer.</p>',
      foot:'<button class="btn btn-gh" data-x>Cancelar</button>'+
           '<button class="btn btn-dg" id="dpOk">Quitar</button>',
      onMount(ov){
        ov.querySelector('#dpOk').onclick=()=>{
          const r=A.drop(bid);closeModal();toast(r.msg,r.ok?'ok':'bad');
          if(r.sube)setTimeout(()=>toast(r.sube.split(' ')[0]+' pasó de la lista de espera a la clase','info'),700);
          if(r.ok)render();
        };
      }});
    return;
  }

  /* ── mover a alguien a otra hora del mismo día ── */
  if(act==='movebk'){
    const bid=g('data-b'), b=DBX.db.bookings.find(x=>x.id===bid);
    if(!b)return;
    const quien=b.inv||(Q.member(b.m)||{}).name||'esta reserva';
    const cl=Q.cls(b.c);
    const opciones=Q.sessions(b.date).filter(x=>x.id!==b.c).map(x=>{
      const libre=x.cap-Q.taken(x.id,b.date);
      const bl=Q.blocked(x.id,b.date);
      const ya=b.m!=='_inv'&&Q.booking(b.m,x.id,b.date);
      const no=bl?'Bloqueada':libre<=0?'Sin cupos':ya?'Ya tiene reserva aquí':'';
      return '<button class="mv'+(no?' off':'')+'"'+(no?' disabled':' data-mv="'+x.id+'"')+'>'+
        '<span class="mv-h">'+esc(h12(x.time))+'</span>'+
        '<span class="mv-m"><b>'+esc(x.coach)+'</b><span class="tiny dim">'+
          (no||libre+' de '+x.cap+' cupos libres')+'</span></span></button>';
    }).join('');
    modal({title:'Mover a otra hora',sub:quien+' · '+fmtDL(b.date)+' a las '+h12(cl.time),
      body:'<div class="mv-l">'+(opciones||'<p class="tiny dim">No hay otra hora ese día.</p>')+'</div>',
      onMount(ov){
        ov.querySelectorAll('[data-mv]').forEach(btn=>btn.onclick=()=>{
          const r=A.move(bid,btn.getAttribute('data-mv'));
          if(!r.ok){toast(r.msg,'bad');return;}
          closeModal();toast(r.msg,'ok');render();
        });
      }});
    return;
  }

  if(act==='checkin'){const r=A.checkin(S.user.id);toast(r.msg,r.ok?'ok':'bad');if(r.ok)render();return;}
  if(act==='wodone'){
    const k=g('data-k');
    const i=DBX.db.notes.findIndex(n=>n.k===k);
    if(i>=0){DBX.db.notes.splice(i,1);toast('Sesión desmarcada','info');}
    else{DBX.db.notes.push({k,d:today()});toast('Sesión marcada como completada','ok');}
    DBX.save();render();return;
  }
  if(act==='newmember'){M.newmember();return;}
  if(act==='member'){M.member(mid);return;}
  if(act==='paciente'){M.paciente(mid);return;}
  if(act==='editsoc'){M.editar(mid);return;}
  if(act==='pinreset'){M.pinreset(mid);return;}
  if(act==='resetstaff'){
    const u=g('data-u');
    const c=(DBX.db.cuentas||[]).find(x=>x.usuario===u); if(!c)return;
    modal({title:'Volver la clave a 0000',sub:c.nombre,
      body:'<p class="tiny mut" style="margin:0;line-height:1.7">La clave de <b>'+esc(c.nombre)+'</b> '+
        'vuelve a ser <b>0000</b> y la app le pedirá elegir un PIN nuevo la próxima vez que entre.<br><br>'+
        'Mientras tanto cualquiera que sepa su DNI podría entrar con 0000 y quedarse con la cuenta, '+
        'así que hazlo cuando esa persona esté lista para entrar.</p>',
      foot:'<button class="btn btn-gh" data-x>Cancelar</button>'+
           '<button class="btn btn-pri" id="rsOk">Volver a 0000</button>',
      onMount(ov){
        ov.querySelector('#rsOk').onclick=async()=>{
          const btn=ov.querySelector('#rsOk'); btn.disabled=true; btn.textContent='Un momento…';
          let r=null;
          try{ r=await window.CFNET.rpc('cf_reset_clave_staff',
                 {p_token:window.CFNET.ses.token,p_usuario:u}); }catch(e){}
          closeModal();
          toast((r&&r.msg)||'No se pudo: revisa la conexión',(r&&r.ok)?'ok':'bad');
          if(r&&r.ok){ window.CFNET.toca(); await window.CFNET.sincronizar(); render(); }
        };
      }});
    return;
  }
  if(act==='norepe'){
    const r=A.noSonLaMisma(g('data-k'));
    toast(r.msg,'ok'); render(); return;
  }
  if(act==='wa'){M.wa(mid);return;}
  if(act==='renew'){M.renew(mid);return;}
  if(act==='measure'){M.measure(mid);return;}
  if(act==='planedit'){M.planedit(mid);return;}
  if(act==='tarifa'){M.tarifa(g('data-k'));return;}
  if(act==='newtarifa'){M.tarifa(null);return;}
  if(act==='planview'){M.planview(g('data-p'));return;}
  if(act==='newclass'){M.classedit(null);return;}
  if(act==='editclass'){M.classedit(cid);return;}
  if(act==='mark'){
    const b=DBX.db.bookings.find(x=>x.id===g('data-b'));
    if(b&&!/^[0-9a-f]{8}-[0-9a-f]{4}/i.test(String(b.id))){
      toast('Esa reserva se está guardando en el club. Espera un segundo.','bad');return;}
    if(b){b.st='asistio';DBX.save();
      window.CFNET.empujar('cf_marcar',{p_reserva:b.id,p_estado:'asistio'});
      toast('Asistencia marcada','ok');render();}

  }

/* ═══ LOGIN ═══════════════════════════════════════════════ */
/* La app sale a producción: no hay cuentas de prueba ni atajos de entrada.
   El club entra con su usuario y su PIN (DBX.STAFF) y el socio con su DNI. */
function mountLogin(){
  /* Las cuentas del club NO se anuncian en la pantalla de entrada:
     cualquier socio las vería y entraría a datos que no le tocan. */
  $('#loginForm').addEventListener('submit',e=>{e.preventDefault();tryLogin();});
}
/* El padrón no está en esta página: quien entra lo comprueba el club.
   Si son solo números es el DNI de un socio; si no, una cuenta del club. */
const NET = window.CFNET;
let entrando = false;

async function tryLogin(){
  if(entrando) return;
  const bruto=$('#liCode').value.trim(), pin=$('#liPin').value.trim();
  const err=$('#loginErr'), btn=$('#loginForm button[type=submit]');
  if(!bruto){ err.textContent='Escribe tu DNI'; return; }
  if(!pin){ err.textContent='Escribe tu PIN'; return; }
  err.textContent=''; entrando=true; btn.disabled=true;
  const antes=btn.textContent; btn.textContent='Entrando…';
  let r=null, red=false;
  try{
    r = /^[0-9]+$/.test(bruto)
      ? await NET.rpc('cf_entrar',{p_dni:bruto,p_pin:pin})
      : await NET.rpc('cf_entrar_staff',{p_usuario:bruto.toLowerCase(),p_clave:pin});
  }catch(e){ red=true; }
  entrando=false; btn.disabled=false; btn.textContent=antes;
  if(red){ err.textContent='No hay conexión con el club. Revisa tu internet y vuelve a probar.'; return; }
  if(!r || !r.ok){ err.textContent=(r&&r.msg)||'No pudimos entrar'; return; }
  if(r.estrena){ pedirPin({dni:r.dni,name:r.nombre,vieja:pin}); return; }
  abrirSesion(r);
}

/* Guarda la sesión, pide el estado y abre la app. */
async function abrirSesion(r){
  const err=$('#loginErr');
  NET.guardar({token:r.token,rol:r.rol,nombre:r.nombre,titulo:r.titulo||'',dni:r.dni||'',
               vistas:r.vistas||null});
  err.textContent='Cargando tus datos…';
  const ok = await NET.sincronizar();
  if(!ok){
    NET.cerrar();
    err.textContent='El club no contesta ahora mismo. Vuelve a probar en un momento.';
    return;
  }
  err.textContent='';
  montarUsuario();
}

/* Con el estado ya en la mano, deja a la vista lo que le toca a cada uno. */
function montarUsuario(){
  const se=NET.ses; if(!se) return;
  if(se.rol==='socio'){
    const m = Q.member(se.yo) || DBX.db.members[0];
    if(!m){ NET.cerrar(); $('#loginErr').textContent='El club no pudo darnos tu ficha'; return; }
    S.user={role:'socio',id:m.id,name:m.name,dni:m.dni};
    S.route='reservar';
  }else{
    S.user={role:se.rol,name:se.nombre,code:se.rol.toUpperCase(),title:se.titulo};
    S.route=NAV[se.rol].filter(x=>x.k)[0].k;
  }
  enter();
}

/* ═══ CREAR EL PIN LA PRIMERA VEZ ═════════════════════════
   El socio ya está en el padrón del club con su plan y sus fechas:
   esto solo le pone clave a esa ficha, no crea una cuenta nueva. */
let pinDe=null;
function pedirPin(m){
  pinDe=m;
  $('#loginErr').textContent='';
  $('#pinErr').textContent='';
  $('#pnA').value='';$('#pnB').value='';
  $('#pinHola').innerHTML='Hola, <b>'+esc(m.name.split(' ')[0])+'</b>. Entraste con la clave '+
    'del club: elige ahora tu PIN de 4 números. Es el que usarás de aquí en adelante y '+
    'nadie más lo conoce.';
  $('#loginForm').hidden=true;
  $('#pinForm').hidden=false;
  $('#pnA').focus();
}
function volverAlLogin(){
  pinDe=null;
  $('#pinForm').hidden=true;
  $('#loginForm').hidden=false;
  $('#liPin').value='';
  $('#liCode').focus();
}
async function guardarPin(){
  const a=$('#pnA').value.trim(), b=$('#pnB').value.trim(), err=$('#pinErr');
  if(!/^\d{4}$/.test(a)){err.textContent='El PIN son 4 números';return;}
  if(a===Q.PIN0){err.textContent='Esa es la clave del club: elige una tuya';return;}
  if(/^(\d)\1+$/.test(a)){err.textContent='Elige un PIN menos obvio: no todos los números iguales';return;}
  if(/^(0123|1234|2345|3456|4567|5678|6789|9876|4321)$/.test(a)){
    err.textContent='Elige un PIN menos obvio: nada de números seguidos';return;}
  if(a!==b){err.textContent='Los dos PIN no coinciden';return;}
  if(!pinDe){volverAlLogin();return;}
  const btn=$('#pinForm button[type=submit]');
  btn.disabled=true; const antes=btn.textContent; btn.textContent='Guardando…';
  let r=null, red=false;
  try{
    r = await NET.rpc('cf_estrenar_pin',{p_dni:pinDe.dni,p_viejo:pinDe.vieja,p_nuevo:a});
  }catch(e){ red=true; }
  btn.disabled=false; btn.textContent=antes;
  if(red){ err.textContent='No hay conexión con el club. Vuelve a probar.'; return; }
  if(!r || !r.ok){ err.textContent=(r&&r.msg)||'No se pudo guardar el PIN'; return; }
  pinDe=null;
  $('#pinForm').hidden=true; $('#loginForm').hidden=false;
  toast('Listo, tu PIN quedó guardado','ok');
  abrirSesion(r);
}
function enter(){
  $('#loginErr').textContent='';
  $('#login').hidden=true;
  $('#app').hidden=false;
  S.day=null;S.seg={};S.ctx={};
  render();
}
function logout(){
  NET.cerrar();
  salirDeLaApp();
}
function salirDeLaApp(caducada){
  S.user=null;
  $('#app').hidden=true;
  $('#login').hidden=false;
  $('#liPin').value='';
  $('#loginErr').textContent = caducada
    ? 'Tu sesión caducó por seguridad: vuelve a entrar.' : '';
  try{ localStorage.removeItem('clubfitness.db'); }catch(e){}
}
/* CFNET llama aquí si el club da la sesión por caducada */
window.CFLOGOUT = salirDeLaApp;

/* ═══ CAMBIAR DE VISTA · CUENTAS PROVISIONALES ════════════
   Mientras el club revisa la app existen dos cuentas de prueba
   (Administración y Nutrición) y se mira también la app como la
   ve un socio. Desde el menú de cuenta se salta entre las tres
   sin salir y volver a entrar.

   La contraseña NO viaja en esta página: el salto se pide con el
   token que ya se tiene y el club decide. Solo deja saltar a
   quien entró con una de esas cuentas de prueba; un socio que
   entra con su DNI y su PIN nunca puede saltar a Administración.

   Cuando el club termine de revisar, se borran esas cuentas y
   esto se apaga solo: el servidor deja de mandar la lista y el
   bloque no se pinta. */
function vistasDeLaCuenta(){
  const se=NET.ses;
  return (se && Array.isArray(se.vistas) && se.vistas.length) ? se.vistas : null;
}
const ICO_VISTA={admin:'shield',nutri:'leaf',socio:'user'};
function bloqueDeVistas(actual){
  const v=vistasDeLaCuenta(); if(!v) return '';
  return '<div class="hair"></div>'+
    '<p class="eyebrow" style="margin:0">Cambiar de cuenta</p>'+
    '<p class="tiny dim" style="margin:-7px 0 1px">Cuentas de prueba, mientras el club '+
      'revisa la app. Se cambia al toque, sin volver a entrar.</p>'+
    v.map(x=>{
      const aqui = x.k===actual;
      return '<button class="nav-i" type="button" data-vista="'+esc(x.k)+'"'+
        (aqui?' disabled style="width:100%;background:var(--panel2);color:var(--text)"'
             :' style="width:100%"')+'>'+
        ic(ICO_VISTA[x.k]||'user',16)+
        '<span style="flex:1;min-width:0">'+esc(x.n||x.k)+
          '<span class="tiny dim" style="display:block;font-weight:600;margin-top:1px">'+
          esc(x.t||'')+'</span></span>'+
        (aqui ? '<span class="tiny dim" style="flex:none">Estás aquí</span>'
              : ic('right',14))+
      '</button>';
    }).join('');
}
async function cambiarDeVista(k){
  const se=NET.ses; if(!se||!se.token) return;
  let r=null;
  try{ r = await NET.rpc('cf_cambiar_cuenta',{p_token:se.token,p_a:k}); }
  catch(e){ toast('Sin conexión: no pudimos cambiar de cuenta','bad'); return; }
  if(!r || !r.ok){
    if(r && r.motivo==='sesion'){ NET.cerrar(true); return; }
    toast((r&&r.msg)||'No pudimos cambiar de cuenta','bad'); return;
  }
  /* lo que hay guardado en el teléfono es del que se va: se tira
     antes de pedirle al club los datos del que entra. */
  DBX.reset();
  NET.guardar({token:r.token,rol:r.rol,nombre:r.nombre,titulo:r.titulo||'',
               dni:r.dni||'',vistas:r.vistas||null});
  const ok = await NET.sincronizar();
  if(!ok){ toast('El club no contesta ahora mismo','bad'); logout(); return; }
  montarUsuario();
  toast('Ahora estás como '+(r.nombre||k),'ok');
}

/* ═══ EDITAR MIS DATOS ════════════════════════════════════
   El socio corrige su nombre y cambia su PIN. Nada más: el plan,
   las fechas y las sesiones los lleva el club desde su panel. */
function partirNombre(m){
  if(m.nom!=null||m.ape!=null)return {nom:m.nom||'',ape:m.ape||''};
  const p=String(m.name||'').trim().split(/\s+/).filter(Boolean);
  if(p.length<=1)return {nom:p[0]||'',ape:''};
  if(p.length===2)return {nom:p[0],ape:p[1]};
  if(p.length===3)return {nom:p[0],ape:p.slice(1).join(' ')};
  return {nom:p.slice(0,p.length-2).join(' '),ape:p.slice(-2).join(' ')};
}
function editarMisDatos(){
  const m=Q.member(S.user.id); if(!m)return;
  const q=partirNombre(m);
  modal({title:'Mis datos',sub:identL(m),
    body:'<div class="grid" style="gap:14px">'+
      '<div class="fld"><label for="edNom">Nombres</label>'+
        '<input class="inp" id="edNom" value="'+esc(q.nom)+'" maxlength="40" autocapitalize="words"></div>'+
      '<div class="fld"><label for="edApe">Apellidos</label>'+
        '<input class="inp" id="edApe" value="'+esc(q.ape)+'" maxlength="40" autocapitalize="words"></div>'+
      '<div class="hair"></div>'+
      '<p class="eyebrow">Cambiar el PIN</p>'+
      '<p class="tiny dim" style="margin:-6px 0 0">Déjalo en blanco si no quieres cambiarlo.</p>'+
      '<div class="fld"><label for="edP0">PIN actual</label>'+
        '<input class="inp" id="edP0" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>'+
      '<div class="fld"><label for="edP1">PIN nuevo</label>'+
        '<input class="inp" id="edP1" type="password" inputmode="numeric" maxlength="4" placeholder="4 números"></div>'+
      '<div class="fld"><label for="edP2">Repite el PIN nuevo</label>'+
        '<input class="inp" id="edP2" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>'+
      '<p class="login-err" id="edErr" style="margin:0"></p>'+
    '</div>',
    foot:'<button class="btn btn-gh" data-x>Cancelar</button>'+
         '<button class="btn btn-pri" id="edOk">Guardar</button>',
    onMount(ov){
      /* El PIN no se comprueba aquí: lo comprueba el club, que es quien
         lo guarda. Antes se miraba contra una copia local que nunca
         llegaba del servidor, así que el socio no podía cambiarlo. */
      ov.querySelector('#edOk').onclick=async()=>{
        const err=ov.querySelector('#edErr');
        const nom=ov.querySelector('#edNom').value.trim();
        const ape=ov.querySelector('#edApe').value.trim();
        const p0=ov.querySelector('#edP0').value.trim();
        const p1=ov.querySelector('#edP1').value.trim();
        const p2=ov.querySelector('#edP2').value.trim();
        if(!nom){err.textContent='Escribe tus nombres';return;}
        if(!ape){err.textContent='Escribe tus apellidos';return;}
        if(p0||p1||p2){
          if(!p0){err.textContent='Escribe tu PIN actual';return;}
          if(!/^\d{4}$/.test(p1)){err.textContent='El PIN nuevo son 4 números';return;}
          if(p1===Q.PIN0){err.textContent='Esa es la clave del club: elige una tuya';return;}
          if(/^(\d)\1+$/.test(p1)){err.textContent='Elige un PIN menos obvio';return;}
          if(p1!==p2){err.textContent='Los dos PIN nuevos no coinciden';return;}
        }
        const btn=ov.querySelector('#edOk');
        btn.disabled=true; const antes=btn.textContent; btn.textContent='Guardando…';
        const NET=window.CFNET;
        let fallo='';
        try{
          if(p1){
            const r=await NET.rpc('cf_cambiar_pin',{p_token:NET.ses.token,p_viejo:p0,p_nuevo:p1});
            if(!r||!r.ok) fallo=(r&&r.msg)||'No se pudo cambiar el PIN';
          }
          if(!fallo){
            const r2=await NET.rpc('cf_mi_nombre',{p_token:NET.ses.token,p_nombre:nom+' '+ape});
            if(!r2||!r2.ok) fallo=(r2&&r2.msg)||'No se pudo guardar el nombre';
          }
        }catch(e){ fallo='No hay conexión con el club. Vuelve a intentarlo.'; }
        btn.disabled=false; btn.textContent=antes;
        if(fallo){err.textContent=fallo;return;}
        m.nom=nom; m.ape=ape; m.name=nom+' '+ape;
        DBX.save();
        S.user.name=m.name;
        closeModal();
        toast(p1?'Listo: tu nombre y tu PIN nuevo quedaron guardados':'Datos guardados','ok');
        NET.toca(); await NET.sincronizar(); render();
      };
    }});
}

/* atajos de teclado */
document.addEventListener('keydown',e=>{
  if(!S.user||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  const items=navItems(S.user.role);
  const n=parseInt(e.key,10);
  if(n>=1&&n<=items.length){S.route=items[n-1].k;render();}
});

(async function(){
  if(!NET.hay){ $('#liCode').focus(); return; }
  $('#loginErr').textContent='Entrando…';
  const ok = await NET.sincronizar();
  if(ok){ montarUsuario(); return; }
  if(NET.caido){
    $('#loginErr').textContent='No hay conexión con el club. Revisa tu internet.';
  }else{
    NET.cerrar(); $('#loginErr').textContent='';
  }
  $('#liCode').focus();
})();

/* ═══ VERSIÓN NUEVA ═══════════════════════════════════════
   La app se actualiza sola, como cualquier app del celular. Solo
   espera y enseña el botón si estás a medio escribir o con una
   ventana abierta. Los datos viven en este navegador y no se tocan. */
const VER={nueva:'',reloj:0,yendo:false};
function ocupado(){
  try{
    if(document.querySelector('.ov'))return true;          /* hay una ventana abierta */
    const a=document.activeElement;
    if(a&&/^(input|textarea|select)$/i.test(a.tagName)&&String(a.value||'').trim())return true;
  }catch(e){}
  return false;
}
function revisarVersion(){
  if(typeof CF_VERSION!=='string'||!/^\d{12}$/.test(CF_VERSION)||VER.yendo)return Promise.resolve(false);
  if(location.protocol==='file:')return Promise.resolve(false);   /* abierto como archivo suelto */
  return fetch(location.pathname+'?revisar='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.text():'')
    .then(t=>{
      const m=t.match(/CF_VERSION = '(\d{12})'/);
      if(!m||m[1]<=CF_VERSION)return false;
      let intento='';try{intento=sessionStorage.getItem('cf-ver-intento')||'';}catch(e){}
      if(m[1]<=intento)return false;   /* ya se recargó por esa versión: nada de bucles */
      VER.nueva=m[1];
      return actualizarSola();
    }).catch(()=>false);
}
function actualizarSola(){
  if(!VER.nueva||VER.yendo)return false;
  if(ocupado()){
    $('#nueva').hidden=false;
    if(!VER.reloj)VER.reloj=setInterval(()=>{if(!ocupado())actualizarSola();},4000);
    return false;
  }
  clearInterval(VER.reloj);VER.reloj=0;VER.yendo=true;
  $('#nueva').hidden=true;
  instalarVersion();
  return true;
}
function instalarVersion(){
  try{sessionStorage.setItem('cf-ver-intento',VER.nueva||'');}catch(e){}
  location.replace(location.pathname+'?v='+(VER.nueva||Date.now()));
}
$('#bNueva').addEventListener('click',()=>{
  $('#bNueva').textContent='Actualizando…';VER.yendo=true;instalarVersion();
});
(function vigilarVersion(){
  try{
    if(/[?&]v=\d+/.test(location.search))
      history.replaceState(null,'',location.pathname);
  }catch(e){}
  setTimeout(revisarVersion,4000);
  setInterval(revisarVersion,10*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)revisarVersion();});
  window.addEventListener('pageshow',ev=>{if(ev.persisted)revisarVersion();});  /* iPhone: vuelve de memoria sin recargar */
})();

/* instalable en el celular; el service worker pide siempre al servidor
   y solo usa la copia guardada si no hay internet */
if('serviceWorker' in navigator &&
   (location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
